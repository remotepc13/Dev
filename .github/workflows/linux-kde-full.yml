      # ============================================================
      # 20 — CLOUDFLARE QUICK TUNNEL
      # ============================================================

      - name: "☁️ Start Cloudflare Quick Tunnel"
        if: ${{ inputs.enable_cloudflare }}
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║               ☁️ CLOUDFLARE QUICK TUNNEL                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          # Remove old container.
          docker rm -f adiban-cloudflared 2>/dev/null || true


          echo "☁️ Starting cloudflared..."


          docker run \
            --detach \
            --name adiban-cloudflared \
            --network host \
            --pull always \
            cloudflare/cloudflared:latest \
            tunnel \
            --no-autoupdate \
            --url "https://${WEBTOP_HOST}:${WEBTOP_PORT}" \
            --no-tls-verify


          echo ""
          echo "⏳ Waiting for Cloudflare URL..."
          echo ""


          URL=""

          for i in $(seq 1 60); do

            URL=$(
              docker logs \
                adiban-cloudflared \
                2>&1 \
                | grep -Eo \
                  'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                | tail -n 1 \
                || true
            )


            if [ -n "${URL}" ]; then
              break
            fi


            printf "  ⏳ [%02d/60] waiting for tunnel...\n" "$i"

            sleep 2

          done


          if [ -z "${URL}" ]; then

            echo ""
            echo "::error::❌ Cloudflare public URL was not detected."

            echo ""
            echo "📋 cloudflared logs:"
            docker logs \
              --tail 200 \
              adiban-cloudflared || true

            exit 1
          fi


          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  🟢 DESKTOP ONLINE                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "🌍 PUBLIC URL:"
          echo ""
          echo "${URL}"
          echo ""


          # Export for later steps.
          echo "WEBTOP_PUBLIC_URL=${URL}" >> "$GITHUB_ENV"


          {
            echo ""
            echo "---"
            echo ""

            echo "# 🌍 Remote Desktop"
            echo ""

            echo "## 🚀 **KDE Plasma is Ready**"
            echo ""

            echo "### 🔗 [OPEN ADIBAN CLOUD LINUX](${URL})"
            echo ""

            echo "| Service | Status |"
            echo "|---|:---:|"
            echo "| 🖥️ KDE Plasma | 🟢 ONLINE |"
            echo "| 🌊 Wayland | 🟢 ONLINE |"
            echo "| ☁️ Cloudflare | 🟢 CONNECTED |"
            echo "| 🌐 Public URL | [Open Desktop](${URL}) |"
            echo "| ⏱️ Maximum Runtime | **6 hours** |"
            echo ""

            echo "> ⚠️ **Temporary TryCloudflare URL**"
            echo ">"
            echo "> The URL will disappear when the GitHub Actions job ends."
            echo ""

          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 21 — FINAL CONNECTION CHECK
      # ============================================================

      - name: "🔗 Verify Public Tunnel"
        if: ${{ inputs.enable_cloudflare }}
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "🔗 Testing public endpoint..."
          echo ""

          if [ -z "${WEBTOP_PUBLIC_URL:-}" ]; then
            echo "::error::❌ Public URL is missing."
            exit 1
          fi


          echo "🌍 URL:"
          echo "${WEBTOP_PUBLIC_URL}"
          echo ""


          HTTP_CODE=$(
            curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 30 \
              "${WEBTOP_PUBLIC_URL}" \
              || true
          )


          echo "📡 HTTP status: ${HTTP_CODE}"


          case "${HTTP_CODE}" in

            2*)
              echo "🟢 Public endpoint reachable."
              ;;

            3*)
              echo "🟡 Public endpoint returned redirect."
              ;;

            *)
              echo "⚠️ Public endpoint returned ${HTTP_CODE}."
              ;;

          esac


