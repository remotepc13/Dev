name: ADIBAN Cloud Linux Desktop

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-26.04

      timezone:
        description: Container timezone
        required: true
        default: Europe/Berlin
        type: string

      workspace_name:
        description: Workspace name
        required: true
        default: adiban-cloud
        type: string

      session_hours:
        description: Maximum session length in hours
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

      install_python:
        description: Install Python 3.13
        required: true
        default: true
        type: boolean

      install_node:
        description: Install Node.js 22
        required: true
        default: true
        type: boolean

      install_firefox:
        description: Install Firefox
        required: true
        default: true
        type: boolean

      install_chrome:
        description: Install Google Chrome
        required: true
        default: true
        type: boolean

      install_vscode:
        description: Install Visual Studio Code
        required: true
        default: true
        type: boolean

      install_opencode:
        description: Install OpenCode CLI
        required: true
        default: true
        type: boolean

      install_antigravity:
        description: Install Google Antigravity GUI
        required: true
        default: true
        type: boolean

      install_antigravity_cli:
        description: Install Antigravity CLI (agy)
        required: true
        default: true
        type: boolean

      enable_webtop_auth:
        description: Protect Webtop with WEBTOP_PASSWORD repository secret
        required: true
        default: false
        type: boolean

      enable_cloudflare:
        description: Start a temporary TryCloudflare tunnel
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: adiban-cloud-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Adiban Cloud Desktop
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    env:
      WEBTOP_IMAGE: lscr.io/linuxserver/webtop:ubuntu-kde
      WEBTOP_CONTAINER: adiban-webtop
      WEBTOP_CONFIG: ${{ github.workspace }}/.adiban-webtop
      WEBTOP_HOST: 127.0.0.1
      WEBTOP_PORT: '3001'
      WEBTOP_USER: abc
      WEBTOP_HOME: /config

      PUID: '1000'
      PGID: '1000'
      WEBTOP_TZ: ${{ inputs.timezone }}

      WORKSPACE_NAME: ${{ inputs.workspace_name }}
      SESSION_HOURS: ${{ inputs.session_hours }}

      WEBTOP_PASSWORD: ${{ secrets.WEBTOP_PASSWORD }}

    steps:

      # ============================================================
      # INITIALIZE
      # ============================================================

      - name: Initialize dashboard
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# 🖥️ ADIBAN Cloud Linux Desktop"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| Webtop | \`${WEBTOP_IMAGE}\` |"
            echo "| Desktop | KDE Plasma + Wayland/Selkies |"
            echo "| Session | \`${SESSION_HOURS}h\` |"
            echo "| Workspace | \`${WORKSPACE_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # RUNNER
      # ============================================================

      - name: Inspect runner
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## 🔎 Runner"
            echo '```text'
            uname -a
            echo
            cat /etc/os-release
            echo
            docker --version
            docker compose version 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # WORKSPACE
      # ============================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WEBTOP_CONFIG"
          mkdir -p "$WEBTOP_CONFIG"
          chmod 700 "$WEBTOP_CONFIG"

          echo "✅ Workspace prepared: $WEBTOP_CONFIG"

      # ============================================================
      # WEBTOP
      # ============================================================

      - name: Pull Webtop
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$WEBTOP_IMAGE"

      - name: Start Webtop
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f "$WEBTOP_CONTAINER" >/dev/null 2>&1 || true

          docker_args=(
            run
            --detach
            --name "$WEBTOP_CONTAINER"
            --shm-size=1gb
            --restart unless-stopped

            --publish "${WEBTOP_HOST}:${WEBTOP_PORT}:3001"

            --volume "${WEBTOP_CONFIG}:/config"

            --env "PUID=${PUID}"
            --env "PGID=${PGID}"
            --env "TZ=${WEBTOP_TZ}"

            --env "CUSTOM_PORT=3000"
            --env "CUSTOM_HTTPS_PORT=3001"
          )

          if [[ "${{ inputs.enable_webtop_auth }}" == "true" ]]; then
            if [[ -z "${WEBTOP_PASSWORD:-}" ]]; then
              echo "❌ enable_webtop_auth=true but WEBTOP_PASSWORD secret is empty." >&2
              exit 1
            fi

            docker_args+=(
              --env "CUSTOM_USER=${WEBTOP_USER}"
              --env "PASSWORD=${WEBTOP_PASSWORD}"
            )
          fi

          docker "${docker_args[@]}" "$WEBTOP_IMAGE"

          echo "✅ Webtop container started."

      - name: Wait for Webtop
        shell: bash
        run: |
          set -euo pipefail

          echo "⏳ Waiting for Webtop HTTPS endpoint..."

          for attempt in $(seq 1 90); do
            if curl \
              --silent \
              --show-error \
              --insecure \
              --fail \
              --max-time 5 \
              "https://${WEBTOP_HOST}:${WEBTOP_PORT}/" \
              >/dev/null 2>&1; then

              echo "✅ Webtop is ready after ${attempt} checks."
              exit 0
            fi

            sleep 2
          done

          echo "❌ Webtop did not become ready." >&2

          echo "--- container state ---"
          docker ps -a --filter "name=${WEBTOP_CONTAINER}"

          echo "--- last 200 logs ---"
          docker logs --tail 200 "$WEBTOP_CONTAINER" || true

          exit 1

      # ============================================================
      # BASE TOOLS
      # ============================================================

      - name: Install base tools
        shell: bash
        run: |
          set -euo pipefail

          docker exec "$WEBTOP_CONTAINER" bash -lc '
            set -euo pipefail

            export DEBIAN_FRONTEND=noninteractive

            apt-get update

            apt-get install -y --no-install-recommends \
              ca-certificates \
              curl \
              wget \
              git \
              gnupg \
              unzip \
              xz-utils \
              tar \
              bzip2 \
              procps \
              file \
              jq \
              build-essential \
              python3 \
              python3-pip

            rm -rf /var/lib/apt/lists/*
          '

          echo "✅ Base tools installed."

      # ============================================================
      # PYTHON 3.13
      # ============================================================

      - name: Install Python 3.13
        if: ${{ inputs.install_python }}
        shell: bash
        run: |
          set -euo pipefail

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '
              set -euo pipefail

              export PATH="$HOME/.local/bin:$PATH"

              curl -LsSf https://astral.sh/uv/install.sh | sh

              export PATH="$HOME/.local/bin:$PATH"

              uv python install 3.13 --default

              python3.13 --version
          '

          echo "✅ Python 3.13 installed via uv for ${WEBTOP_USER}."

      # ============================================================
      # NODE.JS 22
      # ============================================================

      - name: Install Node.js 22
        if: ${{ inputs.install_node }}
        shell: bash
        run: |
          set -euo pipefail

          docker exec "$WEBTOP_CONTAINER" bash -lc '
            set -euo pipefail

            NODE_VERSION=22.23.2
            ARCH=linux-x64

            cd /tmp

            curl -fsSLO \
              "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-${ARCH}.tar.xz"

            rm -rf /opt/nodejs
            mkdir -p /opt/nodejs

            tar -xJf \
              "node-v${NODE_VERSION}-${ARCH}.tar.xz" \
              -C /opt/nodejs \
              --strip-components=1

            ln -sf /opt/nodejs/bin/node /usr/local/bin/node
            ln -sf /opt/nodejs/bin/npm /usr/local/bin/npm
            ln -sf /opt/nodejs/bin/npx /usr/local/bin/npx

            rm -f "node-v${NODE_VERSION}-${ARCH}.tar.xz"

            node --version
            npm --version
          '

          echo "✅ Node.js 22 installed."

      # ============================================================
      # FIREFOX
      # ============================================================

      - name: Install Firefox
        if: ${{ inputs.install_firefox }}
        shell: bash
        run: |
          set -euo pipefail

          docker exec "$WEBTOP_CONTAINER" bash -lc '
            set -euo pipefail

            export DEBIAN_FRONTEND=noninteractive

            apt-get update
            apt-get install -y --no-install-recommends firefox

            rm -rf /var/lib/apt/lists/*
          '

          echo "✅ Firefox installed."

      # ============================================================
      # GOOGLE CHROME
      # ============================================================

      - name: Install Google Chrome
        if: ${{ inputs.install_chrome }}
        shell: bash
        run: |
          set -euo pipefail

          docker exec "$WEBTOP_CONTAINER" bash -lc '
            set -euo pipefail

            export DEBIAN_FRONTEND=noninteractive

            cd /tmp

            curl -fsSL \
              -o google-chrome-stable_current_amd64.deb \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

            apt-get update

            apt-get install -y \
              ./google-chrome-stable_current_amd64.deb

            rm -f google-chrome-stable_current_amd64.deb
            rm -rf /var/lib/apt/lists/*
          '

          echo "✅ Google Chrome installed."

      # ============================================================
      # VISUAL STUDIO CODE
      # ============================================================

      - name: Install Visual Studio Code
        if: ${{ inputs.install_vscode }}
        shell: bash
        run: |
          set -euo pipefail

          docker exec "$WEBTOP_CONTAINER" bash -lc '
            set -euo pipefail

            export DEBIAN_FRONTEND=noninteractive

            cd /tmp

            curl -fsSL \
              -o vscode.deb \
              "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64"

            apt-get update

            apt-get install -y ./vscode.deb

            rm -f vscode.deb
            rm -rf /var/lib/apt/lists/*
          '

          echo "✅ Visual Studio Code installed."

      # ============================================================
      # OPENCODE
      # ============================================================

      - name: Install OpenCode CLI
        if: ${{ inputs.install_opencode }}
        shell: bash
        run: |
          set -euo pipefail

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '
              set -euo pipefail

              export PATH="$HOME/.local/bin:$PATH"

              curl -fsSL https://opencode.ai/install | bash
          '

          echo "✅ OpenCode installed for ${WEBTOP_USER}."

      # ============================================================
      # ANTIGRAVITY GUI
      # ============================================================

      - name: Install Antigravity GUI
        if: ${{ inputs.install_antigravity }}
        shell: bash
        run: |
          set -euo pipefail

          docker exec "$WEBTOP_CONTAINER" bash -lc '
            set -euo pipefail

            export DEBIAN_FRONTEND=noninteractive

            mkdir -p /etc/apt/keyrings

            curl -fsSL \
              https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg \
              | gpg --dearmor --yes \
              -o /etc/apt/keyrings/antigravity-repo-key.gpg

            echo \
              "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main" \
              > /etc/apt/sources.list.d/antigravity.list

            apt-get update
            apt-get install -y antigravity

            rm -rf /var/lib/apt/lists/*
          '

          echo "✅ Antigravity GUI installed."

      # ============================================================
      # ANTIGRAVITY CLI
      # ============================================================

      - name: Install Antigravity CLI
        if: ${{ inputs.install_antigravity_cli }}
        shell: bash
        run: |
          set -euo pipefail

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '
              set -euo pipefail

              export PATH="$HOME/.local/bin:$PATH"

              curl -fsSL \
                https://antigravity.google/cli/install.sh \
                | bash
          '

          echo "✅ Antigravity CLI installed."

      # ============================================================
      # USER ENVIRONMENT
      # ============================================================

      - name: Configure user environment
        shell: bash
        run: |
          set -euo pipefail

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '
              set -euo pipefail

              touch "$HOME/.bashrc"

              grep -qxF \
                "export ADIBAN_CLOUD_PATH=1" \
                "$HOME/.bashrc" \
                || printf "%s\n" \
                  "export ADIBAN_CLOUD_PATH=1" \
                  >> "$HOME/.bashrc"

              grep -qxF \
                "export PATH=\"\$HOME/.local/bin:\$PATH\"" \
                "$HOME/.bashrc" \
                || printf "%s\n" \
                  "export PATH=\"\$HOME/.local/bin:\$PATH\"" \
                  >> "$HOME/.bashrc"

              mkdir -p "$HOME/.local/bin"

              chown -R "${PUID}:${PGID}" \
                "$HOME/.local" \
                2>/dev/null || true
          '

          echo "✅ User environment configured."

      # ============================================================
      # VERIFICATION
      # ============================================================

      - name: Verify installed software
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## ✅ Software Verification"
            echo "| Component | Status | Version |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          check_user_cmd() {
            local label="$1"
            local cmd="$2"
            local enabled="$3"

            if [[ "$enabled" != "true" ]]; then
              echo "| ${label} | ⏭️ Disabled | — |" \
                >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            if output="$(
              docker exec \
                --user "$WEBTOP_USER" \
                --env "HOME=$WEBTOP_HOME" \
                "$WEBTOP_CONTAINER" \
                bash -lc "$cmd" \
                2>&1
            )"; then

              output="$(printf '%s\n' "$output" | head -n 1)"

              escaped="${output//|/\\|}"

              echo "| ${label} | ✅ Installed | \`${escaped}\` |" \
                >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${label} | ❌ Failed | — |" \
                >> "$GITHUB_STEP_SUMMARY"

              echo "${label} verification failed:" >&2
              printf '%s\n' "$output" >&2

              return 1
            fi
          }

          check_root_cmd() {
            local label="$1"
            local cmd="$2"
            local enabled="$3"

            if [[ "$enabled" != "true" ]]; then
              echo "| ${label} | ⏭️ Disabled | — |" \
                >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            if output="$(
              docker exec \
                "$WEBTOP_CONTAINER" \
                bash -lc "$cmd" \
                2>&1
            )"; then

              output="$(printf '%s\n' "$output" | head -n 1)"

              escaped="${output//|/\\|}"

              echo "| ${label} | ✅ Installed | \`${escaped}\` |" \
                >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${label} | ❌ Failed | — |" \
                >> "$GITHUB_STEP_SUMMARY"

              printf '%s\n' "$output" >&2

              return 1
            fi
          }

          check_user_cmd \
            "Python 3.13" \
            "python3.13 --version" \
            "${{ inputs.install_python }}"

          check_root_cmd \
            "Node.js" \
            "node --version" \
            "${{ inputs.install_node }}"

          check_root_cmd \
            "Firefox" \
            "firefox --version" \
            "${{ inputs.install_firefox }}"

          check_root_cmd \
            "Chrome" \
            "google-chrome --version" \
            "${{ inputs.install_chrome }}"

          check_user_cmd \
            "VS Code" \
            "code --version | head -n 1" \
            "${{ inputs.install_vscode }}"

          check_user_cmd \
            "OpenCode" \
            "command -v opencode && opencode --version" \
            "${{ inputs.install_opencode }}"

          check_root_cmd \
            "Antigravity GUI" \
            "dpkg-query -W -f='\${Version}' antigravity" \
            "${{ inputs.install_antigravity }}"

          check_user_cmd \
            "Antigravity CLI" \
            "command -v agy" \
            "${{ inputs.install_antigravity_cli }}"

      # ============================================================
      # DESKTOP DIAGNOSTICS
      # ============================================================

      - name: Desktop diagnostics
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## 🖥️ Desktop Diagnostics"
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"

          docker exec "$WEBTOP_CONTAINER" bash -lc '
            echo "USER=$(id -un)"
            echo "HOME=${HOME}"
            echo "PUID=${PUID}"
            echo "PGID=${PGID}"
            echo "TZ=${TZ}"
            echo "DISPLAY=${DISPLAY:-unset}"
            echo "WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-unset}"
            echo "XDG_CURRENT_DESKTOP=${XDG_CURRENT_DESKTOP:-unset}"
            echo

            df -h /config /tmp 2>/dev/null || true

            echo
            free -h || true
          ' \
          | sed 's/[[:space:]]\+$//' \
          >> "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # CLOUDFLARE
      # ============================================================

      - name: Start TryCloudflare
        if: ${{ inputs.enable_cloudflare }}
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f adiban-cloudflared \
            >/dev/null 2>&1 || true

          docker run \
            --detach \
            --name adiban-cloudflared \
            --network host \
            --pull always \
            cloudflare/cloudflared:latest \
            tunnel \
            --no-autoupdate \
            --url "https://${WEBTOP_HOST}:${WEBTOP_PORT}" \
            --no-tls-verify

          echo "⏳ Waiting for TryCloudflare URL..."

          tunnel_url=""

          for attempt in $(seq 1 60); do
            tunnel_url="$(
              docker logs adiban-cloudflared 2>&1 \
              | grep -Eo \
                'https://[a-z0-9.-]+\.trycloudflare\.com' \
              | head -n 1 \
              || true
            )"

            if [[ -n "$tunnel_url" ]]; then
              break
            fi

            sleep 2
          done

          if [[ -z "$tunnel_url" ]]; then
            echo "❌ Could not obtain a TryCloudflare URL." >&2

            docker logs \
              --tail 200 \
              adiban-cloudflared \
              || true

            exit 1
          fi

          echo "ADIBAN_TUNNEL_URL=$tunnel_url" \
            >> "$GITHUB_ENV"

          {
            echo "## 🌐 Remote Access"
            echo
            echo "### TryCloudflare URL"
            echo
            echo "🔗 [$tunnel_url]($tunnel_url)"
            echo

            if [[ "${{ inputs.enable_webtop_auth }}" == "true" ]]; then
              echo "🔐 Webtop authentication: **enabled**"
            else
              echo "⚠️ Webtop authentication: **disabled**"
            fi

            echo
            echo "> Quick tunnels are intended for development/testing."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "✅ TryCloudflare tunnel started."

      # ============================================================
      # FINAL HEALTH CHECK
      # ============================================================

      - name: Final health check
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## ❤️ Final Health Check"
            echo "| Check | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          if docker ps \
            --format '{{.Names}}' \
            | grep -qx "$WEBTOP_CONTAINER"; then

            echo "| Webtop container | ✅ Running |" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Webtop container | ❌ Not running |" \
              >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          if curl \
            --silent \
            --show-error \
            --insecure \
            --fail \
            --max-time 10 \
            "https://${WEBTOP_HOST}:${WEBTOP_PORT}/" \
            >/dev/null 2>&1; then

            echo "| Webtop HTTPS | ✅ Reachable |" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Webtop HTTPS | ❌ Unreachable |" \
              >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          if [[ "${{ inputs.enable_cloudflare }}" == "true" ]]; then
            if [[ -n "${ADIBAN_TUNNEL_URL:-}" ]] && \
              curl \
                --silent \
                --show-error \
                --fail \
                --max-time 20 \
                "$ADIBAN_TUNNEL_URL/" \
                >/dev/null 2>&1; then

              echo "| TryCloudflare | ✅ Reachable |" \
                >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| TryCloudflare | ⚠️ Started; external check failed |" \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "| TryCloudflare | ⏭️ Disabled |" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # ============================================================
      # KEEP ALIVE
      # ============================================================

      - name: Keep session alive
        shell: bash
        run: |
          set -euo pipefail

          seconds=$((SESSION_HOURS * 3600))

          {
            echo "## ⏱️ Session"
            echo "Keeping the environment alive for approximately \`${SESSION_HOURS} hours\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          end_epoch=$((SECONDS + seconds))

          while (( SECONDS < end_epoch )); do
            remaining=$((end_epoch - SECONDS))

            if (( remaining % 60 == 0 )); then
              echo "⏳ Remaining: $((remaining / 60)) minutes"

              if ! docker ps \
                --format '{{.Names}}' \
                | grep -qx "$WEBTOP_CONTAINER"; then

                echo "❌ Webtop container stopped unexpectedly." >&2

                docker logs \
                  --tail 200 \
                  "$WEBTOP_CONTAINER" \
                  || true

                exit 1
              fi
            fi

            sleep 5
          done

          echo "✅ Session window completed."

      # ============================================================
      # DEBUG
      # ============================================================

      - name: Collect logs
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          mkdir -p \
            "$GITHUB_WORKSPACE/adiban-debug"

          docker ps -a \
            > "$GITHUB_WORKSPACE/adiban-debug/docker-ps.txt" \
            2>&1

          docker logs \
            --tail 500 \
            "$WEBTOP_CONTAINER" \
            > "$GITHUB_WORKSPACE/adiban-debug/webtop.log" \
            2>&1

          docker logs \
            --tail 500 \
            adiban-cloudflared \
            > "$GITHUB_WORKSPACE/adiban-debug/cloudflared.log" \
            2>&1

          echo "Debug logs collected."

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          docker rm -f adiban-cloudflared \
            >/dev/null 2>&1 || true

          docker rm -f "$WEBTOP_CONTAINER" \
            >/dev/null 2>&1 || true

          echo "🧹 Containers cleaned up."
