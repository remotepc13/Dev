name: "🚀 Adiban Cloud Linux — KDE Plasma"

# ================================================================
# WORKFLOW
# ================================================================

on:
  workflow_dispatch:

    inputs:

      # ============================================================
      # 🖥️ SYSTEM
      # ============================================================

      runner:
        description: "🖥️ GitHub Runner"
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-26.04

      timezone:
        description: "🌍 Timezone"
        required: true
        type: choice
        default: Asia/Tehran
        options:
          - Asia/Tehran
          - Europe/Berlin
          - Europe/London
          - Europe/Paris
          - Asia/Dubai
          - Asia/Tokyo
          - UTC

      workspace_name:
        description: "📁 Workspace Name"
        required: true
        type: string
        default: adiban-workspace


      # ============================================================
      # 🧩 APPLICATIONS
      # ============================================================

      install_python:
        description: "🐍 Python"
        required: true
        type: boolean
        default: true

      install_node:
        description: "🟢 Node.js 22"
        required: true
        type: boolean
        default: true

      install_opencode:
        description: "🤖 OpenCode"
        required: true
        type: boolean
        default: true

      install_firefox:
        description: "🦊 Firefox"
        required: true
        type: boolean
        default: true

      install_chrome:
        description: "🌐 Google Chrome"
        required: true
        type: boolean
        default: true

      install_vscode:
        description: "💻 Visual Studio Code"
        required: true
        type: boolean
        default: true

      install_antigravity:
        description: "🚀 Google Antigravity"
        required: true
        type: boolean
        default: true

      install_antigravity_cli:
        description: "⚡ Antigravity CLI (agy)"
        required: true
        type: boolean
        default: true


      # ============================================================
      # 🌐 NETWORK
      # ============================================================

      enable_cloudflare:
        description: "☁️ Cloudflare Quick Tunnel"
        required: true
        type: boolean
        default: true


# ================================================================
# GLOBAL ENVIRONMENT
# ================================================================

env:

  # --------------------------------------------------------------
  # Webtop
  # --------------------------------------------------------------

  WEBTOP_IMAGE: "lscr.io/linuxserver/webtop:ubuntu-kde"
  WEBTOP_CONTAINER: "adiban-webtop"

  WEBTOP_HOST: "127.0.0.1"
  WEBTOP_PORT: "3001"

  # --------------------------------------------------------------
  # Webtop user
  # --------------------------------------------------------------

  WEBTOP_USER: "abc"
  WEBTOP_HOME: "/config"

  PUID: "1000"
  PGID: "1000"

  # --------------------------------------------------------------
  # Session
  # --------------------------------------------------------------

  SESSION_MINUTES: "360"
  SESSION_SECONDS: "21600"


# ================================================================
# JOB
# ================================================================

jobs:

  desktop:

    name: "🖥️ Adiban Cloud Linux"

    runs-on: ${{ inputs.runner }}

    # Maximum runtime
    timeout-minutes: 360


    # ============================================================
    # STEPS
    # ============================================================

    steps:


      # ============================================================
      # 01 — SESSION HEADER
      # ============================================================

      - name: "🎬 Initialize Cloud Desktop"
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                                                              ║"
          echo "║        🚀 ADIBAN CLOUD LINUX                               ║"
          echo "║        KDE Plasma • Wayland • Webtop                       ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "🖥️ Runner      : ${{ inputs.runner }}"
          echo "🖼️ Desktop     : KDE Plasma / Wayland"
          echo "📦 Webtop      : ${WEBTOP_IMAGE}"
          echo "🌍 Timezone    : ${{ inputs.timezone }}"
          echo "📁 Workspace   : ${{ inputs.workspace_name }}"
          echo "⏱️ Runtime     : 6 hours"
          echo "👤 User        : ${WEBTOP_USER}"
          echo ""

          {
            echo "# 🚀 Adiban Cloud Linux"
            echo ""
            echo "> **KDE Plasma + Wayland + Selkies Web Desktop**"
            echo ""
            echo "## 🎛️ Configuration"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| 🖥️ Runner | \`${{ inputs.runner }}\` |"
            echo "| 🖼️ Desktop | KDE Plasma / Wayland |"
            echo "| 📦 Webtop | \`${WEBTOP_IMAGE}\` |"
            echo "| 👤 User | \`${WEBTOP_USER}\` |"
            echo "| 🌍 Timezone | \`${{ inputs.timezone }}\` |"
            echo "| 📁 Workspace | \`${{ inputs.workspace_name }}\` |"
            echo "| ⏱️ Session | **6 hours** |"
            echo ""
            echo "## 🧩 Applications"
            echo ""
            echo "| Application | Selected |"
            echo "|---|:---:|"
            echo "| 🐍 Python | ${{ inputs.install_python && '✅' || '❌' }} |"
            echo "| 🟢 Node.js | ${{ inputs.install_node && '✅' || '❌' }} |"
            echo "| 🤖 OpenCode | ${{ inputs.install_opencode && '✅' || '❌' }} |"
            echo "| 🦊 Firefox | ${{ inputs.install_firefox && '✅' || '❌' }} |"
            echo "| 🌐 Chrome | ${{ inputs.install_chrome && '✅' || '❌' }} |"
            echo "| 💻 VS Code | ${{ inputs.install_vscode && '✅' || '❌' }} |"
            echo "| 🚀 Antigravity | ${{ inputs.install_antigravity && '✅' || '❌' }} |"
            echo "| ⚡ AGY CLI | ${{ inputs.install_antigravity_cli && '✅' || '❌' }} |"
            echo "| ☁️ Cloudflare | ${{ inputs.enable_cloudflare && '✅' || '❌' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 02 — RUNNER INFORMATION
      # ============================================================

      - name: "🔍 Inspect Runner"
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::🖥️ Operating System"

          cat /etc/os-release

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "Architecture:"
          uname -m

          echo "::endgroup::"


          echo "::group::🐳 Docker"

          docker --version

          docker info \
            --format \
            'Server={{.ServerVersion}} | CPUs={{.NCPU}} | Memory={{.MemTotal}}'

          echo "::endgroup::"


      # ============================================================
      # 03 — WORKSPACE
      # ============================================================

      - name: "📁 Prepare Workspace"
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$HOME/${{ inputs.workspace_name }}"

          mkdir -p \
            "$WORKSPACE/config" \
            "$WORKSPACE/projects" \
            "$WORKSPACE/.cache"

          chmod 755 "$WORKSPACE"

          echo "📁 Workspace:"
          echo "$WORKSPACE"

          echo ""
          echo "📂 Directory:"
          find "$WORKSPACE" \
            -maxdepth 2 \
            -type d \
            | sort


      # ============================================================
      # 04 — PULL WEBTOP
      # ============================================================

      - name: "📥 Pull KDE Webtop"
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "📦 Pulling:"
          echo "${WEBTOP_IMAGE}"
          echo ""

          docker pull "${WEBTOP_IMAGE}"

          echo ""
          echo "✅ Webtop image downloaded."


      # ============================================================
      # 05 — START WEBTOP
      # ============================================================

      - name: "🖥️ Start KDE Plasma"
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$HOME/${{ inputs.workspace_name }}"

          echo ""
          echo "🖥️ Starting KDE Plasma Webtop..."
          echo ""

          # Remove stale container if any.
          docker rm -f "${WEBTOP_CONTAINER}" 2>/dev/null || true


          docker run \
            --detach \
            --name "${WEBTOP_CONTAINER}" \
            --shm-size="1gb" \
            --env "PUID=${PUID}" \
            --env "PGID=${PGID}" \
            --env "TZ=${{ inputs.timezone }}" \
            --env "TITLE=Adiban Cloud Linux" \
            --publish "${WEBTOP_HOST}:${WEBTOP_PORT}:3001" \
            --volume "${WORKSPACE}/config:/config" \
            "${WEBTOP_IMAGE}"


          echo ""
          echo "🐳 Container started:"
          docker ps \
            --filter "name=${WEBTOP_CONTAINER}" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"


      # ============================================================
      # 06 — WAIT FOR WEBTOP
      # ============================================================

      - name: "⏳ Wait for KDE Webtop"
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "⏳ Waiting for Webtop..."
          echo ""

          READY="false"

          for i in $(seq 1 60); do

            if curl \
              --silent \
              --show-error \
              --insecure \
              --fail \
              --max-time 5 \
              "https://${WEBTOP_HOST}:${WEBTOP_PORT}/" \
              >/dev/null 2>&1; then

              READY="true"

              echo ""
              echo "🟢 Webtop is ONLINE."
              break
            fi

            printf "  ⏳ [%02d/60] waiting...\n" "$i"

            sleep 3

          done


          if [ "${READY}" != "true" ]; then

            echo ""
            echo "::error::❌ Webtop did not become ready."

            echo ""
            echo "📋 Container status:"
            docker ps -a \
              --filter "name=${WEBTOP_CONTAINER}"

            echo ""
            echo "📋 Container logs:"
            docker logs \
              --tail 200 \
              "${WEBTOP_CONTAINER}" || true

            exit 1
          fi


      # ============================================================
      # 07 — WEBTOP HEALTH CHECK
      # ============================================================

      - name: "🩺 Webtop Health Check"
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    🩺 HEALTH CHECK                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""


          echo "::group::🐳 Container"

          docker ps \
            --filter "name=${WEBTOP_CONTAINER}" \
            --format \
            "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "::endgroup::"


          echo "::group::🧠 Resources"

          docker stats \
            "${WEBTOP_CONTAINER}" \
            --no-stream \
            --format \
            "CPU={{.CPUPerc}} | MEM={{.MemUsage}} | NET={{.NetIO}}"

          echo "::endgroup::"


          echo "::group::🌐 HTTPS"

          curl \
            --silent \
            --show-error \
            --insecure \
            --head \
            --max-time 10 \
            "https://${WEBTOP_HOST}:${WEBTOP_PORT}/" \
            | head -n 10

          echo "::endgroup::"


          echo ""
          echo "✅ Webtop health check passed."


      # ============================================================
      # 08 — BASE PACKAGES
      # ============================================================

      - name: "🧰 Install Base Dependencies"
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "🧰 Installing minimal system dependencies..."
          echo ""

          docker exec \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              set -e

              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y \
                ca-certificates \
                curl \
                wget \
                gnupg \
                git \
                unzip \
                apt-transport-https \
                software-properties-common

              apt-get clean

              rm -rf /var/lib/apt/lists/*

            '

          echo ""
          echo "✅ Base dependencies ready."


      # ============================================================
      # 09 — PYTHON
      # ============================================================

      - name: "🐍 Install Python"
        if: ${{ inputs.install_python }}
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "🐍 Installing Python..."
          echo ""

          docker exec \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              set -e

              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y \
                python3 \
                python3-pip \
                python3-venv \
                python3-dev

              apt-get clean

              rm -rf /var/lib/apt/lists/*

            '


          echo ""
          echo "🧪 Testing Python as desktop user..."

          docker exec \
            --user "${WEBTOP_USER}" \
            --env "HOME=${WEBTOP_HOME}" \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              python3 --version

              python3 -m pip --version || true

            '

          echo ""
          echo "✅ Python ready."


      # ============================================================
      # 10 — NODE.JS
      # ============================================================

      - name: "🟢 Install Node.js 22"
        if: ${{ inputs.install_node }}
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "🟢 Installing Node.js 22..."
          echo ""

          docker exec \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              set -e

              export DEBIAN_FRONTEND=noninteractive

              curl \
                -fsSL \
                https://deb.nodesource.com/setup_22.x \
                | bash -

              apt-get install -y nodejs

              apt-get clean

              rm -rf /var/lib/apt/lists/*

            '


          echo ""
          echo "🧪 Testing Node.js as desktop user..."

          docker exec \
            --user "${WEBTOP_USER}" \
            --env "HOME=${WEBTOP_HOME}" \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              node --version
              npm --version

            '

          echo ""
          echo "✅ Node.js ready."


      # ============================================================
      # 11 — FIREFOX
      # ============================================================

      - name: "🦊 Install Firefox"
        if: ${{ inputs.install_firefox }}
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "🦊 Installing Firefox..."
          echo ""

          docker exec \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              set -e

              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y firefox

              apt-get clean

              rm -rf /var/lib/apt/lists/*

            '


          echo ""
          echo "🧪 Testing Firefox..."

          docker exec \
            --user "${WEBTOP_USER}" \
            --env "HOME=${WEBTOP_HOME}" \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              firefox --version

            '

          echo ""
          echo "✅ Firefox ready."


      # ============================================================
      # 12 — GOOGLE CHROME
      # ============================================================

      - name: "🌐 Install Google Chrome"
        if: ${{ inputs.install_chrome }}
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "🌐 Installing Google Chrome..."
          echo ""

          docker exec \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              set -e

              export DEBIAN_FRONTEND=noninteractive

              cd /tmp

              rm -f google-chrome.deb

              wget \
                -q \
                --show-progress \
                -O google-chrome.deb \
                https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

              apt-get update

              apt-get install -y \
                ./google-chrome.deb

              rm -f google-chrome.deb

              apt-get clean

              rm -rf /var/lib/apt/lists/*

            '


          echo ""
          echo "🧪 Testing Chrome as desktop user..."

          docker exec \
            --user "${WEBTOP_USER}" \
            --env "HOME=${WEBTOP_HOME}" \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              google-chrome --version

            '

          echo ""
          echo "✅ Google Chrome ready."


      # ============================================================
      # 13 — MICROSOFT VS CODE
      # ============================================================

      - name: "💻 Install VS Code"
        if: ${{ inputs.install_vscode }}
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    💻 VS CODE                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          docker exec \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              set -e

              export DEBIAN_FRONTEND=noninteractive

              mkdir -p /etc/apt/keyrings

              curl \
                -fsSL \
                https://packages.microsoft.com/keys/microsoft.asc \
                | gpg \
                --dearmor \
                --yes \
                -o /etc/apt/keyrings/packages.microsoft.gpg


              echo \
                "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
                > /etc/apt/sources.list.d/vscode.list


              apt-get update

              apt-get install -y code

              apt-get clean

              rm -rf /var/lib/apt/lists/*

            '


          echo ""
          echo "🧪 Verifying VS Code as DESKTOP USER..."
          echo ""

          docker exec \
            --user "${WEBTOP_USER}" \
            --env "HOME=${WEBTOP_HOME}" \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              echo "👤 User:"
              id

              echo ""
              echo "🏠 HOME:"
              echo "$HOME"

              echo ""
              echo "📍 VS Code:"
              command -v code

              echo ""
              echo "📦 Version:"
              code --version | head -n 3

            '

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ VS Code installed successfully"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


      # ============================================================
      # 14 — OPENCODE
      # ============================================================

      - name: "🤖 Install OpenCode"
        if: ${{ inputs.install_opencode }}
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    🤖 OPENCODE                             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          docker exec \
            --user "${WEBTOP_USER}" \
            --env "HOME=${WEBTOP_HOME}" \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              set -e

              mkdir -p "$HOME/.local/bin"

              curl \
                -fsSL \
                https://opencode.ai/install \
                | bash


              export PATH="$HOME/.local/bin:$PATH"


              echo ""
              echo "📍 Binary:"
              command -v opencode

              echo ""
              echo "📦 Version:"
              opencode --version

            '

          echo ""
          echo "✅ OpenCode ready."


      # ============================================================
      # 15 — GOOGLE ANTIGRAVITY IDE
      # ============================================================

      - name: "🚀 Install Google Antigravity"
        if: ${{ inputs.install_antigravity }}
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                 🚀 ANTIGRAVITY IDE                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          docker exec \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              set -e

              export DEBIAN_FRONTEND=noninteractive

              mkdir -p /etc/apt/keyrings


              curl \
                -fsSL \
                https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg \
                | gpg \
                --dearmor \
                --yes \
                -o /etc/apt/keyrings/antigravity-repo-key.gpg


              echo \
                "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main" \
                > /etc/apt/sources.list.d/antigravity.list


              apt-get update

              apt-get install -y antigravity

              apt-get clean

              rm -rf /var/lib/apt/lists/*

            '


          echo ""
          echo "🧪 Checking Antigravity..."

          docker exec \
            --user "${WEBTOP_USER}" \
            --env "HOME=${WEBTOP_HOME}" \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              if command -v antigravity >/dev/null 2>&1; then
                echo "📍 $(command -v antigravity)"
                echo "✅ Antigravity binary available."
              else
                echo "⚠️ Antigravity binary not found in PATH."
              fi

            '

          echo ""
          echo "✅ Antigravity installation completed."


      # ============================================================
      # 16 — ANTIGRAVITY CLI
      # ============================================================

      - name: "⚡ Install Antigravity CLI"
        if: ${{ inputs.install_antigravity_cli }}
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                ⚡ ANTIGRAVITY CLI                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          docker exec \
            --user "${WEBTOP_USER}" \
            --env "HOME=${WEBTOP_HOME}" \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              set -e

              mkdir -p "$HOME/.local/bin"

              curl \
                -fsSL \
                https://antigravity.google/cli/install.sh \
                | bash


              export PATH="$HOME/.local/bin:$PATH"


              echo ""
              echo "📍 Binary:"
              command -v agy

              echo ""
              echo "📦 Version:"
              agy --version || true

            '

          echo ""
          echo "✅ Antigravity CLI ready."


      # ============================================================
      # 17 — BUILD USER PATH
      # ============================================================

      - name: "🛠️ Configure User Environment"
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "🛠️ Configuring desktop user environment..."
          echo ""

          docker exec \
            --user "${WEBTOP_USER}" \
            --env "HOME=${WEBTOP_HOME}" \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              set -e

              mkdir -p "$HOME/.local/bin"

              PROFILE="$HOME/.bashrc"

              touch "$PROFILE"

              if ! grep -q "ADIBAN_CLOUD_PATH" "$PROFILE"; then

                cat >> "$PROFILE" << "EOF"

# ADIBAN_CLOUD_PATH
export ADIBAN_CLOUD_PATH=1
export PATH="$HOME/.local/bin:$PATH"

EOF

              fi

            '

          echo "✅ User environment configured."


      # ============================================================
      # 18 — COMPLETE VERIFICATION
      # ============================================================

      - name: "🧪 Verify Complete Environment"
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              🧪 COMPLETE ENVIRONMENT TEST                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          docker exec \
            --user "${WEBTOP_USER}" \
            --env "HOME=${WEBTOP_HOME}" \
            "${WEBTOP_CONTAINER}" \
            bash -lc '

              export PATH="$HOME/.local/bin:$PATH"

              PASS=0
              TOTAL=0


              check() {

                NAME="$1"
                COMMAND="$2"

                TOTAL=$((TOTAL + 1))

                echo ""
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "🔎 $NAME"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

                if eval "$COMMAND"; then
                  echo "✅ $NAME"
                  PASS=$((PASS + 1))
                else
                  echo "❌ $NAME"
                fi
              }


              echo "👤 USER"
              id

              echo ""
              echo "🏠 HOME"
              echo "$HOME"


              check \
                "🐍 Python" \
                "python3 --version"


              check \
                "🟢 Node.js" \
                "node --version"


              check \
                "📦 npm" \
                "npm --version"


              check \
                "🦊 Firefox" \
                "firefox --version"


              check \
                "🌐 Chrome" \
                "google-chrome --version"


