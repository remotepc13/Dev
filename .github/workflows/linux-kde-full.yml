name: "🖥️ ADIBAN Cloud Linux"

on:
  workflow_dispatch:
    inputs:

      # ============================================================
      # CORE
      # ============================================================

      runner:
        description: "🖥️ GitHub Runner"
        required: true
        type: choice
        default: "ubuntu-24.04"
        options:
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-latest

      timezone:
        description: "🌍 Timezone"
        required: true
        type: string
        default: "Europe/Berlin"

      workspace_name:
        description: "📁 Workspace Name"
        required: true
        type: string
        default: "adiban-cloud"

      session_hours:
        description: "⏱️ Session Duration"
        required: true
        type: choice
        default: "4"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

      # ============================================================
      # DEVELOPER TOOLS
      # ============================================================

      install_python:
        description: "☑️ Python 3.13"
        required: true
        type: boolean
        default: true

      install_node:
        description: "☑️ Node.js 22"
        required: true
        type: boolean
        default: true

      install_vscode:
        description: "☑️ Visual Studio Code"
        required: true
        type: boolean
        default: true

      install_opencode:
        description: "☑️ OpenCode"
        required: true
        type: boolean
        default: true

      # ============================================================
      # BROWSERS
      # ============================================================

      install_firefox:
        description: "☑️ Firefox"
        required: true
        type: boolean
        default: true

      install_chrome:
        description: "☑️ Google Chrome"
        required: true
        type: boolean
        default: false

      # ============================================================
      # AI
      # ============================================================

      install_antigravity_gui:
        description: "☑️ Antigravity GUI"
        required: true
        type: boolean
        default: false

      install_antigravity_cli:
        description: "☑️ Antigravity CLI"
        required: true
        type: boolean
        default: true

      # ============================================================
      # ACCESS
      # ============================================================

      enable_webtop_auth:
        description: "🔐 Webtop Authentication"
        required: true
        type: boolean
        default: false

      enable_cloudflare:
        description: "☁️ TryCloudflare Tunnel"
        required: true
        type: boolean
        default: true


# ================================================================
# GLOBAL ENVIRONMENT
# ================================================================

env:

  WEBTOP_CONTAINER: "adiban-webtop"
  WEBTOP_IMAGE: "lscr.io/linuxserver/webtop:ubuntu-kde"

  CLOUDFLARE_CONTAINER: "adiban-cloudflare"

  WEBTOP_USER: "abc"
  WEBTOP_HOME: "/config"

  WEBTOP_HOST: "127.0.0.1"
  WEBTOP_PORT: "3001"


# ================================================================
# JOB
# ================================================================

jobs:

  desktop:

    name: "🖥️ ADIBAN Cloud Linux"

    runs-on: ${{ inputs.runner }}

    # GitHub-hosted runner maximum is 6h.
    # Keep some margin for startup + cleanup.
    timeout-minutes: 360

    concurrency:
      group: "adiban-cloud-${{ github.repository }}-${{ inputs.workspace_name }}"
      cancel-in-progress: false


    steps:

      # ============================================================
      # 1. CONFIGURATION PREVIEW
      # ============================================================

      - name: "📋 Configuration Preview"
        shell: bash
        run: |

          set -Eeuo pipefail

          echo
          echo "╔════════════════════════════════════════════════╗"
          echo "║          🖥️ ADIBAN CLOUD LINUX                ║"
          echo "╚════════════════════════════════════════════════╝"
          echo

          echo "🖥️ CORE"
          echo "   Runner:       ${{ inputs.runner }}"
          echo "   Timezone:     ${{ inputs.timezone }}"
          echo "   Workspace:    ${{ inputs.workspace_name }}"
          echo "   Session:      ${{ inputs.session_hours }} hour(s)"
          echo

          echo "🧰 DEVELOPER TOOLS"
          echo "   Python 3.13:  ${{ inputs.install_python }}"
          echo "   Node.js 22:   ${{ inputs.install_node }}"
          echo "   VS Code:      ${{ inputs.install_vscode }}"
          echo "   OpenCode:     ${{ inputs.install_opencode }}"
          echo

          echo "🌐 BROWSERS"
          echo "   Firefox:      ${{ inputs.install_firefox }}"
          echo "   Chrome:       ${{ inputs.install_chrome }}"
          echo

          echo "🤖 AI"
          echo "   Antigravity:  ${{ inputs.install_antigravity_gui }}"
          echo "   agy CLI:      ${{ inputs.install_antigravity_cli }}"
          echo

          echo "🌍 ACCESS"
          echo "   Webtop Auth:  ${{ inputs.enable_webtop_auth }}"
          echo "   Cloudflare:   ${{ inputs.enable_cloudflare }}"
          echo

          {
            echo "## 🖥️ ADIBAN Cloud Linux"
            echo
            echo "### 📋 Configuration"
            echo
            echo "| Option | Value |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| Timezone | \`${{ inputs.timezone }}\` |"
            echo "| Workspace | \`${{ inputs.workspace_name }}\` |"
            echo "| Session | \`${{ inputs.session_hours }}h\` |"
            echo
            echo "### 🧰 Developer"
            echo
            echo "| Tool | Enabled |"
            echo "|---|---|"
            echo "| Python 3.13 | ${{ inputs.install_python }} |"
            echo "| Node.js 22 | ${{ inputs.install_node }} |"
            echo "| VS Code | ${{ inputs.install_vscode }} |"
            echo "| OpenCode | ${{ inputs.install_opencode }} |"
            echo
            echo "### 🌐 Browsers"
            echo
            echo "| Tool | Enabled |"
            echo "|---|---|"
            echo "| Firefox | ${{ inputs.install_firefox }} |"
            echo "| Chrome | ${{ inputs.install_chrome }} |"
            echo
            echo "### 🤖 AI"
            echo
            echo "| Tool | Enabled |"
            echo "|---|---|"
            echo "| Antigravity GUI | ${{ inputs.install_antigravity_gui }} |"
            echo "| Antigravity CLI | ${{ inputs.install_antigravity_cli }} |"
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 2. HOST INFORMATION
      # ============================================================

      - name: "🖥️ Host Check"
        shell: bash
        run: |

          set -Eeuo pipefail

          echo "::group::🖥️ Host"

          echo "OS:"
          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -r

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Docker:"
          docker --version

          echo "::endgroup::"


      # ============================================================
      # 3. WORKSPACE
      # ============================================================

      - name: "📁 Prepare Workspace"
        shell: bash
        run: |

          set -Eeuo pipefail

          mkdir -p "${{ github.workspace }}/.adiban-webtop"

          chmod 755 "${{ github.workspace }}/.adiban-webtop"


      # ============================================================
      # 4. START WEBTOP
      # ============================================================

      - name: "🖥️ Start Webtop"
        shell: bash
        run: |

          set -Eeuo pipefail

          echo "::group::🖥️ Starting Webtop"

          docker rm -f "$WEBTOP_CONTAINER" \
            >/dev/null 2>&1 || true

          DOCKER_ARGS=(
            -d
            --name "$WEBTOP_CONTAINER"
            --restart unless-stopped
            --shm-size=2gb
            -p "${WEBTOP_HOST}:${WEBTOP_PORT}:3001"
            -e "PUID=1000"
            -e "PGID=1000"
            -e "TZ=${{ inputs.timezone }}"
            -e "TITLE=ADIBAN Cloud Linux"
            -v "${{ github.workspace }}/.adiban-webtop:/config"
          )

          if [[ "${{ inputs.enable_webtop_auth }}" == "true" ]]; then

            DOCKER_ARGS+=(
              -e "CUSTOM_USER=adiban"
              -e "PASSWORD=adiban"
            )

          fi

          DOCKER_ARGS+=(
            "$WEBTOP_IMAGE"
          )

          docker run "${DOCKER_ARGS[@]}"

          echo
          echo "📦 Container:"
          docker ps \
            --filter "name=$WEBTOP_CONTAINER" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "::endgroup::"


      # ============================================================
      # 5. ROBUST WEBTOP READINESS
      # ============================================================

      - name: "❤️ Wait for Webtop"
        shell: bash
        run: |

          set -Eeuo pipefail

          echo "::group::❤️ Webtop Readiness"

          READY=0

          for i in {1..90}; do

            echo "⏳ Check $i/90"

            RUNNING="$(
              docker inspect \
                --format='{{.State.Running}}' \
                "$WEBTOP_CONTAINER" \
                2>/dev/null || echo "false"
            )"

            if [[ "$RUNNING" != "true" ]]; then

              echo "❌ Webtop container is not running."

              docker ps -a

              docker logs \
                --tail 100 \
                "$WEBTOP_CONTAINER" \
                || true

              exit 1

            fi


            # ------------------------------------------------------
            # Check Webtop HTTP endpoint.
            #
            # Do NOT immediately fail if curl is not ready.
            # Webtop needs time to initialize Wayland/KDE/Selkies.
            # ------------------------------------------------------

            if curl \
              --silent \
              --show-error \
              --max-time 3 \
              "http://${WEBTOP_HOST}:${WEBTOP_PORT}/" \
              >/dev/null 2>&1; then

              echo "✅ HTTP endpoint ready."

              READY=1
              break

            fi


            # ------------------------------------------------------
            # Check Wayland socket.
            # ------------------------------------------------------

            WAYLAND_READY="$(
              docker exec \
                "$WEBTOP_CONTAINER" \
                bash -lc '
                  test -S /config/.XDG/wayland-1
                ' \
                >/dev/null 2>&1 \
                && echo "yes" \
                || echo "no"
            )"

            if [[ "$WAYLAND_READY" == "yes" ]]; then
              echo "✅ Wayland socket ready."
            else
              echo "⌛ Wayland still starting..."
            fi


            # ------------------------------------------------------
            # Check Selkies/Webtop processes.
            # ------------------------------------------------------

            docker exec \
              "$WEBTOP_CONTAINER" \
              bash -lc '
                pgrep -af "selkies|wayland|kwin" \
                | head -n 5 \
                || true
              ' \
              2>/dev/null || true


            sleep 4

          done


          if [[ "$READY" != "1" ]]; then

            echo "⚠️ HTTP endpoint did not respond within timeout."

            echo
            echo "📦 Container state:"

            docker inspect \
              "$WEBTOP_CONTAINER" \
              --format='Status={{.State.Status}} Running={{.State.Running}}'

            echo
            echo "📜 Webtop logs:"

            docker logs \
              --tail 250 \
              "$WEBTOP_CONTAINER" \
              || true

            # ------------------------------------------------------
            # Important:
            # If container is still running and Wayland is ready,
            # don't destroy the session just because HTTP probing
            # was unreliable.
            # ------------------------------------------------------

            RUNNING="$(
              docker inspect \
                --format='{{.State.Running}}' \
                "$WEBTOP_CONTAINER"
            )"

            WAYLAND_READY="$(
              docker exec \
                "$WEBTOP_CONTAINER" \
                bash -lc '
                  test -S /config/.XDG/wayland-1
                ' \
                >/dev/null 2>&1 \
                && echo "yes" \
                || echo "no"
            )"

            if [[ "$RUNNING" == "true" && "$WAYLAND_READY" == "yes" ]]; then

              echo
              echo "⚠️ HTTP probe failed, but Webtop + Wayland are alive."
              echo "➡️ Continuing session."

            else

              echo
              echo "❌ Webtop is not healthy."

              exit 1

            fi

          fi


          echo
          echo "🎉 Webtop is ready."

          {
            echo
            echo "### ❤️ Webtop"
            echo
            echo "✅ KDE Webtop is running."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::endgroup::"


      # ============================================================
      # 6. INSTALL OPTIONAL TOOLS
      # ============================================================

      - name: "🧰 Install Optional Tools"
        shell: bash
        run: |

          set +e

          echo "::group::🧰 Optional Tools"

          docker exec \
            "$WEBTOP_CONTAINER" \
            bash -s \
            -- \
            "${{ inputs.install_python }}" \
            "${{ inputs.install_node }}" \
            "${{ inputs.install_vscode }}" \
            "${{ inputs.install_opencode }}" \
            "${{ inputs.install_firefox }}" \
            "${{ inputs.install_chrome }}" \
            "${{ inputs.install_antigravity_gui }}" \
            "${{ inputs.install_antigravity_cli }}" \
            <<'SCRIPT'


          PYTHON="$1"
          NODE="$2"
          VSCODE="$3"
          OPENCODE="$4"
          FIREFOX="$5"
          CHROME="$6"
          ANTIGRAVITY_GUI="$7"
          ANTIGRAVITY_CLI="$8"


          export DEBIAN_FRONTEND=noninteractive


          # ==========================================================
          # HELPERS
          # ==========================================================

          ok() {
            echo "   ✅ $1"
          }

          warn() {
            echo "   ⚠️ $1"
          }


          install_pkg() {

            NAME="$1"
            shift

            echo
            echo "📦 $NAME"

            if apt-get update -qq >/dev/null 2>&1 &&
               apt-get install -y "$@" >/dev/null 2>&1; then

              ok "$NAME installed."

            else

              warn "$NAME failed. Continuing."

            fi
          }


          # ==========================================================
          # BASE UTILITIES
          # ==========================================================

          echo
          echo "📦 Minimal base packages"

          apt-get update -qq >/dev/null 2>&1 || true

          apt-get install -y \
            curl \
            wget \
            git \
            unzip \
            ca-certificates \
            gnupg \
            >/dev/null 2>&1 \
            || true


          # ==========================================================
          # PYTHON 3.13
          # ==========================================================

          if [[ "$PYTHON" == "true" ]]; then

            echo
            echo "🐍 Python 3.13"

            if command -v python3.13 >/dev/null 2>&1; then

              ok "Python 3.13 already available."

            else

              if curl \
                -LsSf \
                https://astral.sh/uv/install.sh \
                | sh >/dev/null 2>&1; then

                export PATH="$HOME/.local/bin:$PATH"

                export UV_PYTHON_BIN_DIR=/usr/local/bin

                if uv python install 3.13 --default >/dev/null 2>&1; then

                  if command -v python3.13 >/dev/null 2>&1; then
                    ok "Python 3.13 installed."
                  else
                    warn "Python installation completed but executable not found."
                  fi

                else

                  warn "Python 3.13 installation failed."

                fi

              else

                warn "uv installation failed."

              fi

            fi

          fi


          # ==========================================================
          # NODE.JS 22
          # ==========================================================

          if [[ "$NODE" == "true" ]]; then

            echo
            echo "🟢 Node.js 22"

            if command -v node >/dev/null 2>&1 &&
               node --version | grep -q '^v22'; then

              ok "Node.js 22 already available."

            else

              NODE_VERSION="22.19.0"

              ARCH="$(dpkg --print-architecture)"

              if [[ "$ARCH" == "amd64" ]]; then
                NODE_ARCH="x64"
              elif [[ "$ARCH" == "arm64" ]]; then
                NODE_ARCH="arm64"
              else
                warn "Unsupported architecture: $ARCH"
                NODE_ARCH=""
              fi


              if [[ -n "$NODE_ARCH" ]]; then

                TMP="/tmp/node.tar.xz"

                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --location \
                  "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz" \
                  -o "$TMP"; then

                  rm -rf /usr/local/node

                  mkdir -p /usr/local/node

                  if tar \
                    -xJf "$TMP" \
                    --strip-components=1 \
                    -C /usr/local/node; then

                    ln -sf /usr/local/node/bin/node /usr/local/bin/node
                    ln -sf /usr/local/node/bin/npm /usr/local/bin/npm
                    ln -sf /usr/local/node/bin/npx /usr/local/bin/npx

                    ok "Node.js installed."

                  else

                    warn "Node.js extraction failed."

                  fi

                else

                  warn "Node.js download failed."

                fi

                rm -f "$TMP"

              fi

            fi

          fi


          # ==========================================================
          # FIREFOX
          # ==========================================================

          if [[ "$FIREFOX" == "true" ]]; then

            echo
            echo "🦊 Firefox"

            if command -v firefox >/dev/null 2>&1; then

              ok "Firefox already available."

            elif apt-get install -y firefox >/dev/null 2>&1; then

              ok "Firefox installed."

            else

              warn "Firefox installation failed."

            fi

          fi


          # ==========================================================
          # GOOGLE CHROME
          # ==========================================================

          if [[ "$CHROME" == "true" ]]; then

            echo
            echo "🌐 Google Chrome"

            if command -v google-chrome >/dev/null 2>&1; then

              ok "Chrome already available."

            else

              TMP="/tmp/google-chrome.deb"

              if curl \
                --fail \
                --silent \
                --show-error \
                --location \
                https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
                -o "$TMP"; then

                if apt-get install -y "$TMP" >/dev/null 2>&1; then
                  ok "Chrome installed."
                else
                  warn "Chrome installation failed."
                fi

              else

                warn "Chrome download failed."

              fi

              rm -f "$TMP"

            fi

          fi


          # ==========================================================
          # VISUAL STUDIO CODE
          # ==========================================================

          if [[ "$VSCODE" == "true" ]]; then

            echo
            echo "💻 Visual Studio Code"

            if command -v code >/dev/null 2>&1; then

              ok "VS Code already available."

            else

              TMP="/tmp/vscode.deb"

              if curl \
                --fail \
                --silent \
                --show-error \
                --location \
                https://update.code.visualstudio.com/latest/linux-deb-x64/stable \
                -o "$TMP"; then

                if apt-get install -y "$TMP" >/dev/null 2>&1; then

                  if test -x /usr/bin/code; then
                    ok "VS Code installed."
                  else
                    warn "VS Code package installed but binary missing."
                  fi

                else

                  warn "VS Code installation failed."

                fi

              else

                warn "VS Code download failed."

              fi

              rm -f "$TMP"

            fi

          fi


          # ==========================================================
          # OPENCODE
          # ==========================================================

          if [[ "$OPENCODE" == "true" ]]; then

            echo
            echo "🤖 OpenCode"

            mkdir -p "$HOME/.local/bin"

            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"


            if command -v opencode >/dev/null 2>&1; then

              ok "OpenCode already available."

            else

              if curl \
                -fsSL \
                https://opencode.ai/install \
                | bash >/dev/null 2>&1; then

                export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

                if command -v opencode >/dev/null 2>&1; then
                  ok "OpenCode installed."
                else
                  warn "OpenCode installer completed but executable not found."
                fi

              else

                warn "OpenCode installation failed."

              fi

            fi

          fi


          # ==========================================================
          # ANTIGRAVITY GUI
          # ==========================================================

          if [[ "$ANTIGRAVITY_GUI" == "true" ]]; then

            echo
            echo "🚀 Antigravity GUI"

            if dpkg-query \
              -W \
              -f='${Status}' \
              antigravity \
              2>/dev/null \
              | grep -q "install ok installed"; then

              ok "Antigravity already installed."

            else

              warn "Antigravity GUI installation skipped/failed."

            fi

          fi


          # ==========================================================
          # ANTIGRAVITY CLI
          # ==========================================================

          if [[ "$ANTIGRAVITY_CLI" == "true" ]]; then

            echo
            echo "⚡ Antigravity CLI"

            mkdir -p "$HOME/.local/bin"

            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"


            if [[ -x "$HOME/.local/bin/agy" ]]; then

              ok "agy already available."

            elif curl \
              -fsSL \
              https://antigravity.google/cli/install.sh \
              | bash >/dev/null 2>&1; then

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              if [[ -x "$HOME/.local/bin/agy" ]]; then
                ok "agy installed."
              else
                warn "agy installer completed but executable not found."
              fi

            else

              warn "agy installation failed."

            fi

          fi


          # ==========================================================
          # FINAL TOOL STATUS
          # ==========================================================

          echo
          echo "════════════════════════════════════════"
          echo "🧪 FINAL TOOL STATUS"
          echo "════════════════════════════════════════"


          check() {

            NAME="$1"
            CMD="$2"

            if command -v "$CMD" >/dev/null 2>&1; then

              echo "✅ $NAME"

            else

              echo "⚠️ $NAME unavailable"

            fi

          }


          [[ "$PYTHON" == "true" ]] &&
            check "Python 3.13" python3.13

          [[ "$NODE" == "true" ]] &&
            check "Node.js" node

          [[ "$FIREFOX" == "true" ]] &&
            check "Firefox" firefox

          [[ "$CHROME" == "true" ]] &&
            check "Chrome" google-chrome

          [[ "$VSCODE" == "true" ]] &&
            check "VS Code" code

          [[ "$OPENCODE" == "true" ]] &&
            check "OpenCode" opencode

          [[ "$ANTIGRAVITY_CLI" == "true" ]] &&
            check "Antigravity CLI" agy


          echo
          echo "🎉 Optional installation phase completed."

          exit 0

          SCRIPT

          echo "::endgroup::"


      # ============================================================
      # 7. USER-LEVEL VERIFICATION
      # ============================================================

      - name: "🧪 Verify User Environment"
        shell: bash
        run: |

          set +e

          echo "::group::🧪 User Environment"

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              echo "👤 User: $(id -un)"
              echo "🏠 HOME: $HOME"

              echo
              echo "🧰 Tools"

              check() {

                NAME="$1"
                CMD="$2"

                if command -v "$CMD" >/dev/null 2>&1; then
                  echo "   ✅ $NAME"
                else
                  echo "   ⚠️ $NAME unavailable"
                fi

              }


              if [[ "${{ inputs.install_python }}" == "true" ]]; then
                check "Python 3.13" python3.13
              fi

              if [[ "${{ inputs.install_node }}" == "true" ]]; then
                check "Node.js" node
              fi

              if [[ "${{ inputs.install_firefox }}" == "true" ]]; then
                check "Firefox" firefox
              fi

              if [[ "${{ inputs.install_chrome }}" == "true" ]]; then
                check "Chrome" google-chrome
              fi

              if [[ "${{ inputs.install_vscode }}" == "true" ]]; then
                check "VS Code" code
              fi

              if [[ "${{ inputs.install_opencode }}" == "true" ]]; then
                check "OpenCode" opencode
              fi

              if [[ "${{ inputs.install_antigravity_cli }}" == "true" ]]; then
                check "agy" agy
              fi

            '


          echo "::endgroup::"


      # ============================================================
      # 8. VS CODE SAFE RUNTIME TEST
      # ============================================================

      - name: "💻 VS Code Runtime Test"
        if: ${{ inputs.install_vscode }}
        shell: bash
        run: |

          set +e

          echo "::group::💻 VS Code"

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              if ! command -v code >/dev/null 2>&1; then
                echo "⚠️ VS Code unavailable."
                exit 0
              fi

              echo "👤 Running as: $(id -un)"
              echo "📍 $(command -v code)"

              code --version \
                --user-data-dir="$HOME/.vscode-test" \
                2>/dev/null \
                | head -n 1

              rm -rf "$HOME/.vscode-test"

              echo "✅ VS Code test complete."

            '

          echo "::endgroup::"


      # ============================================================
      # 9. CLOUDFLARE
      # ============================================================

      - name: "☁️ Start Cloudflare"
        if: ${{ inputs.enable_cloudflare }}
        shell: bash
        run: |

          set +e

          echo "::group::☁️ Cloudflare"

          docker rm -f "$CLOUDFLARE_CONTAINER" \
            >/dev/null 2>&1 || true


          docker run -d \
            --name "$CLOUDFLARE_CONTAINER" \
            --network host \
            cloudflare/cloudflared:latest \
            tunnel \
            --no-autoupdate \
            --url "http://${WEBTOP_HOST}:${WEBTOP_PORT}"


          TUNNEL_URL=""

          for i in {1..60}; do

            LOGS="$(
              docker logs \
                "$CLOUDFLARE_CONTAINER" \
                2>&1
            )"

            TUNNEL_URL="$(
              echo "$LOGS" \
              | grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              | head -n 1
            )"

            if [[ -n "$TUNNEL_URL" ]]; then
              break
            fi

            sleep 2

          done


          if [[ -n "$TUNNEL_URL" ]]; then

            echo
            echo "╔══════════════════════════════════════════╗"
            echo "║        ☁️ ADIBAN CLOUD LINUX             ║"
            echo "╚══════════════════════════════════════════╝"
            echo
            echo "🌐 URL:"
            echo "$TUNNEL_URL"
            echo
            echo "👤 User:"
            echo "$WEBTOP_USER"
            echo
            echo "🏠 Home:"
            echo "$WEBTOP_HOME"
            echo


            echo "$TUNNEL_URL" \
              > "$GITHUB_WORKSPACE/cloudflare-url.txt"


            {
              echo
              echo "## ☁️ Cloudflare"
              echo
              echo "**Webtop:** $TUNNEL_URL"
              echo
              echo "**User:** \`$WEBTOP_USER\`"
              echo
              echo "⚠️ TryCloudflare URL is temporary."
            } >> "$GITHUB_STEP_SUMMARY"

          else

            echo "⚠️ Cloudflare failed."
            echo "➡️ Continuing without Cloudflare."

            docker logs \
              --tail 100 \
              "$CLOUDFLARE_CONTAINER" \
              || true

          fi

          echo "::endgroup::"


      # ============================================================
      # 10. FINAL STATUS
      # ============================================================

      - name: "📊 Final Status"
        shell: bash
        run: |

          set +e

          echo
          echo "╔══════════════════════════════════════════╗"
          echo "║             🖥️ ADIBAN LINUX             ║"
          echo "╚══════════════════════════════════════════╝"
          echo

          echo "📦 Containers:"
          docker ps \
            --filter "name=$WEBTOP_CONTAINER" \
            --filter "name=$CLOUDFLARE_CONTAINER" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo

          if docker inspect \
            --format='{{.State.Running}}' \
            "$WEBTOP_CONTAINER" \
            2>/dev/null \
            | grep -q true; then

            echo "🖥️ Webtop: ✅ RUNNING"

          else

            echo "🖥️ Webtop: ❌ STOPPED"

          fi

          echo

          if [[ -f "$GITHUB_WORKSPACE/cloudflare-url.txt" ]]; then

            echo "☁️ Cloudflare:"
            cat "$GITHUB_WORKSPACE/cloudflare-url.txt"

          else

            echo "☁️ Cloudflare: ⚠️ unavailable"

          fi


      # ============================================================
      # 11. KEEP ALIVE
      # ============================================================

      - name: "⏳ Keep Alive"
        shell: bash
        run: |

          set +e

          HOURS="${{ inputs.session_hours }}"

          TOTAL_SECONDS=$((HOURS * 3600))

          START="$(date +%s)"

          echo
          echo "🚀 ADIBAN Cloud Linux is LIVE"
          echo
          echo "⏱️ Duration: ${HOURS} hour(s)"
          echo "🖥️ Container: $WEBTOP_CONTAINER"
          echo

          while true; do

            NOW="$(date +%s)"

            ELAPSED=$((NOW - START))

            if (( ELAPSED >= TOTAL_SECONDS )); then
              break
            fi


            if ! docker inspect \
              --format='{{.State.Running}}' \
              "$WEBTOP_CONTAINER" \
              2>/dev/null \
              | grep -q true; then

              echo "❌ Webtop stopped."

              docker logs \
                --tail 100 \
                "$WEBTOP_CONTAINER" \
                || true

              break

            fi


            REMAINING=$((TOTAL_SECONDS - ELAPSED))

            H=$((REMAINING / 3600))
            M=$(((REMAINING % 3600) / 60))

            echo "⏳ Remaining: ${H}h ${M}m"

            sleep 60

          done


          echo
          echo "🏁 Session finished."


      # ============================================================
      # 12. DEBUG
      # ============================================================

      - name: "🔎 Debug"
        if: always()
        shell: bash
        run: |

          set +e

          echo "::group::🔎 Debug"

          echo "🐳 Containers:"
          docker ps -a

          echo
          echo "📜 Webtop:"
          docker logs \
            --tail 200 \
            "$WEBTOP_CONTAINER" \
            2>&1 || true

          echo
          echo "📜 Cloudflare:"
          docker logs \
            --tail 100 \
            "$CLOUDFLARE_CONTAINER" \
            2>&1 || true

          echo
          echo "💽 Disk:"
          df -h /

          echo
          echo "🧠 Memory:"
          free -h

          echo "::endgroup::"


      # ============================================================
      # 13. ARTIFACT
      # ============================================================

      - name: "📦 Upload Debug Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "adiban-cloud-${{ github.run_id }}"
          path: |
            cloudflare-url.txt
            .adiban-webtop/
          if-no-files-found: warn
          retention-days: 3


      # ============================================================
      # 14. CLEANUP
      # ============================================================

      - name: "🧹 Cleanup"
        if: always()
        shell: bash
        run: |

          set +e

          echo "::group::🧹 Cleanup"

          docker rm -f \
            "$CLOUDFLARE_CONTAINER" \
            >/dev/null 2>&1 || true

          docker rm -f \
            "$WEBTOP_CONTAINER" \
            >/dev/null 2>&1 || true

          echo "✅ Cleanup complete."

          echo "::endgroup::"
