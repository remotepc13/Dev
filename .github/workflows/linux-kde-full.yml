      - name: "🧹 Cleanup"
        if: always()
        shell: bash
        run: |
          set +e

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    🧹 CLEANUP                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""


          echo "📋 Final container status:"
          docker ps -a \
            --filter "name=${WEBTOP_CONTAINER}" \
            --filter "name=adiban-cloudflared" \
            --format \
            "table {{.Names}}\t{{.Status}}"


          echo ""
          echo "🛑 Stopping Webtop..."

          docker rm -f \
            "${WEBTOP_CONTAINER}" \
            2>/dev/null || true


          echo "🛑 Stopping Cloudflare..."

          docker rm -f \
            adiban-cloudflared \
            2>/dev/null || true


          echo ""
          echo "✅ Cleanup complete."
