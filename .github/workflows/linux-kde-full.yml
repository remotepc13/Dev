      # ============================================================
      # 23 — KEEP ALIVE
      # ============================================================

      - name: "⏳ Keep Desktop Alive — 6 Hours"
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  🟢 DESKTOP ACTIVE                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          if [ -n "${WEBTOP_PUBLIC_URL:-}" ]; then

            echo "🌍 Desktop:"
            echo "${WEBTOP_PUBLIC_URL}"
            echo ""

          fi


          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + SESSION_SECONDS))


          while true; do

            NOW=$(date +%s)
            REMAINING=$((END_TIME - NOW))


            if [ "${REMAINING}" -le 0 ]; then

              echo ""
              echo "⏰ Six-hour session completed."
              break

            fi


            HOURS=$((REMAINING / 3600))
            MINUTES=$(((REMAINING % 3600) / 60))
            SECONDS=$((REMAINING % 60))


            printf \
              "🟢 ACTIVE | ⏳ Remaining: %02dh %02dm %02ds\n" \
              "${HOURS}" \
              "${MINUTES}" \
              "${SECONDS}"


            # ------------------------------------------------------
            # Container watchdog
            # ------------------------------------------------------

            if ! docker inspect \
              "${WEBTOP_CONTAINER}" \
              >/dev/null 2>&1; then

              echo "::error::❌ Webtop container disappeared."

              exit 1

            fi


            if ! docker inspect \
              --format '{{.State.Running}}' \
              "${WEBTOP_CONTAINER}" \
              | grep -q true; then

              echo "::error::❌ Webtop container stopped."

              echo ""
              echo "📋 Last logs:"
              docker logs \
                --tail 100 \
                "${WEBTOP_CONTAINER}" || true

              exit 1

            fi


            sleep 60

          done


      # ============================================================
