name: "🖥️ ADIBAN Cloud Linux"

on:
  workflow_dispatch:
    inputs:

      # ============================================================
      # CORE
      # ============================================================

      runner:
        description: "🖥️ GitHub Runner"
        required: true
        type: choice
        default: "ubuntu-24.04"
        options:
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-latest

      timezone:
        description: "Container timezone"
        required: true
        default: "Europe/Berlin"
        type: string

      workspace_name:
        description: "Workspace / Container name"
        required: true
        default: "adiban-cloud"
        type: string

      session_hours:
        description: "Keep session alive (hours)"
        required: true
        default: "4"
        type: string

      install_python:
        description: "🐍 Python 3.13"
        required: true
        default: true
        type: boolean

      install_node:
        description: "🟢 Node.js 22"
        required: true
        default: true
        type: boolean

      install_vscode:
        description: "💻 VS Code"
        required: true
        default: true
        type: boolean

      install_opencode:
        description: "🤖 OpenCode"
        required: true
        default: true
        type: boolean

      install_firefox:
        description: "🦊 Firefox"
        required: true
        default: true
        type: boolean

      install_chrome:
        description: "🌐 Google Chrome"
        required: true
        default: false
        type: boolean

      install_antigravity_gui:
        description: "🚀 Antigravity GUI"
        required: true
        default: false
        type: boolean

      install_antigravity_cli:
        description: "⌨️ Antigravity CLI"
        required: true
        default: true
        type: boolean

      enable_webtop_auth:
        description: "🔐 Enable Webtop authentication"
        required: true
        default: true
        type: boolean

      enable_cloudflare:
        description: "☁️ Enable TryCloudflare public URL"
        required: true
        default: true
        type: boolean


jobs:

  cloud-linux:

    runs-on: ${{ inputs.runner }}

    timeout-minutes: 390

    env:

      TZ: ${{ inputs.timezone }}

      WORKSPACE_NAME: ${{ inputs.workspace_name }}

      SESSION_HOURS: ${{ inputs.session_hours }}

      WEBTOP_CONTAINER: ${{ inputs.workspace_name }}

      WEBTOP_IMAGE: lscr.io/linuxserver/webtop:ubuntu-kde

      WEBTOP_HOST: 127.0.0.1

      WEBTOP_HTTPS_PORT: 3001

      WEBTOP_USER: abc

      WEBTOP_HOME: /config

      CLOUDFLARE_ENABLED: ${{ inputs.enable_cloudflare }}

    steps:

      # ============================================================
      # CONFIGURATION
      # ============================================================

      - name: 🧾 Configuration Preview
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo "             ADIBAN CLOUD LINUX"
          echo "============================================================"
          echo
          echo "Runner              : ${{ inputs.runner }}"
          echo "Timezone            : ${{ inputs.timezone }}"
          echo "Workspace           : ${{ inputs.workspace_name }}"
          echo "Session             : ${{ inputs.session_hours }} hours"
          echo
          echo "Python 3.13         : ${{ inputs.install_python }}"
          echo "Node.js 22          : ${{ inputs.install_node }}"
          echo "VS Code             : ${{ inputs.install_vscode }}"
          echo "OpenCode            : ${{ inputs.install_opencode }}"
          echo "Firefox             : ${{ inputs.install_firefox }}"
          echo "Chrome              : ${{ inputs.install_chrome }}"
          echo "Antigravity GUI     : ${{ inputs.install_antigravity_gui }}"
          echo "Antigravity CLI     : ${{ inputs.install_antigravity_cli }}"
          echo "Webtop Auth         : ${{ inputs.enable_webtop_auth }}"
          echo "Cloudflare          : ${{ inputs.enable_cloudflare }}"
          echo
          echo "Webtop Origin       : https://${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}"
          echo "============================================================"


      # ============================================================
      # HOST CHECK
      # ============================================================

      - name: 🖥️ Host System Check
        shell: bash
        run: |
          set -e

          echo "OS:"
          cat /etc/os-release | head -n 8

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Docker:"
          docker --version

          echo
          echo "Docker info:"
          docker info >/dev/null

          echo "✅ Host is ready"


      # ============================================================
      # WORKSPACE PREPARATION
      # ============================================================

      - name: 📁 Prepare Workspace
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/workspace"

          echo "Workspace:"
          ls -la "$GITHUB_WORKSPACE"

          echo "✅ Workspace prepared"


      # ============================================================
      # OPTIONAL WEBSERVER AUTH CONFIG
      # ============================================================

      - name: 🔐 Prepare Webtop Authentication
        if: ${{ inputs.enable_webtop_auth }}
        shell: bash
        run: |
          set -e

          echo "Webtop authentication requested."

          mkdir -p "$GITHUB_WORKSPACE/webtop-config"

          cat > "$GITHUB_WORKSPACE/webtop-config/README.txt" <<'EOF'
          Webtop authentication is enabled.

          LinuxServer Webtop authentication configuration can be
          customized here if required.
          EOF

          echo "✅ Authentication configuration prepared"


      # ============================================================
      # START WEBTOP
      # ============================================================

      - name: 🚀 Start Webtop
        shell: bash
        run: |
          set -e

          echo "Stopping previous container if present..."

          docker rm -f "$WEBTOP_CONTAINER" >/dev/null 2>&1 || true

          echo
          echo "Pulling Webtop image..."

          docker pull "$WEBTOP_IMAGE"

          echo
          echo "Starting Webtop..."

          docker run -d \
            --name "$WEBTOP_CONTAINER" \
            --hostname "$WORKSPACE_NAME" \
            --shm-size="2gb" \
            --restart unless-stopped \
            -e "PUID=1000" \
            -e "PGID=1000" \
            -e "TZ=$TZ" \
            -e "TITLE=ADIBAN Cloud Linux" \
            -p "${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}:3001" \
            -v "$GITHUB_WORKSPACE/workspace:/config/workspace" \
            "$WEBTOP_IMAGE"

          echo
          echo "Container:"
          docker ps --filter "name=$WEBTOP_CONTAINER"

          echo
          echo "Port:"
          docker port "$WEBTOP_CONTAINER"

          echo
          echo "Container started."


      # ============================================================
      # WEBTOP CONTAINER HEALTH
      # ============================================================

      - name: 🩺 Wait for Webtop
        shell: bash
        run: |
          set -e

          echo "Waiting for Webtop HTTPS endpoint..."

          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do

            ATTEMPT=$((ATTEMPT + 1))

            echo
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}"

            if ! docker inspect "$WEBTOP_CONTAINER" >/dev/null 2>&1; then
              echo "❌ Container does not exist."
              exit 1
            fi

            STATUS="$(docker inspect \
              --format='{{.State.Status}}' \
              "$WEBTOP_CONTAINER" 2>/dev/null || true)"

            echo "Container status: $STATUS"

            if [ "$STATUS" != "running" ]; then
              echo "Container is not running."

              docker logs --tail 100 "$WEBTOP_CONTAINER" || true

              if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
                echo "❌ Webtop failed to start."
                exit 1
              fi

              sleep 5
              continue
            fi

            echo "Checking HTTPS endpoint..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --insecure \
              --max-time 5 \
              "https://${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}/" \
              >/dev/null 2>&1; then

              echo
              echo "============================================================"
              echo "✅ WEBTOP HTTPS ENDPOINT READY"
              echo "============================================================"
              echo
              echo "Origin:"
              echo "https://${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}"
              echo

              exit 0
            fi

            sleep 5

          done

          echo
          echo "❌ Webtop HTTPS endpoint did not become ready."

          echo
          echo "Container status:"
          docker ps -a --filter "name=$WEBTOP_CONTAINER"

          echo
          echo "Last Webtop logs:"
          docker logs --tail 200 "$WEBTOP_CONTAINER" || true

          exit 1


      # ============================================================
      # WAYLAND / SELKIES CHECK
      # ============================================================

      - name: 🖼️ Verify Wayland / Selkies
        shell: bash
        run: |
          set -e

          echo "Checking Webtop desktop stack..."

          docker exec "$WEBTOP_CONTAINER" bash -lc '
            echo "DISPLAY=$DISPLAY"
            echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"

            echo
            echo "Wayland sockets:"
            ls -la /tmp/wayland-* 2>/dev/null || true

            echo
            echo "KWin:"
            pgrep -a kwin || true

            echo
            echo "Selkies:"
            pgrep -a selkies || true
          '

          echo
          echo "✅ Desktop stack check completed"


      # ============================================================
      # OPTIONAL SOFTWARE INSTALLATION
      # IMPORTANT:
      # Failures here MUST NOT stop the workflow.
      # ============================================================

      - name: 🧰 Install Optional Tools
        shell: bash
        continue-on-error: true
        run: |

          set +e

          echo "============================================================"
          echo "             OPTIONAL SOFTWARE INSTALLATION"
          echo "============================================================"

          export DEBIAN_FRONTEND=noninteractive

          apt_update() {
            echo
            echo "Updating apt..."
            apt-get update -y
          }

          install_pkg() {
            echo
            echo "Installing: $*"
            apt-get install -y "$@"
          }


          # ========================================================
          # PYTHON 3.13
          # ========================================================

          if [ "${{ inputs.install_python }}" = "true" ]; then

            echo
            echo "🐍 Installing Python 3.13..."

            docker exec "$WEBTOP_CONTAINER" bash -lc '
              set +e

              apt-get update -y

              apt-get install -y \
                curl \
                ca-certificates \
                build-essential \
                git

              curl -LsSf https://astral.sh/uv/install.sh | sh

              export PATH="$HOME/.local/bin:$PATH"

              uv python install 3.13

              mkdir -p /usr/local/bin

              PYBIN="$(uv python find 3.13 2>/dev/null || true)"

              if [ -n "$PYBIN" ] && [ -x "$PYBIN" ]; then
                ln -sf "$PYBIN" /usr/local/bin/python3.13
              fi

              if command -v python3.13 >/dev/null 2>&1; then
                python3.13 --version
                echo "Python 3.13 installed."
              else
                echo "Python 3.13 installation could not be verified."
              fi
            '

          fi


          # ========================================================
          # NODE.JS 22
          # ========================================================

          if [ "${{ inputs.install_node }}" = "true" ]; then

            echo
            echo "🟢 Installing Node.js 22..."

            docker exec "$WEBTOP_CONTAINER" bash -lc '
              set +e

              apt-get update -y

              apt-get install -y \
                curl \
                ca-certificates

              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -

              apt-get install -y nodejs

              node --version
              npm --version
            '

          fi


          # ========================================================
          # FIREFOX
          # ========================================================

          if [ "${{ inputs.install_firefox }}" = "true" ]; then

            echo
            echo "🦊 Installing Firefox..."

            docker exec "$WEBTOP_CONTAINER" bash -lc '
              set +e

              apt-get update -y

              apt-get install -y firefox || true

              firefox --version 2>/dev/null || true
            '

          fi


          # ========================================================
          # GOOGLE CHROME
          # ========================================================

          if [ "${{ inputs.install_chrome }}" = "true" ]; then

            echo
            echo "🌐 Installing Google Chrome..."

            docker exec "$WEBTOP_CONTAINER" bash -lc '
              set +e

              apt-get update -y

              apt-get install -y \
                wget \
                ca-certificates

              wget -q \
                https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
                -O /tmp/google-chrome.deb

              apt-get install -y /tmp/google-chrome.deb

              google-chrome --version 2>/dev/null || true

              rm -f /tmp/google-chrome.deb
            '

          fi


          # ========================================================
          # VS CODE
          # ========================================================

          if [ "${{ inputs.install_vscode }}" = "true" ]; then

            echo
            echo "💻 Installing VS Code..."

            docker exec "$WEBTOP_CONTAINER" bash -lc '
              set +e

              apt-get update -y

              apt-get install -y \
                wget \
                gpg \
                apt-transport-https \
                ca-certificates

              install -d -m 0755 /etc/apt/keyrings

              wget -qO- https://packages.microsoft.com/keys/microsoft.asc \
                | gpg --dearmor \
                > /etc/apt/keyrings/packages.microsoft.gpg

              chmod a+r /etc/apt/keyrings/packages.microsoft.gpg

              echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
                > /etc/apt/sources.list.d/vscode.list

              apt-get update -y

              apt-get install -y code

              echo
              echo "VS Code package installation finished."

              code --version 2>/dev/null || true
            '

          fi


          # ========================================================
          # OPENCODE
          # ========================================================

          if [ "${{ inputs.install_opencode }}" = "true" ]; then

            echo
            echo "🤖 Installing OpenCode..."

            docker exec "$WEBTOP_CONTAINER" bash -lc '
              set +e

              apt-get update -y

              apt-get install -y \
                curl \
                ca-certificates

              curl -fsSL https://opencode.ai/install | bash

              mkdir -p /usr/local/bin

              if [ -x "$HOME/.local/bin/opencode" ]; then
                ln -sf "$HOME/.local/bin/opencode" /usr/local/bin/opencode
              fi

              if command -v opencode >/dev/null 2>&1; then
                opencode --version 2>/dev/null || true
              else
                echo "OpenCode was installed but could not be verified."
              fi
            '

          fi


          # ========================================================
          # ANTIGRAVITY GUI
          # ========================================================

          if [ "${{ inputs.install_antigravity_gui }}" = "true" ]; then

            echo
            echo "🚀 Installing Antigravity GUI..."

            docker exec "$WEBTOP_CONTAINER" bash -lc '
              set +e

              echo "Antigravity GUI installation requested."

              apt-get update -y

              apt-get install -y \
                curl \
                ca-certificates

              curl -fsSL https://antigravity.google/cli/install.sh | bash

              echo "Antigravity installer completed."
            '

          fi


          # ========================================================
          # ANTIGRAVITY CLI
          # ========================================================

          if [ "${{ inputs.install_antigravity_cli }}" = "true" ]; then

            echo
            echo "⌨️ Installing Antigravity CLI..."

            docker exec "$WEBTOP_CONTAINER" bash -lc '
              set +e

              apt-get update -y

              apt-get install -y \
                curl \
                ca-certificates

              curl -fsSL https://antigravity.google/cli/install.sh | bash

              export PATH="$HOME/.local/bin:$PATH"

              if command -v agy >/dev/null 2>&1; then
                agy --version 2>/dev/null || true
              else
                echo "agy command could not be verified."
              fi
            '

          fi


          echo
          echo "============================================================"
          echo "✅ OPTIONAL INSTALLATION STEP FINISHED"
          echo "============================================================"
          echo
          echo "Optional package failures were intentionally ignored."


      # ============================================================
      # USER ENVIRONMENT VERIFICATION
      # GUI APPLICATIONS MUST RUN AS ABC USER
      # ============================================================

      - name: 👤 Verify User Environment
        shell: bash
        run: |
          set +e

          echo "Checking applications as Webtop user..."

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '
              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              echo "User:"
              whoami

              echo
              echo "HOME:"
              echo "$HOME"

              echo
              echo "Python:"
              python3.13 --version 2>/dev/null || true

              echo
              echo "Node:"
              node --version 2>/dev/null || true

              echo
              echo "NPM:"
              npm --version 2>/dev/null || true

              echo
              echo "VS Code:"
              code --version 2>/dev/null || true

              echo
              echo "OpenCode:"
              opencode --version 2>/dev/null || true

              echo
              echo "Antigravity:"
              agy --version 2>/dev/null || true

              echo
              echo "Firefox:"
              firefox --version 2>/dev/null || true

              echo
              echo "Chrome:"
              google-chrome --version 2>/dev/null || true
            '

          echo
          echo "✅ User environment verification completed"


      # ============================================================
      # VS CODE RUNTIME TEST
      # ============================================================

      - name: 💻 VS Code Runtime Test
        if: ${{ inputs.install_vscode }}
        shell: bash
        continue-on-error: true
        run: |
          echo "Testing VS Code as abc user..."

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '
              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              echo "User:"
              whoami

              echo
              echo "HOME:"
              echo "$HOME"

              echo
              echo "VS Code:"
              code --version || true
            '

          echo "VS Code runtime test completed."


      # ============================================================
      # CLOUDFLARE
      #
      # IMPORTANT:
      # Webtop port 3001 is HTTPS.
      #
      # Cloudflared therefore MUST connect to:
      #
      # https://127.0.0.1:3001
      #
      # Webtop uses a self-signed origin certificate, therefore:
      #
      # --no-tls-verify
      #
      # is required.
      # ============================================================

      - name: ☁️ Start TryCloudflare
        if: ${{ inputs.enable_cloudflare }}
        shell: bash
        run: |

          set -e

          echo "============================================================"
          echo "                 CLOUDFLARE TUNNEL"
          echo "============================================================"

          echo
          echo "Webtop HTTPS origin:"
          echo "https://${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}"

          echo
          echo "Starting Cloudflare..."

          docker rm -f adiban-cloudflared >/dev/null 2>&1 || true

          docker run -d \
            --name adiban-cloudflared \
            --restart unless-stopped \
            cloudflare/cloudflared:latest \
            tunnel \
            --no-autoupdate \
            --no-tls-verify \
            --url "https://${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}"

          echo
          echo "Waiting for Cloudflare tunnel..."

          TUNNEL_URL=""

          for i in $(seq 1 30); do

            echo "Attempt ${i}/30"

            LOGS="$(docker logs adiban-cloudflared 2>&1 || true)"

            echo "$LOGS" | tail -n 20

            TUNNEL_URL="$(echo "$LOGS" \
              | grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              | tail -n 1 || true)"

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 3

          done

          if [ -z "$TUNNEL_URL" ]; then

            echo
            echo "❌ Cloudflare tunnel URL was not detected."

            echo
            echo "Cloudflare logs:"
            docker logs --tail 200 adiban-cloudflared || true

            exit 1

          fi

          echo
          echo "============================================================"
          echo "🌐 PUBLIC WEBTOP URL"
          echo "============================================================"
          echo
          echo "$TUNNEL_URL"
          echo
          echo "============================================================"

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"


      # ============================================================
      # FINAL STATUS
      # ============================================================

      - name: 📊 Final Status
        if: always()
        shell: bash
        run: |

          echo
          echo "============================================================"
          echo "                 ADIBAN CLOUD LINUX"
          echo "                    FINAL STATUS"
          echo "============================================================"

          echo
          echo "Container:"
          docker ps \
            --filter "name=$WEBTOP_CONTAINER" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo
          echo "Webtop Origin:"
          echo "https://${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}"

          if [ -n "${TUNNEL_URL:-}" ]; then

            echo
            echo "Public URL:"
            echo "$TUNNEL_URL"

          fi

          echo
          echo "Session:"
          echo "${SESSION_HOURS} hours"

          echo
          echo "============================================================"


      # ============================================================
      # KEEP ALIVE
      # ============================================================

      - name: ⏳ Keep Alive
        shell: bash
        run: |

          set -e

          HOURS="${SESSION_HOURS}"

          if ! [[ "$HOURS" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "Invalid SESSION_HOURS: $HOURS"
            exit 1
          fi

          SECONDS_TO_WAIT="$(awk "BEGIN {print int($HOURS * 3600)}")"

          echo
          echo "============================================================"
          echo "                    KEEP ALIVE"
          echo "============================================================"

          echo
          echo "Session duration : ${HOURS} hours"
          echo "Seconds          : ${SECONDS_TO_WAIT}"

          if [ -n "${TUNNEL_URL:-}" ]; then
            echo
            echo "🌐 Public URL:"
            echo "$TUNNEL_URL"
          fi

          echo
          echo "🟢 Cloud Linux is running..."

          START_TIME="$(date +%s)"

          while true; do

            NOW="$(date +%s)"
            ELAPSED=$((NOW - START_TIME))

            if [ "$ELAPSED" -ge "$SECONDS_TO_WAIT" ]; then
              break
            fi

            REMAINING=$((SECONDS_TO_WAIT - ELAPSED))

            HOURS_LEFT=$((REMAINING / 3600))
            MINUTES_LEFT=$(((REMAINING % 3600) / 60))

            echo \
              "[$(date '+%Y-%m-%d %H:%M:%S')] " \
              "Remaining: ${HOURS_LEFT}h ${MINUTES_LEFT}m"

            sleep 60

          done

          echo
          echo "============================================================"
          echo "⏰ SESSION TIME COMPLETED"
          echo "============================================================"


      # ============================================================
      # DEBUG
      # ============================================================

      - name: 🐛 Debug Information
        if: always()
        shell: bash
        run: |

          echo "============================================================"
          echo "                       DEBUG"
          echo "============================================================"

          echo
          echo "Docker containers:"
          docker ps -a

          echo
          echo "Webtop status:"
          docker inspect "$WEBTOP_CONTAINER" \
            --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}}' \
            2>/dev/null || true

          echo
          echo "Webtop port:"
          docker port "$WEBTOP_CONTAINER" 2>/dev/null || true

          echo
          echo "Webtop logs:"
          docker logs --tail 100 "$WEBTOP_CONTAINER" 2>/dev/null || true

          if docker ps -a --format '{{.Names}}' | grep -qx "adiban-cloudflared"; then

            echo
            echo "Cloudflare logs:"
            docker logs --tail 100 adiban-cloudflared 2>/dev/null || true

          fi


      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: 📦 Collect Logs
        if: always()
        shell: bash
        run: |

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          docker logs "$WEBTOP_CONTAINER" \
            > "$GITHUB_WORKSPACE/artifacts/webtop.log" \
            2>&1 || true

          if docker ps -a --format '{{.Names}}' | grep -qx "adiban-cloudflared"; then

            docker logs adiban-cloudflared \
              > "$GITHUB_WORKSPACE/artifacts/cloudflared.log" \
              2>&1 || true

          fi

          docker ps -a \
            > "$GITHUB_WORKSPACE/artifacts/docker-ps.txt" \
            2>&1 || true

          docker inspect "$WEBTOP_CONTAINER" \
            > "$GITHUB_WORKSPACE/artifacts/webtop-inspect.json" \
            2>&1 || true


      - name: ⬆️ Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adiban-cloud-linux-debug
          path: artifacts/
          if-no-files-found: ignore


      # ============================================================
      # CLEANUP
      # ============================================================

      - name: 🧹 Cleanup
        if: always()
        shell: bash
        run: |

          echo "Cleaning temporary resources..."

          docker rm -f adiban-cloudflared >/dev/null 2>&1 || true
          docker rm -f "$WEBTOP_CONTAINER" >/dev/null 2>&1 || true

          echo "Cleanup completed."
