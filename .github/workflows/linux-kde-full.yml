name: "🖥️ ADIBAN Cloud Linux Desktop"

on:
  workflow_dispatch:
    inputs:

      runner:
        description: "GitHub Actions Runner"
        required: true
        type: choice
        default: "ubuntu-24.04"
        options:
          - "ubuntu-24.04"
          - "ubuntu-26.04"
          - "ubuntu-latest"

      timezone:
        description: "Container Timezone"
        required: true
        type: string
        default: "Europe/Berlin"

      workspace_name:
        description: "Workspace Name"
        required: true
        type: string
        default: "adiban-cloud"

      session_hours:
        description: "Session Duration"
        required: true
        type: choice
        default: "4"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

      install_python:
        description: "🐍 Python 3.13"
        required: true
        type: boolean
        default: true

      install_node:
        description: "🟢 Node.js 22"
        required: true
        type: boolean
        default: true

      install_firefox:
        description: "🦊 Firefox"
        required: true
        type: boolean
        default: true

      install_chrome:
        description: "🌐 Google Chrome"
        required: true
        type: boolean
        default: true

      install_vscode:
        description: "💻 Visual Studio Code"
        required: true
        type: boolean
        default: true

      install_opencode:
        description: "🤖 OpenCode"
        required: true
        type: boolean
        default: true

      install_antigravity_gui:
        description: "🚀 Antigravity GUI"
        required: true
        type: boolean
        default: true

      install_antigravity_cli:
        description: "⚡ Antigravity CLI"
        required: true
        type: boolean
        default: true

      enable_webtop_auth:
        description: "🔐 Enable Webtop Authentication"
        required: true
        type: boolean
        default: false

      enable_cloudflare:
        description: "☁️ Enable TryCloudflare Tunnel"
        required: true
        type: boolean
        default: true


env:
  WEBTOP_CONTAINER: "adiban-webtop"
  WEBTOP_IMAGE: "lscr.io/linuxserver/webtop:ubuntu-kde"
  WEBTOP_USER: "abc"
  WEBTOP_HOME: "/config"
  WEBTOP_PORT: "3001"
  WEBTOP_HOST: "127.0.0.1"
  CLOUDFLARE_CONTAINER: "adiban-cloudflare"


jobs:

  desktop:

    name: "🖥️ ADIBAN Cloud Linux Desktop"

    runs-on: ${{ inputs.runner }}

    timeout-minutes: 360

    concurrency:
      group: "adiban-cloud-${{ github.repository }}-${{ inputs.workspace_name }}"
      cancel-in-progress: false


    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: "📋 System Information"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::📋 System Information"

          echo "🖥️ Hostname:"
          hostname

          echo
          echo "🐧 OS:"
          cat /etc/os-release

          echo
          echo "⚙️ Kernel:"
          uname -a

          echo
          echo "🧠 CPU:"
          nproc

          echo
          echo "💾 Memory:"
          free -h

          echo
          echo "💽 Disk:"
          df -h /

          echo
          echo "🐳 Docker:"
          docker --version

          echo "::endgroup::"


      # ============================================================
      # PREPARE HOST
      # ============================================================

      - name: "🐳 Prepare Docker"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🐳 Docker"

          docker version

          docker info

          echo "✅ Docker is ready."

          echo "::endgroup::"


      # ============================================================
      # WORKSPACE
      # ============================================================

      - name: "📁 Prepare Workspace"
        shell: bash
        run: |
          set -Eeuo pipefail

          WORKSPACE_DIR="${{ github.workspace }}/.adiban-webtop"

          echo "::group::📁 Workspace"

          mkdir -p "$WORKSPACE_DIR"

          chmod 755 "$WORKSPACE_DIR"

          echo "📁 Workspace:"
          echo "$WORKSPACE_DIR"

          echo "::endgroup::"


      # ============================================================
      # START WEBTOP
      # ============================================================

      - name: "🖥️ Start KDE Webtop"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🖥️ Starting Webtop"

          docker rm -f "$WEBTOP_CONTAINER" >/dev/null 2>&1 || true

          AUTH_ENV=""

          if [[ "${{ inputs.enable_webtop_auth }}" == "true" ]]; then
            echo "🔐 Webtop authentication enabled."

            AUTH_ENV="
              -e CUSTOM_USER=adiban
              -e PASSWORD=adiban
            "
          else
            echo "🔓 Webtop authentication disabled."
          fi

          docker run -d \
            --name "$WEBTOP_CONTAINER" \
            --restart unless-stopped \
            --shm-size="2gb" \
            -p "${WEBTOP_HOST}:${WEBTOP_PORT}:3001" \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ="${{ inputs.timezone }}" \
            -e TITLE="ADIBAN Cloud Linux" \
            -v "${{ github.workspace }}/.adiban-webtop:/config" \
            "$WEBTOP_IMAGE"

          echo
          echo "⏳ Waiting for Webtop..."

          for i in {1..60}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              "http://${WEBTOP_HOST}:${WEBTOP_PORT}/" \
              >/dev/null 2>&1; then

              echo "✅ Webtop is ready."
              break
            fi

            if [[ "$i" == "60" ]]; then
              echo "❌ Webtop failed to start."

              docker ps -a

              docker logs \
                --tail 200 \
                "$WEBTOP_CONTAINER" || true

              exit 1
            fi

            sleep 2
          done

          echo "::endgroup::"


      # ============================================================
      # WEBTOP DEBUG
      # ============================================================

      - name: "🔎 Webtop Diagnostics"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🔎 Webtop Diagnostics"

          docker ps -a

          echo
          docker inspect "$WEBTOP_CONTAINER" \
            --format='Status={{.State.Status}} Started={{.State.StartedAt}}'

          echo
          echo "📜 Recent Webtop logs:"

          docker logs \
            --tail 100 \
            "$WEBTOP_CONTAINER" || true

          echo "::endgroup::"


      # ============================================================
      # BASE PACKAGES
      # ============================================================

      - name: "📦 Install Base Packages"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::📦 Base Packages"

          docker exec \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y \
                curl \
                wget \
                git \
                git-lfs \
                unzip \
                zip \
                tar \
                gzip \
                bzip2 \
                xz-utils \
                ca-certificates \
                gnupg \
                lsb-release \
                apt-transport-https \
                software-properties-common \
                build-essential \
                pkg-config \
                jq \
                tree \
                htop \
                nano \
                vim \
                neofetch \
                procps \
                psmisc \
                net-tools \
                iproute2 \
                dnsutils \
                iputils-ping \
                socat \
                x11-utils \
                dbus-x11 \
                libnss3 \
                libatk-bridge2.0-0 \
                libgtk-3-0 \
                libgbm1 \
                libasound2 \
                libxss1 \
                libxshmfence1

              apt-get clean

              rm -rf /var/lib/apt/lists/*

            '

          echo "✅ Base packages installed."

          echo "::endgroup::"


      # ============================================================
      # PYTHON 3.13
      # ============================================================

      - name: "🐍 Install Python 3.13"
        if: ${{ inputs.install_python }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🐍 Python 3.13"

          docker exec \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"

              echo "📥 Installing uv..."

              curl -LsSf https://astral.sh/uv/install.sh | sh

              export PATH="$HOME/.local/bin:$PATH"

              echo
              echo "📍 uv:"
              command -v uv

              uv --version

              echo
              echo "📥 Installing Python 3.13..."

              export UV_PYTHON_BIN_DIR=/usr/local/bin

              uv python install 3.13 --default

              echo
              echo "🔎 Python executable:"
              command -v python3.13

              echo
              python3.13 --version

              echo
              echo "🔎 Python 3:"
              command -v python3

              python3 --version

              echo
              echo "🔎 Python:"
              command -v python

              python --version

            '

          echo "✅ Python 3.13 installed."

          {
            echo
            echo "### 🐍 Python"
            echo
            echo "✅ Python 3.13 installed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::endgroup::"


      # ============================================================
      # NODE.JS 22
      # ============================================================

      - name: "🟢 Install Node.js 22"
        if: ${{ inputs.install_node }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🟢 Node.js 22"

          docker exec \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              NODE_VERSION="22.19.0"

              ARCH="$(dpkg --print-architecture)"

              case "$ARCH" in
                amd64)
                  NODE_ARCH="x64"
                  ;;
                arm64)
                  NODE_ARCH="arm64"
                  ;;
                *)
                  echo "❌ Unsupported architecture: $ARCH"
                  exit 1
                  ;;
              esac

              TMP="/tmp/node.tar.xz"

              echo "📥 Downloading Node.js ${NODE_VERSION}..."

              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz" \
                -o "$TMP"

              rm -rf /usr/local/node

              mkdir -p /usr/local/node

              tar \
                -xJf "$TMP" \
                --strip-components=1 \
                -C /usr/local/node

              rm -f "$TMP"

              ln -sf /usr/local/node/bin/node /usr/local/bin/node
              ln -sf /usr/local/node/bin/npm /usr/local/bin/npm
              ln -sf /usr/local/node/bin/npx /usr/local/bin/npx
              ln -sf /usr/local/node/bin/corepack /usr/local/bin/corepack

              echo "📍 Node:"
              command -v node

              node --version

              echo "📍 npm:"
              command -v npm

              npm --version

            '

          echo "✅ Node.js installed."

          echo "::endgroup::"


      # ============================================================
      # FIREFOX
      # ============================================================

      - name: "🦊 Install Firefox"
        if: ${{ inputs.install_firefox }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🦊 Firefox"

          docker exec \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y firefox

              apt-get clean

              rm -rf /var/lib/apt/lists/*

              echo
              echo "📍 Firefox:"
              command -v firefox

              firefox --version

            '

          echo "✅ Firefox installed."

          echo "::endgroup::"


      # ============================================================
      # GOOGLE CHROME
      # ============================================================

      - name: "🌐 Install Google Chrome"
        if: ${{ inputs.install_chrome }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🌐 Google Chrome"

          docker exec \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              TMP="/tmp/google-chrome.deb"

              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
                -o "$TMP"

              apt-get update

              apt-get install -y "$TMP"

              rm -f "$TMP"

              apt-get clean

              rm -rf /var/lib/apt/lists/*

              echo
              echo "📍 Chrome:"
              command -v google-chrome

              google-chrome --version

            '

          echo "✅ Google Chrome installed."

          echo "::endgroup::"


      # ============================================================
      # VISUAL STUDIO CODE INSTALL
      # ============================================================

      - name: "💻 Install Visual Studio Code"
        if: ${{ inputs.install_vscode }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::💻 Visual Studio Code"

          docker exec \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              TMP="/tmp/vscode.deb"

              echo "📥 Downloading VS Code..."

              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                https://update.code.visualstudio.com/latest/linux-deb-x64/stable \
                -o "$TMP"

              apt-get update

              apt-get install -y "$TMP"

              rm -f "$TMP"

              apt-get clean

              rm -rf /var/lib/apt/lists/*

              echo
              echo "🔎 VS Code binary:"

              test -x /usr/bin/code

              command -v code

              echo
              echo "📦 Package:"

              dpkg-query \
                -W \
                -f="\${Package} \${Version}\n" \
                code

              echo
              echo "ℹ️ VS Code installation verified."

            '

          echo "✅ VS Code package installed."

          echo "::endgroup::"


      # ============================================================
      # VS CODE USER RUNTIME TEST
      # ============================================================

      - name: "🧪 Verify VS Code Runtime"
        if: ${{ inputs.install_vscode }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🧪 VS Code Runtime"

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              echo "👤 User:"
              id -un

              echo
              echo "🏠 HOME:"
              echo "$HOME"

              echo
              echo "📍 VS Code:"
              command -v code

              echo
              echo "💻 Version:"
              code --version | head -n 1

              echo
              echo "🧪 Runtime test..."

              TEST_DIR="$HOME/.vscode-runtime-test"

              rm -rf "$TEST_DIR"

              mkdir -p "$TEST_DIR/extensions"

              code \
                --user-data-dir="$TEST_DIR" \
                --extensions-dir="$TEST_DIR/extensions" \
                --version \
                >/dev/null

              rm -rf "$TEST_DIR"

              echo "✅ VS Code runtime test passed."

            '

          {
            echo
            echo "### 💻 Visual Studio Code"
            echo
            echo "✅ Installed and executable as **${WEBTOP_USER}**."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::endgroup::"


      # ============================================================
      # OPENCODE
      # ============================================================

      - name: "🤖 Install OpenCode"
        if: ${{ inputs.install_opencode }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🤖 OpenCode"

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              mkdir -p "$HOME/.local/bin"

              echo "📥 Installing OpenCode..."

              curl \
                -fsSL \
                https://opencode.ai/install \
                | bash

              echo
              echo "🔎 Searching for OpenCode..."

              FOUND=""

              for candidate in \
                "$HOME/.local/bin/opencode" \
                "$HOME/.opencode/bin/opencode" \
                "$HOME/.opencode/bin/opencode-linux-x64" \
                "/usr/local/bin/opencode"
              do
                if [[ -x "$candidate" ]]; then
                  FOUND="$candidate"
                  break
                fi
              done

              if [[ -z "$FOUND" ]]; then

                FOUND="$(find "$HOME" -type f -name opencode -perm -111 2>/dev/null | head -n 1 || true)"

              fi

              if [[ -z "$FOUND" ]]; then
                echo "❌ OpenCode executable was not found."
                exit 1
              fi

              if [[ "$FOUND" != "$HOME/.local/bin/opencode" ]]; then
                cp "$FOUND" "$HOME/.local/bin/opencode"
                chmod +x "$HOME/.local/bin/opencode"
              fi

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              echo
              echo "📍 OpenCode:"
              command -v opencode

              echo
              echo "💻 Version:"

              opencode --version

            '

          echo "✅ OpenCode installed."

          echo "::endgroup::"


      # ============================================================
      # ANTIGRAVITY GUI
      # ============================================================

      - name: "🚀 Install Antigravity GUI"
        if: ${{ inputs.install_antigravity_gui }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🚀 Antigravity GUI"

          docker exec \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              export DEBIAN_FRONTEND=noninteractive

              echo "📥 Adding Antigravity repository..."

              curl \
                -fsSL \
                https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg \
                | gpg \
                  --dearmor \
                  --yes \
                  -o /usr/share/keyrings/antigravity.gpg

              echo \
                "deb [signed-by=/usr/share/keyrings/antigravity.gpg] https://us-central1-apt.pkg.dev/projects/antigravity stable main" \
                > /etc/apt/sources.list.d/antigravity.list

              apt-get update

              apt-get install -y antigravity

              apt-get clean

              rm -rf /var/lib/apt/lists/*

              echo
              echo "🔎 Antigravity package:"

              dpkg-query \
                -W \
                -f="\${Package} \${Version}\n" \
                antigravity

            '

          echo "✅ Antigravity GUI package installed."

          echo "::endgroup::"


      # ============================================================
      # ANTIGRAVITY CLI
      # ============================================================

      - name: "⚡ Install Antigravity CLI"
        if: ${{ inputs.install_antigravity_cli }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::⚡ Antigravity CLI"

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              mkdir -p "$HOME/.local/bin"

              echo "📥 Installing Antigravity CLI..."

              curl \
                -fsSL \
                https://antigravity.google/cli/install.sh \
                | bash

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              echo
              echo "📍 agy:"

              test -x "$HOME/.local/bin/agy"

              command -v agy

              echo
              echo "💻 Version:"

              agy --version

            '

          echo "✅ Antigravity CLI installed."

          echo "::endgroup::"


      # ============================================================
      # VERIFY ALL SOFTWARE
      # ============================================================

      - name: "🧪 Verify Installed Software"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🧪 Software Verification"

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              echo "👤 User: $(id -un)"
              echo "🏠 HOME: $HOME"

              echo
              echo "======================================"
              echo "🧪 SOFTWARE STATUS"
              echo "======================================"

              check_user() {

                local NAME="$1"
                local CMD="$2"
                local REQUIRED="$3"

                echo
                echo "🔹 $NAME"

                if command -v "$CMD" >/dev/null 2>&1; then

                  echo "   📍 $(command -v "$CMD")"

                  if "$CMD" --version >/dev/null 2>&1; then
                    "$CMD" --version | head -n 1 || true
                  fi

                  echo "   ✅ OK"

                else

                  if [[ "$REQUIRED" == "true" ]]; then
                    echo "   ❌ MISSING"
                    exit 1
                  else
                    echo "   ⚠️ OPTIONAL / NOT INSTALLED"
                  fi

                fi
              }

              check_user "Python 3.13" python3.13 "${{ inputs.install_python }}"
              check_user "Node.js" node "${{ inputs.install_node }}"
              check_user "Firefox" firefox "${{ inputs.install_firefox }}"
              check_user "Chrome" google-chrome "${{ inputs.install_chrome }}"
              check_user "VS Code" code "${{ inputs.install_vscode }}"
              check_user "OpenCode" opencode "${{ inputs.install_opencode }}"
              check_user "Antigravity CLI" agy "${{ inputs.install_antigravity_cli }}"

              echo
              echo "======================================"
              echo "🎉 VERIFICATION COMPLETE"
              echo "======================================"

            '

          echo "✅ Software verification completed."

          echo "::endgroup::"


      # ============================================================
      # CREATE DESKTOP SHORTCUTS
      # ============================================================

      - name: "🧩 Create Desktop Shortcuts"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::🧩 Desktop Shortcuts"

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              set -Eeuo pipefail

              DESKTOP="$HOME/Desktop"

              mkdir -p "$DESKTOP"

              if command -v code >/dev/null 2>&1; then

                cat > "$DESKTOP/Visual Studio Code.desktop" <<EOF
              [Desktop Entry]
              Version=1.0
              Type=Application
              Name=Visual Studio Code
              Comment=Visual Studio Code
              Exec=code --no-sandbox
              Icon=code
              Terminal=false
              Categories=Development;IDE;
              EOF

                chmod +x "$DESKTOP/Visual Studio Code.desktop"

              fi


              if command -v google-chrome >/dev/null 2>&1; then

                cat > "$DESKTOP/Google Chrome.desktop" <<EOF
              [Desktop Entry]
              Version=1.0
              Type=Application
              Name=Google Chrome
              Exec=google-chrome --no-sandbox
              Icon=google-chrome
              Terminal=false
              Categories=Network;WebBrowser;
              EOF

                chmod +x "$DESKTOP/Google Chrome.desktop"

              fi


              if command -v firefox >/dev/null 2>&1; then

                cat > "$DESKTOP/Firefox.desktop" <<EOF
              [Desktop Entry]
              Version=1.0
              Type=Application
              Name=Firefox
              Exec=firefox
              Icon=firefox
              Terminal=false
              Categories=Network;WebBrowser;
              EOF

                chmod +x "$DESKTOP/Firefox.desktop"

              fi

              echo "✅ Desktop shortcuts created."

            '

          echo "::endgroup::"


      # ============================================================
      # CLOUDFLARE
      # ============================================================

      - name: "☁️ Start TryCloudflare"
        if: ${{ inputs.enable_cloudflare }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::☁️ TryCloudflare"

          docker rm -f "$CLOUDFLARE_CONTAINER" >/dev/null 2>&1 || true

          docker run -d \
            --name "$CLOUDFLARE_CONTAINER" \
            --network host \
            cloudflare/cloudflared:latest \
            tunnel \
            --no-autoupdate \
            --url "http://${WEBTOP_HOST}:${WEBTOP_PORT}"

          echo "⏳ Waiting for Cloudflare tunnel..."

          TUNNEL_URL=""

          for i in {1..60}; do

            LOGS="$(docker logs "$CLOUDFLARE_CONTAINER" 2>&1 || true)"

            TUNNEL_URL="$(
              echo "$LOGS" \
              | grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              | head -n 1 \
              || true
            )"

            if [[ -n "$TUNNEL_URL" ]]; then
              break
            fi

            sleep 2

          done


          if [[ -z "$TUNNEL_URL" ]]; then

            echo "❌ Cloudflare tunnel URL was not detected."

            docker logs \
              --tail 200 \
              "$CLOUDFLARE_CONTAINER" || true

            exit 1

          fi


          echo
          echo "=========================================="
          echo "☁️ ADIBAN CLOUD LINUX"
          echo "=========================================="
          echo
          echo "🌐 Webtop URL:"
          echo "$TUNNEL_URL"
          echo
          echo "👤 User:"
          echo "$WEBTOP_USER"
          echo
          echo "🏠 Home:"
          echo "$WEBTOP_HOME"
          echo
          echo "⏱️ Session:"
          echo "${{ inputs.session_hours }} hours"
          echo
          echo "=========================================="


          {
            echo
            echo "## ☁️ ADIBAN Cloud Linux"
            echo
            echo "### 🌐 Webtop"
            echo
            echo "**URL:** $TUNNEL_URL"
            echo
            echo "**User:** \`$WEBTOP_USER\`"
            echo
            echo "**Home:** \`$WEBTOP_HOME\`"
            echo
            echo "**Session:** \`${{ inputs.session_hours }} hours\`"
            echo
            echo "> ⚠️ TryCloudflare URLs are temporary."
          } >> "$GITHUB_STEP_SUMMARY"


          echo "$TUNNEL_URL" > "$GITHUB_WORKSPACE/cloudflare-url.txt"

          echo "::endgroup::"


      # ============================================================
      # LOCAL HEALTH CHECK
      # ============================================================

      - name: "❤️ Health Check"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::❤️ Health Check"

          echo "🖥️ Container:"
          docker ps \
            --filter "name=$WEBTOP_CONTAINER" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo
          echo "🌐 HTTP:"

          curl \
            --silent \
            --show-error \
            --fail \
            "http://${WEBTOP_HOST}:${WEBTOP_PORT}/" \
            -o /dev/null

          echo "✅ Webtop HTTP endpoint is healthy."

          echo
          echo "🧠 Processes:"

          docker exec \
            "$WEBTOP_CONTAINER" \
            bash -lc 'ps aux | head -n 20'

          echo "::endgroup::"


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: "📊 Final Summary"
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo
            echo "## 🖥️ ADIBAN Cloud Linux Desktop"
            echo
            echo "| Component | Status |"
            echo "|---|---|"
            echo "| 🖥️ KDE Webtop | ✅ Ready |"
            echo "| 🐍 Python 3.13 | $([[ '${{ inputs.install_python }}' == 'true' ]] && echo '✅ Enabled' || echo '⏭️ Disabled') |"
            echo "| 🟢 Node.js 22 | $([[ '${{ inputs.install_node }}' == 'true' ]] && echo '✅ Enabled' || echo '⏭️ Disabled') |"
            echo "| 🦊 Firefox | $([[ '${{ inputs.install_firefox }}' == 'true' ]] && echo '✅ Enabled' || echo '⏭️ Disabled') |"
            echo "| 🌐 Chrome | $([[ '${{ inputs.install_chrome }}' == 'true' ]] && echo '✅ Enabled' || echo '⏭️ Disabled') |"
            echo "| 💻 VS Code | $([[ '${{ inputs.install_vscode }}' == 'true' ]] && echo '✅ Enabled' || echo '⏭️ Disabled') |"
            echo "| 🤖 OpenCode | $([[ '${{ inputs.install_opencode }}' == 'true' ]] && echo '✅ Enabled' || echo '⏭️ Disabled') |"
            echo "| 🚀 Antigravity GUI | $([[ '${{ inputs.install_antigravity_gui }}' == 'true' ]] && echo '✅ Enabled' || echo '⏭️ Disabled') |"
            echo "| ⚡ Antigravity CLI | $([[ '${{ inputs.install_antigravity_cli }}' == 'true' ]] && echo '✅ Enabled' || echo '⏭️ Disabled') |"
            echo "| ☁️ Cloudflare | $([[ '${{ inputs.enable_cloudflare }}' == 'true' ]] && echo '✅ Enabled' || echo '⏭️ Disabled') |"
            echo
            echo "### ⚙️ Environment"
            echo
            echo "- **Runner:** \`${{ inputs.runner }}\`"
            echo "- **Timezone:** \`${{ inputs.timezone }}\`"
            echo "- **Workspace:** \`${{ inputs.workspace_name }}\`"
            echo "- **Session:** \`${{ inputs.session_hours }} hours\`"
            echo "- **Container:** \`$WEBTOP_CONTAINER\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # KEEP ALIVE
      # ============================================================

      - name: "⏳ Keep Desktop Alive"
        shell: bash
        run: |
          set -Eeuo pipefail

          HOURS="${{ inputs.session_hours }}"
          SECONDS_TOTAL=$((HOURS * 60 * 60))

          echo
          echo "╔══════════════════════════════════════════╗"
          echo "║       🖥️ ADIBAN CLOUD LINUX             ║"
          echo "╚══════════════════════════════════════════╝"
          echo
          echo "⏳ Keeping session alive for ${HOURS} hour(s)..."
          echo "🖥️ Webtop container: $WEBTOP_CONTAINER"
          echo

          START_TIME="$(date +%s)"

          while true; do

            NOW="$(date +%s)"
            ELAPSED=$((NOW - START_TIME))

            if (( ELAPSED >= SECONDS_TOTAL )); then
              break
            fi

            REMAINING=$((SECONDS_TOTAL - ELAPSED))

            HOURS_LEFT=$((REMAINING / 3600))
            MINUTES_LEFT=$(((REMAINING % 3600) / 60))
            SECONDS_LEFT=$((REMAINING % 60))

            echo \
              "⏳ Remaining: ${HOURS_LEFT}h ${MINUTES_LEFT}m ${SECONDS_LEFT}s"

            if ! docker inspect \
              --format='{{.State.Running}}' \
              "$WEBTOP_CONTAINER" \
              2>/dev/null \
              | grep -q true; then

              echo "❌ Webtop container stopped unexpectedly."

              docker logs \
                --tail 200 \
                "$WEBTOP_CONTAINER" || true

              exit 1

            fi

            sleep 60

          done

          echo
          echo "🎉 Session duration completed."
          echo "🧹 Starting cleanup..."


      # ============================================================
      # DEBUG LOGS
      # ============================================================

      - name: "🔎 Collect Debug Information"
        if: always()
        shell: bash
        run: |
          set +e

          echo "::group::🔎 Debug Information"

          echo "🐳 Docker containers:"
          docker ps -a

          echo
          echo "📜 Webtop logs:"
          docker logs \
            --tail 300 \
            "$WEBTOP_CONTAINER" \
            2>&1 || true

          echo
          echo "📜 Cloudflare logs:"
          docker logs \
            --tail 200 \
            "$CLOUDFLARE_CONTAINER" \
            2>&1 || true

          echo
          echo "💽 Disk:"
          df -h

          echo
          echo "🧠 Memory:"
          free -h

          echo "::endgroup::"


      # ============================================================
      # UPLOAD DEBUG ARTIFACT
      # ============================================================

      - name: "📦 Upload Debug Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "adiban-cloud-linux-${{ github.run_id }}"
          path: |
            cloudflare-url.txt
            .adiban-webtop/
          if-no-files-found: warn
          retention-days: 3


      # ============================================================
      # CLEANUP
      # ============================================================

      - name: "🧹 Cleanup"
        if: always()
        shell: bash
        run: |
          set +e

          echo "::group::🧹 Cleanup"

          docker rm -f \
            "$CLOUDFLARE_CONTAINER" \
            >/dev/null 2>&1 || true

          docker rm -f \
            "$WEBTOP_CONTAINER" \
            >/dev/null 2>&1 || true

          echo "🧹 Containers removed."

          docker ps -a || true

          echo "✅ Cleanup complete."

          echo "::endgroup::"
