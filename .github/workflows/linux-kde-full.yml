                "🤖 OpenCode" \
                "opencode --version"


              check \
                "⚡ Antigravity CLI" \
                "agy --version"


              check \
                "🚀 Antigravity" \
                "command -v antigravity"


              echo ""
              echo "╔══════════════════════════════════════════════════════════════╗"
              echo "║                    📊 RESULT                               ║"
              echo "╚══════════════════════════════════════════════════════════════╝"
              echo ""
              echo "✅ Passed : $PASS"
              echo "📦 Total  : $TOTAL"

            '


