name: "🖥️ ADIBAN Cloud Linux"

on:
  workflow_dispatch:
    inputs:

      # ============================================================
      # CORE
      # ============================================================

      runner:
        description: "🖥️ GitHub Runner"
        required: true
        type: choice
        default: "ubuntu-24.04"
        options:
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-latest
          
      timezone:
        description: "⏱️ Container timezone"
        required: true
        default: "Europe/Berlin"
        type: string

      workspace_name:
        description: "📁 Workspace / Container name"
        required: true
        default: "adiban-cloud"
        type: string

      session_hours:
        description: "🌍 Keep session alive (hours)"
        required: true
        default: "4"
        type: string

      install_python:
        description: "🐍 Python 3.13"
        required: true
        default: true
        type: boolean

      install_node:
        description: "🟢 Node.js 22"
        required: true
        default: true
        type: boolean

      install_vscode:
        description: "💻 VS Code"
        required: true
        default: true
        type: boolean

      install_opencode:
        description: "🤖 OpenCode"
        required: true
        default: true
        type: boolean

      install_firefox:
        description: "🦊 Firefox"
        required: true
        default: true
        type: boolean

      install_chrome:
        description: "🌐 Google Chrome"
        required: true
        default: false
        type: boolean

      install_antigravity_gui:
        description: "🚀 Antigravity GUI"
        required: true
        default: false
        type: boolean

      install_antigravity_cli:
        description: "⌨️ Antigravity CLI"
        required: true
        default: true
        type: boolean

      enable_cloudflare:
        description: "☁️ Enable TryCloudflare public URL"
        required: true
        default: true
        type: boolean


jobs:

  cloud-linux:

    runs-on: ${{ inputs.runner }}

    timeout-minutes: 390

    env:

      TZ: ${{ inputs.timezone }}

      WORKSPACE_NAME: ${{ inputs.workspace_name }}

      SESSION_HOURS: ${{ inputs.session_hours }}

      WEBTOP_CONTAINER: ${{ inputs.workspace_name }}

      WEBTOP_IMAGE: lscr.io/linuxserver/webtop:ubuntu-kde

      WEBTOP_USER: abc

      WEBTOP_HOME: /config

      WEBTOP_HOST: 127.0.0.1

      WEBTOP_HTTPS_PORT: 3001

      DOCKER_NETWORK: adiban-cloud-network

    steps:

      # ============================================================
      # CONFIGURATION
      # ============================================================

      - name: 🧾 Configuration Preview
        shell: bash
        run: |

          set -u

          echo "============================================================"
          echo "                 ADIBAN CLOUD LINUX"
          echo "============================================================"

          echo
          echo "Runner              : ${{ inputs.runner }}"
          echo "Timezone            : ${{ inputs.timezone }}"
          echo "Workspace           : ${{ inputs.workspace_name }}"
          echo "Session             : ${{ inputs.session_hours }} hours"

          echo
          echo "------------------------------------------------------------"
          echo "OPTIONAL SOFTWARE"
          echo "------------------------------------------------------------"

          echo "Python 3.13         : ${{ inputs.install_python }}"
          echo "Node.js 22          : ${{ inputs.install_node }}"
          echo "VS Code             : ${{ inputs.install_vscode }}"
          echo "OpenCode            : ${{ inputs.install_opencode }}"
          echo "Firefox             : ${{ inputs.install_firefox }}"
          echo "Chrome              : ${{ inputs.install_chrome }}"
          echo "Antigravity GUI     : ${{ inputs.install_antigravity_gui }}"
          echo "Antigravity CLI     : ${{ inputs.install_antigravity_cli }}"

          echo
          echo "------------------------------------------------------------"
          echo "NETWORK"
          echo "------------------------------------------------------------"

          echo "Docker Network      : $DOCKER_NETWORK"
          echo "Webtop HTTPS Port   : $WEBTOP_HTTPS_PORT"
          echo "Public Cloudflare   : ${{ inputs.enable_cloudflare }}"

          echo
          echo "Webtop Origin:"
          echo "https://${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}"

          echo
          echo "============================================================"


      # ============================================================
      # HOST CHECK
      # ============================================================

      - name: 🖥️ Host System Check
        shell: bash
        run: |

          set -e

          echo "Operating System:"
          cat /etc/os-release | head -n 8

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Docker:"
          docker --version

          echo
          echo "Docker Info:"
          docker info >/dev/null

          echo
          echo "Docker Compose:"
          docker compose version 2>/dev/null || true

          echo
          echo "✅ Host is ready"


      # ============================================================
      # WORKSPACE
      # ============================================================

      - name: 📁 Prepare Workspace
        shell: bash
        run: |

          set -e

          mkdir -p "$GITHUB_WORKSPACE/workspace"

          echo "Workspace:"
          ls -la "$GITHUB_WORKSPACE"

          echo
          echo "Workspace directory:"
          ls -la "$GITHUB_WORKSPACE/workspace"

          echo
          echo "✅ Workspace prepared"


      # ============================================================
      # DOCKER NETWORK
      # ============================================================

      - name: 🌐 Create Docker Network
        shell: bash
        run: |

          set -e

          echo "Creating Docker network..."

          if docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1; then

            echo "Docker network already exists."

          else

            docker network create \
              --driver bridge \
              "$DOCKER_NETWORK"

          fi

          echo
          echo "Network details:"

          docker network inspect "$DOCKER_NETWORK"

          echo
          echo "✅ Docker network ready"


      # ============================================================
      # CLEAN PREVIOUS CONTAINERS
      # ============================================================

      - name: 🧹 Remove Previous Containers
        shell: bash
        run: |

          set +e

          docker rm -f "$WEBTOP_CONTAINER" >/dev/null 2>&1 || true
          docker rm -f adiban-cloudflared >/dev/null 2>&1 || true

          echo "Previous containers removed."


      # ============================================================
      # PULL WEBTOP
      # ============================================================

      - name: 📥 Pull Webtop
        shell: bash
        run: |

          set -e

          echo "Pulling:"
          echo "$WEBTOP_IMAGE"

          docker pull "$WEBTOP_IMAGE"

          echo
          echo "✅ Webtop image ready"


      # ============================================================
      # START WEBTOP
      #
      # IMPORTANT:
      #
      # 3001 = HTTPS
      # 3000 = HTTP
      #
      # We intentionally expose ONLY 3001.
      # ============================================================

      - name: 🚀 Start Webtop
        shell: bash
        run: |

          set -e

          echo "Starting Webtop..."

          docker run -d \
            --name "$WEBTOP_CONTAINER" \
            --hostname "$WORKSPACE_NAME" \
            --network "$DOCKER_NETWORK" \
            --shm-size="2gb" \
            --restart unless-stopped \
            -e "PUID=1000" \
            -e "PGID=1000" \
            -e "TZ=$TZ" \
            -e "TITLE=ADIBAN Cloud Linux" \
            -p "${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}:3001" \
            -v "$GITHUB_WORKSPACE/workspace:/config/workspace" \
            "$WEBTOP_IMAGE"

          echo
          echo "Container:"
          docker ps \
            --filter "name=$WEBTOP_CONTAINER"

          echo
          echo "Port mapping:"
          docker port "$WEBTOP_CONTAINER"

          echo
          echo "Network:"
          docker inspect \
            "$WEBTOP_CONTAINER" \
            --format='{{json .NetworkSettings.Networks}}'

          echo
          echo "✅ Webtop started"


      # ============================================================
      # WAIT FOR WEBTOP
      #
      # REAL HTTPS HEALTH CHECK
      # ============================================================

      - name: 🩺 Wait for Webtop HTTPS
        shell: bash
        run: |

          set -e

          echo "Waiting for Webtop HTTPS..."

          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do

            ATTEMPT=$((ATTEMPT + 1))

            echo
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}"

            STATUS="$(
              docker inspect \
                --format='{{.State.Status}}' \
                "$WEBTOP_CONTAINER" \
                2>/dev/null || true
            )"

            echo "Container status: $STATUS"

            if [ "$STATUS" != "running" ]; then

              echo
              echo "Container is not running."

              docker logs \
                --tail 100 \
                "$WEBTOP_CONTAINER" \
                2>/dev/null || true

              sleep 5
              continue

            fi

            echo "Testing HTTPS endpoint..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --insecure \
              --max-time 5 \
              "https://${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}/" \
              >/dev/null 2>&1; then

              echo
              echo "============================================================"
              echo "             ✅ WEBTOP HTTPS READY"
              echo "============================================================"

              echo
              echo "Origin:"
              echo "https://${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}"

              exit 0

            fi

            sleep 5

          done

          echo
          echo "============================================================"
          echo "             ❌ WEBTOP FAILED TO START"
          echo "============================================================"

          echo
          echo "Container:"
          docker ps -a \
            --filter "name=$WEBTOP_CONTAINER"

          echo
          echo "Logs:"
          docker logs \
            --tail 250 \
            "$WEBTOP_CONTAINER" \
            2>/dev/null || true

          exit 1


      # ============================================================
      # WAYLAND / SELKIES
      # ============================================================

      - name: 🖼️ Verify Wayland and Selkies
        shell: bash
        run: |

          set -e

          echo "Checking desktop stack..."

          docker exec \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              echo "============================================================"
              echo "USER"
              echo "============================================================"

              whoami

              echo
              echo "============================================================"
              echo "DISPLAY"
              echo "============================================================"

              echo "DISPLAY=$DISPLAY"
              echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"

              echo
              echo "============================================================"
              echo "WAYLAND SOCKETS"
              echo "============================================================"

              ls -la /tmp/wayland-* 2>/dev/null || true

              echo
              echo "============================================================"
              echo "KWIN"
              echo "============================================================"

              pgrep -a kwin || true

              echo
              echo "============================================================"
              echo "SELKIES"
              echo "============================================================"

              pgrep -a selkies || true

            '

          echo
          echo "✅ Desktop stack check completed"


      # ============================================================
      # OPTIONAL TOOLS
      #
      # IMPORTANT:
      # Individual tool failures DO NOT fail the workflow.
      # ============================================================

      - name: 🧰 Install Optional Tools
        shell: bash
        continue-on-error: true
        run: |

          set +e

          echo "============================================================"
          echo "             OPTIONAL SOFTWARE"
          echo "============================================================"

          run_in_webtop() {

            docker exec \
              "$WEBTOP_CONTAINER" \
              bash -lc "$1"

          }


          # ========================================================
          # BASE PACKAGES
          # ========================================================

          echo
          echo "Installing base development packages..."

          run_in_webtop '

            set +e

            export DEBIAN_FRONTEND=noninteractive

            apt-get update -y

            apt-get install -y \
              curl \
              wget \
              git \
              ca-certificates \
              gnupg \
              unzip \
              zip \
              build-essential \
              jq

          '


          # ========================================================
          # PYTHON 3.13
          # ========================================================

          if [ "${{ inputs.install_python }}" = "true" ]; then

            echo
            echo "============================================================"
            echo "🐍 PYTHON 3.13"
            echo "============================================================"

            run_in_webtop '

              set +e

              export DEBIAN_FRONTEND=noninteractive

              apt-get update -y

              apt-get install -y \
                curl \
                ca-certificates \
                build-essential \
                git

              curl -LsSf \
                https://astral.sh/uv/install.sh \
                | sh

              export PATH="$HOME/.local/bin:$PATH"

              uv python install 3.13

              PYBIN="$(
                uv python find 3.13 2>/dev/null || true
              )"

              if [ -n "$PYBIN" ] && [ -x "$PYBIN" ]; then

                ln -sf \
                  "$PYBIN" \
                  /usr/local/bin/python3.13

              fi

              python3.13 --version 2>/dev/null || true

            '

          fi


          # ========================================================
          # NODE.JS 22
          # ========================================================

          if [ "${{ inputs.install_node }}" = "true" ]; then

            echo
            echo "============================================================"
            echo "🟢 NODE.JS 22"
            echo "============================================================"

            run_in_webtop '

              set +e

              export DEBIAN_FRONTEND=noninteractive

              apt-get update -y

              apt-get install -y \
                curl \
                ca-certificates

              curl -fsSL \
                https://deb.nodesource.com/setup_22.x \
                | bash -

              apt-get install -y nodejs

              echo
              node --version 2>/dev/null || true

              echo
              npm --version 2>/dev/null || true

            '

          fi


          # ========================================================
          # FIREFOX
          # ========================================================

          if [ "${{ inputs.install_firefox }}" = "true" ]; then

            echo
            echo "============================================================"
            echo "🦊 FIREFOX"
            echo "============================================================"

            run_in_webtop '

              set +e

              export DEBIAN_FRONTEND=noninteractive

              apt-get update -y

              apt-get install -y firefox

              firefox --version 2>/dev/null || true

            '

          fi


          # ========================================================
          # GOOGLE CHROME
          # ========================================================

          if [ "${{ inputs.install_chrome }}" = "true" ]; then

            echo
            echo "============================================================"
            echo "🌐 GOOGLE CHROME"
            echo "============================================================"

            run_in_webtop '

              set +e

              export DEBIAN_FRONTEND=noninteractive

              apt-get update -y

              apt-get install -y \
                wget \
                ca-certificates

              wget -q \
                https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
                -O /tmp/google-chrome.deb

              apt-get install -y \
                /tmp/google-chrome.deb

              google-chrome \
                --version \
                2>/dev/null || true

              rm -f /tmp/google-chrome.deb

            '

          fi


          # ========================================================
          # VS CODE
          # ========================================================

          if [ "${{ inputs.install_vscode }}" = "true" ]; then

            echo
            echo "============================================================"
            echo "💻 VISUAL STUDIO CODE"
            echo "============================================================"

            run_in_webtop '

              set +e

              export DEBIAN_FRONTEND=noninteractive

              apt-get update -y

              apt-get install -y \
                wget \
                gpg \
                apt-transport-https \
                ca-certificates

              install \
                -d \
                -m 0755 \
                /etc/apt/keyrings

              wget -qO- \
                https://packages.microsoft.com/keys/microsoft.asc \
                | gpg --dearmor \
                > /etc/apt/keyrings/packages.microsoft.gpg

              chmod a+r \
                /etc/apt/keyrings/packages.microsoft.gpg

              echo \
                "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
                > /etc/apt/sources.list.d/vscode.list

              apt-get update -y

              apt-get install -y code

              echo
              echo "VS Code installed."

              code \
                --version \
                2>/dev/null || true

            '

          fi


          # ========================================================
          # OPENCODE
          # ========================================================

          if [ "${{ inputs.install_opencode }}" = "true" ]; then

            echo
            echo "============================================================"
            echo "🤖 OPENCODE"
            echo "============================================================"

            run_in_webtop '

              set +e

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              curl -fsSL \
                https://opencode.ai/install \
                | bash

              if [ -x "$HOME/.local/bin/opencode" ]; then

                ln -sf \
                  "$HOME/.local/bin/opencode" \
                  /usr/local/bin/opencode

              fi

              opencode \
                --version \
                2>/dev/null || true

            '

          fi


          # ========================================================
          # ANTIGRAVITY CLI
          # ========================================================

          if [ "${{ inputs.install_antigravity_cli }}" = "true" ]; then

            echo
            echo "============================================================"
            echo "⌨️ ANTIGRAVITY CLI"
            echo "============================================================"

            run_in_webtop '

              set +e

              curl -fsSL \
                https://antigravity.google/cli/install.sh \
                | bash

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              agy \
                --version \
                2>/dev/null || true

            '

          fi


          # ========================================================
          # ANTIGRAVITY GUI
          # ========================================================

          if [ "${{ inputs.install_antigravity_gui }}" = "true" ]; then

            echo
            echo "============================================================"
            echo "🚀 ANTIGRAVITY GUI"
            echo "============================================================"

            run_in_webtop '

              set +e

              echo "Antigravity GUI installation requested."

              curl -fsSL \
                https://antigravity.google/cli/install.sh \
                | bash

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              echo
              echo "Installed binaries:"

              ls -la \
                "$HOME/.local/bin" \
                2>/dev/null || true

            '

          fi


          echo
          echo "============================================================"
          echo "✅ OPTIONAL INSTALLATION FINISHED"
          echo "============================================================"

          exit 0


      # ============================================================
      # VERIFY APPLICATIONS AS ABC USER
      # ============================================================

      - name: 👤 Verify User Environment
        shell: bash
        continue-on-error: true
        run: |

          set +e

          docker exec \
            --user "$WEBTOP_USER" \
            --env "HOME=$WEBTOP_HOME" \
            "$WEBTOP_CONTAINER" \
            bash -lc '

              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              echo "============================================================"
              echo "USER ENVIRONMENT"
              echo "============================================================"

              echo
              echo "User:"
              whoami

              echo
              echo "UID:"
              id

              echo
              echo "HOME:"
              echo "$HOME"

              echo
              echo "============================================================"
              echo "PYTHON"
              echo "============================================================"

              python3.13 --version 2>/dev/null || true

              echo
              echo "============================================================"
              echo "NODE"
              echo "============================================================"

              node --version 2>/dev/null || true

              echo
              echo "NPM"
              echo "============================================================"

              npm --version 2>/dev/null || true

              echo
              echo "============================================================"
              echo "VS CODE"
              echo "============================================================"

              code --version 2>/dev/null || true

              echo
              echo "============================================================"
              echo "OPENCODE"
              echo "============================================================"

              opencode --version 2>/dev/null || true

              echo
              echo "============================================================"
              echo "ANTIGRAVITY"
              echo "============================================================"

              agy --version 2>/dev/null || true

              echo
              echo "============================================================"
              echo "FIREFOX"
              echo "============================================================"

              firefox --version 2>/dev/null || true

              echo
              echo "============================================================"
              echo "CHROME"
              echo "============================================================"

              google-chrome \
                --version \
                2>/dev/null || true

            '

          echo
          echo "✅ User environment check completed"


      # ============================================================
      # WEBTOP → DOCKER NETWORK TEST
      #
      # This is the critical test for the 502 problem.
      #
      # Cloudflared will NOT use localhost.
      # It will use:
      #
      # https://<container-name>:3001
      # ============================================================

      - name: 🔬 Test Docker Network Origin
        if: ${{ inputs.enable_cloudflare }}
        shell: bash
        run: |

          set -e

          echo "============================================================"
          echo "          CLOUDFLARE → WEBTOP ORIGIN TEST"
          echo "============================================================"

          echo
          echo "Network:"
          echo "$DOCKER_NETWORK"

          echo
          echo "Target:"
          echo "https://${WEBTOP_CONTAINER}:3001"

          echo
          echo "Testing HTTPS from another container..."

          docker run \
            --rm \
            --network "$DOCKER_NETWORK" \
            curlimages/curl:latest \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --max-time 15 \
            "https://${WEBTOP_CONTAINER}:3001/" \
            >/dev/null

          echo
          echo "============================================================"
          echo "✅ DOCKER NETWORK ORIGIN IS REACHABLE"
          echo "============================================================"


      # ============================================================
      # CLOUDFLARE
      #
      # IMPORTANT:
      #
      # DO NOT use:
      #
      # http://127.0.0.1:3001
      #
      # DO NOT use:
      #
      # https://127.0.0.1:3001
      #
      # from inside the Cloudflared container.
      #
      # Correct:
      #
      # https://<webtop-container-name>:3001
      # ============================================================

      - name: ☁️ Start TryCloudflare
        if: ${{ inputs.enable_cloudflare }}
        shell: bash
        run: |

          set -e

          echo "============================================================"
          echo "                  CLOUDFLARE TUNNEL"
          echo "============================================================"

          echo
          echo "Docker Network:"
          echo "$DOCKER_NETWORK"

          echo
          echo "Webtop Container:"
          echo "$WEBTOP_CONTAINER"

          echo
          echo "Origin:"
          echo "https://${WEBTOP_CONTAINER}:3001"

          echo
          echo "Removing previous Cloudflare container..."

          docker rm -f \
            adiban-cloudflared \
            >/dev/null 2>&1 || true

          echo
          echo "Starting Cloudflared..."

          docker run -d \
            --name adiban-cloudflared \
            --network "$DOCKER_NETWORK" \
            --restart unless-stopped \
            cloudflare/cloudflared:latest \
            tunnel \
            --no-autoupdate \
            --no-tls-verify \
            --url "https://${WEBTOP_CONTAINER}:3001"

          echo
          echo "Cloudflare container:"
          docker ps \
            --filter "name=adiban-cloudflared"

          echo
          echo "Waiting for TryCloudflare URL..."

          TUNNEL_URL=""

          for i in $(seq 1 40); do

            echo
            echo "Attempt ${i}/40"

            LOGS="$(
              docker logs \
                adiban-cloudflared \
                2>&1 \
                || true
            )"

            echo "$LOGS" | tail -n 20

            TUNNEL_URL="$(
              echo "$LOGS" \
                | grep -Eo \
                  'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                | tail -n 1 \
                || true
            )"

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 3

          done

          if [ -z "$TUNNEL_URL" ]; then

            echo
            echo "============================================================"
            echo "❌ CLOUDFLARE URL NOT FOUND"
            echo "============================================================"

            echo
            echo "Cloudflare logs:"

            docker logs \
              --tail 250 \
              adiban-cloudflared \
              2>&1 || true

            exit 1

          fi

          echo
          echo "============================================================"
          echo "             🌐 PUBLIC WEBTOP URL"
          echo "============================================================"

          echo
          echo "$TUNNEL_URL"

          echo
          echo "============================================================"

          echo "TUNNEL_URL=$TUNNEL_URL" \
            >> "$GITHUB_ENV"


      # ============================================================
      # CLOUDFLARE ORIGIN DIAGNOSTIC
      # ============================================================

      - name: 🔎 Verify Cloudflare Origin Connectivity
        if: ${{ inputs.enable_cloudflare }}
        shell: bash
        run: |

          set +e

          echo "============================================================"
          echo "             CLOUDFLARE CONNECTIVITY"
          echo "============================================================"

          echo
          echo "Cloudflared container:"
          docker ps \
            --filter "name=adiban-cloudflared"

          echo
          echo "Network membership:"
          docker network inspect \
            "$DOCKER_NETWORK"

          echo
          echo "Cloudflared logs:"
          docker logs \
            --tail 100 \
            adiban-cloudflared \
            2>&1 || true

          echo
          echo "============================================================"


      # ============================================================
      # FINAL STATUS
      # ============================================================

      - name: 📊 Final Status
        if: always()
        shell: bash
        run: |

          echo
          echo "============================================================"
          echo "              ADIBAN CLOUD LINUX"
          echo "                 FINAL STATUS"
          echo "============================================================"

          echo
          echo "Webtop:"
          docker ps \
            -a \
            --filter "name=$WEBTOP_CONTAINER" \
            --format \
            "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo
          echo "Webtop Origin:"
          echo "https://${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}"

          echo
          echo "Docker Network:"
          echo "$DOCKER_NETWORK"

          if [ -n "${TUNNEL_URL:-}" ]; then

            echo
            echo "============================================================"
            echo "🌐 PUBLIC URL"
            echo "============================================================"

            echo
            echo "$TUNNEL_URL"

          fi

          echo
          echo "Session:"
          echo "${SESSION_HOURS} hours"

          echo
          echo "============================================================"


      # ============================================================
      # KEEP ALIVE
      # ============================================================

      - name: ⏳ Keep Alive
        shell: bash
        run: |

          set -e

          HOURS="$SESSION_HOURS"

          if ! [[ "$HOURS" =~ ^[0-9]+([.][0-9]+)?$ ]]; then

            echo "Invalid SESSION_HOURS: $HOURS"

            exit 1

          fi

          SECONDS_TO_WAIT="$(
            awk \
              "BEGIN {print int($HOURS * 3600)}"
          )"

          echo
          echo "============================================================"
          echo "                    KEEP ALIVE"
          echo "============================================================"

          echo
          echo "Duration:"
          echo "${HOURS} hours"

          echo
          echo "Webtop:"
          echo "https://${WEBTOP_HOST}:${WEBTOP_HTTPS_PORT}"

          if [ -n "${TUNNEL_URL:-}" ]; then

            echo
            echo "🌐 Public URL:"
            echo "$TUNNEL_URL"

          fi

          echo
          echo "🟢 ADIBAN Cloud Linux is running."

          START_TIME="$(date +%s)"

          while true; do

            NOW="$(date +%s)"

            ELAPSED=$((NOW - START_TIME))

            if [ "$ELAPSED" -ge "$SECONDS_TO_WAIT" ]; then
              break
            fi

            REMAINING=$((SECONDS_TO_WAIT - ELAPSED))

            HOURS_LEFT=$((REMAINING / 3600))

            MINUTES_LEFT=$(
              (REMAINING % 3600) / 60
            )

            echo \
              "[$(date '+%Y-%m-%d %H:%M:%S')] " \
              "Remaining: ${HOURS_LEFT}h ${MINUTES_LEFT}m"

            sleep 60

          done

          echo
          echo "============================================================"
          echo "⏰ SESSION TIME COMPLETED"
          echo "============================================================"


      # ============================================================
      # DEBUG
      # ============================================================

      - name: 🐛 Debug Information
        if: always()
        shell: bash
        run: |

          echo "============================================================"
          echo "                       DEBUG"
          echo "============================================================"

          echo
          echo "All containers:"
          docker ps -a

          echo
          echo "Docker networks:"
          docker network ls

          echo
          echo "ADIBAN network:"
          docker network inspect \
            "$DOCKER_NETWORK" \
            2>/dev/null || true

          echo
          echo "Webtop inspect:"
          docker inspect \
            "$WEBTOP_CONTAINER" \
            2>/dev/null || true

          echo
          echo "Webtop logs:"
          docker logs \
            --tail 250 \
            "$WEBTOP_CONTAINER" \
            2>/dev/null || true

          if docker ps -a \
            --format '{{.Names}}' \
            | grep -qx "adiban-cloudflared"; then

            echo
            echo "Cloudflared inspect:"
            docker inspect \
              adiban-cloudflared \
              2>/dev/null || true

            echo
            echo "Cloudflared logs:"
            docker logs \
              --tail 250 \
              adiban-cloudflared \
              2>/dev/null || true

          fi


      # ============================================================
      # COLLECT LOGS
      # ============================================================

      - name: 📦 Collect Logs
        if: always()
        shell: bash
        run: |

          mkdir -p \
            "$GITHUB_WORKSPACE/artifacts"

          docker logs \
            "$WEBTOP_CONTAINER" \
            > "$GITHUB_WORKSPACE/artifacts/webtop.log" \
            2>&1 || true

          docker inspect \
            "$WEBTOP_CONTAINER" \
            > "$GITHUB_WORKSPACE/artifacts/webtop-inspect.json" \
            2>&1 || true

          docker ps -a \
            > "$GITHUB_WORKSPACE/artifacts/docker-ps.txt" \
            2>&1 || true

          docker network inspect \
            "$DOCKER_NETWORK" \
            > "$GITHUB_WORKSPACE/artifacts/docker-network.json" \
            2>&1 || true

          if docker ps -a \
            --format '{{.Names}}' \
            | grep -qx "adiban-cloudflared"; then

            docker logs \
              adiban-cloudflared \
              > "$GITHUB_WORKSPACE/artifacts/cloudflared.log" \
              2>&1 || true

            docker inspect \
              adiban-cloudflared \
              > "$GITHUB_WORKSPACE/artifacts/cloudflared-inspect.json" \
              2>&1 || true

          fi

          echo "Artifacts collected."


      # ============================================================
      # UPLOAD DEBUG ARTIFACTS
      # ============================================================

      - name: ⬆️ Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adiban-cloud-linux-debug
          path: artifacts/
          if-no-files-found: ignore


      # ============================================================
      # CLEANUP
      # ============================================================

      - name: 🧹 Cleanup
        if: always()
        shell: bash
        run: |

          set +e

          echo "Cleaning containers..."

          docker rm -f \
            adiban-cloudflared \
            >/dev/null 2>&1 || true

          docker rm -f \
            "$WEBTOP_CONTAINER" \
            >/dev/null 2>&1 || true

          echo
          echo "Removing Docker network..."

          docker network rm \
            "$DOCKER_NETWORK" \
            >/dev/null 2>&1 || true

          echo
          echo "✅ Cleanup completed."
