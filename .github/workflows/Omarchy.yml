name: 🚀 MT5 Cloud Desktop

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: "🖥️ Desktop resolution"
        required: true
        type: choice
        default: "1920x1080"
        options:
          - "1920x1080"
          - "1600x900"
          - "1280x720"

      session_minutes:
        description: "⏱️ Session lifetime (minutes)"
        required: true
        type: choice
        default: "60"
        options:
          - "15"
          - "30"
          - "60"
          - "120"
          - "180"
          - "300"

      clean_default_account:
        description: "🧹 Clean default MT5 account"
        required: true
        type: boolean
        default: true

      enable_tunnel:
        description: "🌐 Enable browser access via TryCloudflare"
        required: true
        type: boolean
        default: true

      keep_artifacts:
        description: "📦 Save MT5 files/logs as artifact"
        required: true
        type: boolean
        default: true

      image:
        description: "🐳 MT5 Docker image"
        required: true
        type: string
        default: "ghcr.io/OWNER/mt5-docker:latest"

concurrency:
  group: mt5-cloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTAINER_NAME: mt5-cloud
  MT5_PORT: "3000"
  MT5_HOST: "127.0.0.1"
  TZ: "UTC"

jobs:
  run-mt5:
    name: 🖥️ Start MetaTrader 5 Cloud Desktop
    runs-on: ubuntu-24.04

    timeout-minutes: 310

    steps:
      # ============================================================
      # 1. Runner diagnostics
      # ============================================================
      - name: 🔍 Runner diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🖥️ RUNNER INFORMATION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "OS         : $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "Kernel     : $(uname -r)"
          echo "Architecture: $(uname -m)"
          echo "CPU        : $(nproc)"
          echo "Memory     : $(free -h | awk '/^Mem:/ {print $2}')"
          echo "Disk       : $(df -h / | awk 'NR==2 {print $4 " free / " $2}')"

          echo
          echo "Docker:"
          docker --version

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: 🧰 Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update -y

          sudo apt-get install -y --no-install-recommends \
            curl \
            jq \
            ca-certificates

      # ============================================================
      # 3. Install cloudflared
      # ============================================================
      - name: ☁️ Install Cloudflare Tunnel
        if: ${{ inputs.enable_tunnel }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v cloudflared >/dev/null 2>&1; then
            echo "✅ cloudflared already installed."
            cloudflared --version
            exit 0
          fi

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          rm -f /tmp/cloudflared.deb

          echo "✅ cloudflared installed."
          cloudflared --version

      # ============================================================
      # 4. Prepare directories
      # ============================================================
      - name: 📁 Prepare MT5 workspace
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/mt5_data" \
            "$GITHUB_WORKSPACE/logs" \
            "$GITHUB_WORKSPACE/tunnel"

          echo "✅ Workspace prepared."

      # ============================================================
      # 5. Session configuration
      # ============================================================
      - name: ⚙️ Show session configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                ⚙️  MT5 SESSION CONFIG                     ║"
          echo "╠════════════════════════════════════════════════════════════╣"
          echo "║                                                            ║"
          printf "║  🐳 Image       : %-39s ║\n" "${{ inputs.image }}"
          printf "║  🖥️ Resolution  : %-39s ║\n" "${{ inputs.resolution }}"
          printf "║  ⏱️ Duration    : %-39s ║\n" "${{ inputs.session_minutes }} minutes"
          printf "║  🧹 Clean acct  : %-39s ║\n" "${{ inputs.clean_default_account }}"
          printf "║  🌐 Web access  : %-39s ║\n" "${{ inputs.enable_tunnel }}"
          printf "║  📦 Artifacts   : %-39s ║\n" "${{ inputs.keep_artifacts }}"
          echo "║                                                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo

      # ============================================================
      # 6. Pull MT5 image
      # ============================================================
      - name: 🐳 Pull MT5 image
        shell: bash
        env:
          MT5_IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail

          echo "📦 Pulling MT5 image..."
          echo "   $MT5_IMAGE"

          docker pull "$MT5_IMAGE"

          echo
          echo "✅ Image ready."

          docker image inspect "$MT5_IMAGE" \
            --format='Image={{.RepoTags}} | ID={{.Id}} | Size={{.Size}}'

      # ============================================================
      # 7. Start MT5
      # ============================================================
      - name: ▶️ Start MetaTrader 5
        shell: bash
        env:
          MT5_IMAGE: ${{ inputs.image }}
          MT5_RESOLUTION: ${{ inputs.resolution }}
          MT5_CLEAN_DEFAULT: ${{ inputs.clean_default_account }}
        run: |
          set -Eeuo pipefail

          CLEAN_VALUE="0"

          if [[ "$MT5_CLEAN_DEFAULT" == "true" ]]; then
            CLEAN_VALUE="1"
          fi

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📈 STARTING METATRADER 5"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          docker run \
            --detach \
            --name "$CONTAINER_NAME" \
            --restart=no \
            --shm-size=2g \
            --tmpfs /tmp:exec \
            --tmpfs /run:exec \
            --env "DISPLAY_RESOLUTION=$MT5_RESOLUTION" \
            --env "MT5_CLEAN_DEFAULT_ACCOUNT=$CLEAN_VALUE" \
            --env "TZ=$TZ" \
            --volume "$GITHUB_WORKSPACE/mt5_data:/config" \
            --publish "$MT5_HOST:$MT5_PORT:3000" \
            "$MT5_IMAGE"

          echo
          echo "✅ MT5 container started."

          docker ps \
            --filter "name=$CONTAINER_NAME" \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}'

      # ============================================================
      # 8. Health check
      # ============================================================
      - name: ❤️ MT5 health check
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "⏳ Waiting for MT5 web interface..."

          READY="false"

          for i in $(seq 1 90); do
            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 3 \
              "http://$MT5_HOST:$MT5_PORT/" \
              >/dev/null 2>&1; then

              READY="true"

              echo
              echo "✅ MT5 web interface is READY."
              break
            fi

            if (( i % 10 == 0 )); then
              echo "⏳ Waiting... ($i/90)"
              docker logs --tail 20 "$CONTAINER_NAME" || true
            fi

            sleep 2
          done

          if [[ "$READY" != "true" ]]; then
            echo
            echo "❌ MT5 failed to start."

            echo
            echo "──── Docker status ────"
            docker ps -a --filter "name=$CONTAINER_NAME" || true

            echo
            echo "──── MT5 logs ────"
            docker logs "$CONTAINER_NAME" || true

            exit 1
          fi

      # ============================================================
      # 9. Start TryCloudflare
      # ============================================================
      - name: 🌐 Start browser access
        if: ${{ inputs.enable_tunnel }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TUNNEL_LOG="$GITHUB_WORKSPACE/tunnel/cloudflared.log"
          TUNNEL_PID="$GITHUB_WORKSPACE/tunnel/cloudflared.pid"
          TUNNEL_URL="$GITHUB_WORKSPACE/tunnel/url.txt"

          : > "$TUNNEL_LOG"

          echo "☁️ Starting TryCloudflare..."
          echo "Target: http://$MT5_HOST:$MT5_PORT"

          nohup \
            cloudflared tunnel \
              --no-autoupdate \
              --url "http://$MT5_HOST:$MT5_PORT" \
              > "$TUNNEL_LOG" 2>&1 &

          PID=$!

          echo "$PID" > "$TUNNEL_PID"

          PUBLIC_URL=""

          echo
          echo "⏳ Waiting for public URL..."

          for i in $(seq 1 60); do

            PUBLIC_URL="$(
              grep -Eo \
                'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                "$TUNNEL_LOG" \
                | head -n 1 \
                || true
            )"

            if [[ -n "$PUBLIC_URL" ]]; then
              break
            fi

            sleep 2
          done

          if [[ -z "$PUBLIC_URL" ]]; then
            echo
            echo "❌ Failed to obtain Cloudflare URL."

            echo
            echo "──── cloudflared log ────"
            cat "$TUNNEL_LOG" || true

            exit 1
          fi

          echo "$PUBLIC_URL" > "$TUNNEL_URL"

          echo
          echo "✅ Public URL obtained:"
          echo "$PUBLIC_URL"

      # ============================================================
      # 10. Runtime information
      # ============================================================
      - name: 📊 Runtime information
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 MT5 RUNTIME"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo
          echo "Container name:"
          docker inspect "$CONTAINER_NAME" \
            --format='{{.Name}}'

          echo
          echo "Container image:"
          docker inspect "$CONTAINER_NAME" \
            --format='{{.Config.Image}}'

          echo
          echo "Container status:"
          docker inspect "$CONTAINER_NAME" \
            --format='{{.State.Status}}'

          echo
          echo "Started at:"
          docker inspect "$CONTAINER_NAME" \
            --format='{{.State.StartedAt}}'

          echo
          echo "Ports:"
          docker port "$CONTAINER_NAME" || true

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Memory:"
          free -h

      # ============================================================
      # 11. Connection panel
      # ============================================================
      - name: 🔐 Display connection information
        shell: bash
        run: |
          set -Eeuo pipefail

          PUBLIC_URL="Not enabled"

          if [[ "${{ inputs.enable_tunnel }}" == "true" ]]; then
            PUBLIC_URL="$(
              cat "$GITHUB_WORKSPACE/tunnel/url.txt" 2>/dev/null \
              || echo "Unavailable"
            )"
          fi

          echo
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                  🚀 MT5 CLOUD DESKTOP                     ║"
          echo "╠════════════════════════════════════════════════════════════╣"
          echo "║                                                            ║"
          echo "║  📈 APPLICATION                                            ║"
          echo "║     MetaTrader 5                                          ║"
          echo "║                                                            ║"
          echo "║  🖥️  RESOLUTION                                            ║"
          printf "║     %-56s║\n" "${{ inputs.resolution }}"
          echo "║                                                            ║"
          echo "║  ⏱️  SESSION                                               ║"
          printf "║     %-56s║\n" "${{ inputs.session_minutes }} minutes"
          echo "║                                                            ║"
          echo "║  🔐 LOCAL ACCESS                                            ║"
          echo "║     http://127.0.0.1:3000                                 ║"
          echo "║                                                            ║"
          echo "║  🌐 BROWSER ACCESS                                          ║"
          printf "║     %-56s║\n" "$PUBLIC_URL"
          echo "║                                                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo

          {
            echo "# 🚀 MT5 Cloud Desktop"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| 📈 Application | MetaTrader 5 |"
            echo "| 🖥️ Resolution | \`${{ inputs.resolution }}\` |"
            echo "| ⏱️ Session | \`${{ inputs.session_minutes }} minutes\` |"
            echo "| 📦 Container | \`$CONTAINER_NAME\` |"
            echo "| 🔐 Local | \`http://127.0.0.1:3000\` |"
            echo "| 🌐 Browser | $PUBLIC_URL |"
            echo
            echo "> ⚠️ TryCloudflare Quick Tunnel is intended for testing/development."
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 12. Keep session alive
      # ============================================================
      - name: ⏳ Keep MT5 session alive
        shell: bash
        run: |
          set -Eeuo pipefail

          TOTAL_SECONDS=$(( ${{ inputs.session_minutes }} * 60 ))
          END_TIME=$(( $(date +%s) + TOTAL_SECONDS ))

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🟢 MT5 SESSION ACTIVE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          while true; do
            NOW=$(date +%s)
            REMAINING=$(( END_TIME - NOW ))

            if (( REMAINING <= 0 )); then
              break
            fi

            MINUTES=$(( REMAINING / 60 ))
            SECONDS=$(( REMAINING % 60 ))

            echo "[$(date -u '+%H:%M:%S UTC')] ⏱️ Remaining: ${MINUTES}m ${SECONDS}s"

            sleep 30
          done

          echo
          echo "⌛ Session duration completed."

      # ============================================================
      # 13. Collect diagnostics
      # ============================================================
      - name: 🧾 Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$GITHUB_WORKSPACE/logs"

          docker ps -a \
            > "$GITHUB_WORKSPACE/logs/docker-ps.txt" 2>&1

          docker inspect "$CONTAINER_NAME" \
            > "$GITHUB_WORKSPACE/logs/container-inspect.json" 2>&1

          docker logs "$CONTAINER_NAME" \
            > "$GITHUB_WORKSPACE/logs/mt5-container.log" 2>&1

          docker stats "$CONTAINER_NAME" \
            --no-stream \
            > "$GITHUB_WORKSPACE/logs/docker-stats.txt" 2>&1

          if [[ -f "$GITHUB_WORKSPACE/tunnel/cloudflared.log" ]]; then
            cp \
              "$GITHUB_WORKSPACE/tunnel/cloudflared.log" \
              "$GITHUB_WORKSPACE/logs/cloudflared.log"
          fi

          echo "✅ Diagnostics collected."

      # ============================================================
      # 14. Upload artifacts
      # ============================================================
      - name: 📦 Upload MT5 artifacts
        if: ${{ always() && inputs.keep_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: mt5-cloud-${{ github.run_id }}
          path: |
            mt5_data/
            logs/
            tunnel/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6

      # ============================================================
      # 15. Cleanup
      # ============================================================
      - name: 🧹 Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧹 CLEANUP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [[ -f "$GITHUB_WORKSPACE/tunnel/cloudflared.pid" ]]; then

            PID="$(cat "$GITHUB_WORKSPACE/tunnel/cloudflared.pid")"

            if kill -0 "$PID" 2>/dev/null; then
              echo "Stopping cloudflared..."
              kill "$PID" 2>/dev/null || true
            fi
          fi

          if docker ps -q \
            --filter "name=^${CONTAINER_NAME}$" \
            | grep -q .; then

            echo "Stopping MT5 container..."
            docker stop -t 10 "$CONTAINER_NAME" || true
          fi

          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          echo
          echo "✅ Cleanup complete."

      # ============================================================
      # 16. Final summary
      # ============================================================
      - name: ✅ Final summary
        if: always()
        shell: bash
        run: |
          set +e

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 FINAL SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo
          echo "Workflow   : $GITHUB_WORKFLOW"
          echo "Run ID     : $GITHUB_RUN_ID"
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Runner     : $RUNNER_NAME"
          echo "Resolution : ${{ inputs.resolution }}"
          echo "Session    : ${{ inputs.session_minutes }} minutes"
          echo "Tunnel     : ${{ inputs.enable_tunnel }}"
          echo "Artifacts  : ${{ inputs.keep_artifacts }}"
          echo
          echo "✅ MT5 session completed."
          echo "✅ Runtime resources cleaned up."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
