name: "🚀 MT5 Cloud Desktop"

run-name: "MT5 Cloud Desktop • ${{ inputs.session_minutes }} min • ${{ inputs.resolution }}"

on:
  workflow_dispatch:
    inputs:

      resolution:
        description: "🖥️ Desktop Resolution"
        required: true
        type: choice
        default: "1920x1080"
        options:
          - "1920x1080"
          - "1600x900"
          - "1280x720"

      session_minutes:
        description: "⏱️ Session Duration"
        required: true
        type: choice
        default: "60"
        options:
          - "15"
          - "30"
          - "60"
          - "120"
          - "180"
          - "300"

      enable_tunnel:
        description: "🌐 Enable Public Cloudflare URL"
        required: true
        type: boolean
        default: true

      save_artifacts:
        description: "📦 Save diagnostics/logs as Artifact"
        required: true
        type: boolean
        default: true

      clean_workspace:
        description: "🧹 Remove previous MT5 runtime data before start"
        required: true
        type: boolean
        default: false


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:

  # ----------------------------------------------------------
  # Container
  # ----------------------------------------------------------

  CONTAINER_NAME: "mt5-cloud"

  MT5_IMAGE: "gmag11/metatrader5_vnc:latest"

  MT5_WEB_PORT: "3000"
  MT5_API_PORT: "8001"

  MT5_WEB_BIND: "127.0.0.1"
  MT5_API_BIND: "127.0.0.1"

  TZ: "UTC"


  # ----------------------------------------------------------
  # TEST LOGIN
  #
  # WARNING:
  # These credentials are intentionally visible because you
  # requested them to be inside the YAML and printed in logs.
  #
  # DO NOT use a real broker password here.
  # ----------------------------------------------------------

  MT5_WEB_USER: "trader"
  MT5_WEB_PASSWORD: "MT5-Demo-2026-StrongPassword!"


  # ----------------------------------------------------------
  # Cloudflare
  # ----------------------------------------------------------

  CLOUDFLARE_LOG: "${{ github.workspace }}/tunnel/cloudflared.log"


  # ----------------------------------------------------------
  # GitHub Actions
  #
  # Force JavaScript Actions to use Node 24 where supported.
  # ----------------------------------------------------------

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: mt5-cloud-desktop
  cancel-in-progress: false


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# JOB
# ============================================================

jobs:

  mt5-cloud-desktop:

    name: "🖥️ MT5 Cloud Desktop"

    runs-on: ubuntu-24.04

    timeout-minutes: 360


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ------------------------------------------------------
      # 1. RUNNER DIAGNOSTICS
      # ------------------------------------------------------

      - name: "🔍 Runner Diagnostics"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "RUNNER INFORMATION"
          echo "=============================================="

          echo "OS:"
          cat /etc/os-release || true

          echo
          echo "Kernel:"
          uname -a || true

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h || true

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Docker:"
          docker version

          echo
          echo "Docker Storage:"
          docker info --format \
            'Driver={{.Driver}} | DockerRootDir={{.DockerRootDir}}' \
            || true

          echo
          echo "=============================================="


      # ------------------------------------------------------
      # 2. VALIDATE ARCHITECTURE
      # ------------------------------------------------------

      - name: "🧬 Verify AMD64"
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCH="$(uname -m)"

          echo "Detected architecture: ${ARCH}"

          if [[ "${ARCH}" != "x86_64" ]]; then
            echo "❌ MT5 Docker image requires AMD64/x86_64."
            exit 1
          fi

          echo "✅ AMD64 runner confirmed."


      # ------------------------------------------------------
      # 3. VALIDATE CONFIGURATION
      #
      # IMPORTANT:
      # This happens BEFORE downloading the 4.8GB image.
      # ------------------------------------------------------

      - name: "🔐 Validate Configuration"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "MT5 CONFIGURATION"
          echo "=============================================="

          echo "Container:"
          echo "${CONTAINER_NAME}"

          echo
          echo "Image:"
          echo "${MT5_IMAGE}"

          echo
          echo "Resolution:"
          echo "${{ inputs.resolution }}"

          echo
          echo "Session:"
          echo "${{ inputs.session_minutes }} minutes"

          echo
          echo "Web User:"
          echo "${MT5_WEB_USER}"

          echo
          echo "Web Password:"
          echo "${MT5_WEB_PASSWORD}"

          echo
          echo "Public Tunnel:"
          echo "${{ inputs.enable_tunnel }}"

          echo
          echo "Save Artifacts:"
          echo "${{ inputs.save_artifacts }}"

          echo
          echo "Clean Workspace:"
          echo "${{ inputs.clean_workspace }}"

          echo
          echo "=============================================="

          if [[ -z "${MT5_WEB_USER}" ]]; then
            echo "❌ MT5_WEB_USER is empty."
            exit 1
          fi

          if [[ -z "${MT5_WEB_PASSWORD}" ]]; then
            echo "❌ MT5_WEB_PASSWORD is empty."
            exit 1
          fi

          if [[ "${#MT5_WEB_PASSWORD}" -lt 8 ]]; then
            echo "❌ Password must be at least 8 characters."
            exit 1
          fi

          echo
          echo "✅ Configuration validated."


      # ------------------------------------------------------
      # 4. INSTALL DEPENDENCIES
      # ------------------------------------------------------

      - name: "📦 Install Dependencies"
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ca-certificates \
            jq \
            netcat-openbsd \
            unzip \
            procps

          echo
          echo "Installed versions:"
          curl --version | head -n 1
          jq --version
          nc -h 2>&1 | head -n 1 || true


      # ------------------------------------------------------
      # 5. INSTALL CLOUDFLARED
      # ------------------------------------------------------

      - name: "🌐 Install Cloudflared"
        if: ${{ inputs.enable_tunnel }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Installing Cloudflare Tunnel client..."

          CLOUDFLARED_VERSION="$(
            curl -fsSL \
              https://api.github.com/repos/cloudflare/cloudflared/releases/latest \
              | jq -r '.tag_name'
          )"

          echo "Latest cloudflared release: ${CLOUDFLARED_VERSION}"

          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb" \
            -o /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          rm -f /tmp/cloudflared.deb

          echo
          echo "Cloudflared version:"
          cloudflared --version


      # ------------------------------------------------------
      # 6. PREPARE DIRECTORIES
      # ------------------------------------------------------

      - name: "📁 Prepare Runtime Directories"
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p \
            "${GITHUB_WORKSPACE}/mt5_data" \
            "${GITHUB_WORKSPACE}/logs" \
            "${GITHUB_WORKSPACE}/tunnel"

          chmod 700 \
            "${GITHUB_WORKSPACE}/mt5_data" \
            "${GITHUB_WORKSPACE}/logs" \
            "${GITHUB_WORKSPACE}/tunnel"

          echo "Workspace:"
          echo "${GITHUB_WORKSPACE}"

          echo
          echo "Directories:"
          ls -la "${GITHUB_WORKSPACE}"


      # ------------------------------------------------------
      # 7. OPTIONAL CLEAN
      # ------------------------------------------------------

      - name: "🧹 Clean Previous MT5 Workspace"
        if: ${{ inputs.clean_workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Cleaning previous MT5 runtime data..."

          rm -rf \
            "${GITHUB_WORKSPACE}/mt5_data" \
            "${GITHUB_WORKSPACE}/logs" \
            "${GITHUB_WORKSPACE}/tunnel"

          mkdir -p \
            "${GITHUB_WORKSPACE}/mt5_data" \
            "${GITHUB_WORKSPACE}/logs" \
            "${GITHUB_WORKSPACE}/tunnel"

          chmod 700 \
            "${GITHUB_WORKSPACE}/mt5_data" \
            "${GITHUB_WORKSPACE}/logs" \
            "${GITHUB_WORKSPACE}/tunnel"

          echo "✅ Workspace cleaned."


      # ------------------------------------------------------
      # 8. PULL MT5 IMAGE
      # ------------------------------------------------------

      - name: "🐳 Pull MetaTrader 5 Image"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "PULLING MT5 IMAGE"
          echo "=============================================="

          echo "Image:"
          echo "${MT5_IMAGE}"

          echo

          docker pull "${MT5_IMAGE}"

          echo
          echo "=============================================="
          echo "IMAGE INFORMATION"
          echo "=============================================="

          docker image inspect "${MT5_IMAGE}" \
            --format 'ID={{.Id}}'

          docker image inspect "${MT5_IMAGE}" \
            --format 'Created={{.Created}}'

          docker image inspect "${MT5_IMAGE}" \
            --format 'Architecture={{.Architecture}}'

          docker image inspect "${MT5_IMAGE}" \
            --format 'OS={{.Os}}'

          docker image inspect "${MT5_IMAGE}" \
            --format 'Size={{.Size}} bytes'

          echo
          docker images "${MT5_IMAGE}"


      # ------------------------------------------------------
      # 9. START MT5 CONTAINER
      # ------------------------------------------------------

      - name: "🚀 Start MetaTrader 5"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "STARTING METATRADER 5"
          echo "=============================================="

          # Remove stale container if it exists.
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

          docker run \
            --detach \
            --name "${CONTAINER_NAME}" \
            --init \
            --restart=no \
            --shm-size=2g \
            --stop-timeout=15 \
            \
            --label "project=mt5-cloud-desktop" \
            --label "managed-by=github-actions" \
            --label "run-id=${GITHUB_RUN_ID}" \
            \
            --env "CUSTOM_USER=${MT5_WEB_USER}" \
            --env "PASSWORD=${MT5_WEB_PASSWORD}" \
            --env "DISPLAY_RESOLUTION=${{ inputs.resolution }}" \
            --env "TZ=${TZ}" \
            \
            --volume "${GITHUB_WORKSPACE}/mt5_data:/config" \
            \
            --publish "${MT5_WEB_BIND}:${MT5_WEB_PORT}:3000" \
            --publish "${MT5_API_BIND}:${MT5_API_PORT}:8001" \
            \
            "${MT5_IMAGE}"

          echo
          echo "Container started."

          echo
          echo "Container ID:"
          docker inspect \
            --format '{{.Id}}' \
            "${CONTAINER_NAME}"

          echo
          echo "Container status:"
          docker inspect \
            --format '{{.State.Status}}' \
            "${CONTAINER_NAME}"


      # ------------------------------------------------------
      # 10. WAIT FOR MT5 WEB PORT
      # ------------------------------------------------------

      - name: "⏳ Wait for MT5 Desktop"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Waiting for KasmVNC / MT5 web service..."

          MAX_ATTEMPTS=180
          ATTEMPT=0

          while (( ATTEMPT < MAX_ATTEMPTS )); do

            ATTEMPT=$((ATTEMPT + 1))

            if nc -z \
              "${MT5_WEB_BIND}" \
              "${MT5_WEB_PORT}" \
              >/dev/null 2>&1; then

              echo
              echo "✅ MT5 web port is listening."
              break
            fi

            if ! docker inspect \
              --format '{{.State.Running}}' \
              "${CONTAINER_NAME}" \
              2>/dev/null | grep -q "true"; then

              echo
              echo "❌ MT5 container stopped unexpectedly."

              echo
              echo "Container state:"
              docker inspect "${CONTAINER_NAME}" || true

              echo
              echo "Container logs:"
              docker logs "${CONTAINER_NAME}" 2>&1 || true

              exit 1
            fi

            if (( ATTEMPT % 15 == 0 )); then
              echo
              echo "Still waiting..."
              echo "Attempt: ${ATTEMPT}/${MAX_ATTEMPTS}"

              echo
              echo "Recent logs:"
              docker logs \
                --tail 40 \
                "${CONTAINER_NAME}" \
                2>&1 || true
            fi

            sleep 2

          done

          if ! nc -z \
            "${MT5_WEB_BIND}" \
            "${MT5_WEB_PORT}" \
            >/dev/null 2>&1; then

            echo "❌ MT5 web service did not start."

            docker logs \
              --tail 200 \
              "${CONTAINER_NAME}" \
              2>&1 || true

            exit 1
          fi

          echo "✅ MT5 desktop is ready."


      # ------------------------------------------------------
      # 11. VERIFY MT5 API / RPyC
      # ------------------------------------------------------

      - name: "🐍 Verify MT5 Python API"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking MT5 Python/RPyC service..."

          if nc -z \
            "${MT5_API_BIND}" \
            "${MT5_API_PORT}" \
            >/dev/null 2>&1; then

            echo "✅ MT5 API port ${MT5_API_PORT} is listening."

          else

            echo "⚠️ MT5 API port ${MT5_API_PORT} is not listening yet."

            echo
            echo "Recent MT5 logs:"
            docker logs \
              --tail 100 \
              "${CONTAINER_NAME}" \
              2>&1 || true

            echo
            echo "Continuing because the web desktop itself is available."

          fi


      # ------------------------------------------------------
      # 12. LOCAL WEB TEST
      # ------------------------------------------------------

      - name: "🌐 Verify Local Web Interface"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Testing local MT5 web interface..."

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 10 \
              "http://${MT5_WEB_BIND}:${MT5_WEB_PORT}/" \
              || true
          )"

          echo "HTTP status: ${HTTP_CODE}"

          case "${HTTP_CODE}" in
            2*|3*|401|403)
              echo "✅ Web interface is responding."
              ;;
            *)
              echo "⚠️ Unexpected HTTP status."
              ;;
          esac


      # ------------------------------------------------------
      # 13. START CLOUDFLARE QUICK TUNNEL
      # ------------------------------------------------------

      - name: "☁️ Start Cloudflare Tunnel"
        if: ${{ inputs.enable_tunnel }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "${CLOUDFLARE_LOG}"

          echo "Starting Cloudflare Quick Tunnel..."

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url "http://${MT5_WEB_BIND}:${MT5_WEB_PORT}" \
            > "${CLOUDFLARE_LOG}" 2>&1 &

          CLOUDFLARED_PID=$!

          echo "${CLOUDFLARED_PID}" \
            > "${GITHUB_WORKSPACE}/tunnel/cloudflared.pid"

          echo "Cloudflared PID: ${CLOUDFLARED_PID}"

          echo
          echo "Waiting for public URL..."

          TUNNEL_URL=""

          for i in $(seq 1 60); do

            if [[ -f "${CLOUDFLARE_LOG}" ]]; then

              TUNNEL_URL="$(
                grep -Eo \
                  'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                  "${CLOUDFLARE_LOG}" \
                  | head -n 1 \
                  || true
              )"

            fi

            if [[ -n "${TUNNEL_URL}" ]]; then
              break
            fi

            if ! kill -0 "${CLOUDFLARED_PID}" 2>/dev/null; then
              echo "❌ Cloudflared process exited unexpectedly."

              cat "${CLOUDFLARE_LOG}" || true

              exit 1
            fi

            sleep 2

          done

          if [[ -z "${TUNNEL_URL}" ]]; then

            echo "❌ Could not detect Cloudflare public URL."

            echo
            echo "Cloudflared log:"
            cat "${CLOUDFLARE_LOG}" || true

            exit 1
          fi

          echo "${TUNNEL_URL}" \
            > "${GITHUB_WORKSPACE}/tunnel/tunnel_url.txt"

          echo
          echo "=============================================="
          echo "🌐 PUBLIC MT5 URL"
          echo "=============================================="

          echo "${TUNNEL_URL}"

          echo
          echo "Cloudflared PID:"
          echo "${CLOUDFLARED_PID}"

          echo
          echo "=============================================="


      # ------------------------------------------------------
      # 14. VERIFY PUBLIC URL
      # ------------------------------------------------------

      - name: "🔗 Verify Public Tunnel"
        if: ${{ inputs.enable_tunnel }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TUNNEL_URL="$(
            cat "${GITHUB_WORKSPACE}/tunnel/tunnel_url.txt"
          )"

          echo "Public URL:"
          echo "${TUNNEL_URL}"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 20 \
              "${TUNNEL_URL}/" \
              || true
          )"

          echo
          echo "Public HTTP status:"
          echo "${HTTP_CODE}"

          case "${HTTP_CODE}" in
            2*|3*|401|403)
              echo "✅ Public tunnel is reachable."
              ;;
            *)
              echo "⚠️ Tunnel exists but returned unexpected status."
              ;;
          esac


      # ------------------------------------------------------
      # 15. CONNECTION INFORMATION
      # ------------------------------------------------------

      - name: "📋 Connection Information"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=================================================="
          echo "           🚀 MT5 CLOUD DESKTOP"
          echo "=================================================="

          echo
          echo "🖥️ Resolution:"
          echo "${{ inputs.resolution }}"

          echo
          echo "⏱️ Session:"
          echo "${{ inputs.session_minutes }} minutes"

          echo
          echo "👤 Username:"
          echo "${MT5_WEB_USER}"

          echo
          echo "🔑 Password:"
          echo "${MT5_WEB_PASSWORD}"

          echo
          echo "🏠 Local Desktop:"
          echo "http://127.0.0.1:${MT5_WEB_PORT}"

          echo
          echo "🐍 MT5 Python/RPyC:"
          echo "127.0.0.1:${MT5_API_PORT}"

          if [[ "${{ inputs.enable_tunnel }}" == "true" ]] \
            && [[ -f "${GITHUB_WORKSPACE}/tunnel/tunnel_url.txt" ]]; then

            TUNNEL_URL="$(
              cat "${GITHUB_WORKSPACE}/tunnel/tunnel_url.txt"
            )

            echo
            echo "🌐 PUBLIC DESKTOP:"
            echo "${TUNNEL_URL}"

          fi

          echo
          echo "=================================================="
          echo


      # ------------------------------------------------------
      # 16. GITHUB STEP SUMMARY
      # ------------------------------------------------------

      - name: "📝 Write GitHub Summary"
        shell: bash
        run: |
          set -Eeuo pipefail

          {

            echo "# 🚀 MT5 Cloud Desktop"
            echo

            echo "## Session"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Resolution | \`${{ inputs.resolution }}\` |"
            echo "| Duration | \`${{ inputs.session_minutes }} minutes\` |"
            echo "| Image | \`${MT5_IMAGE}\` |"
            echo "| Username | \`${MT5_WEB_USER}\` |"
            echo "| Password | \`${MT5_WEB_PASSWORD}\` |"
            echo

            echo "## Connection"
            echo

            echo "**Local Desktop**"
            echo
            echo "\`http://127.0.0.1:${MT5_WEB_PORT}\`"
            echo

            echo "**MT5 Python/RPyC**"
            echo
            echo "\`127.0.0.1:${MT5_API_PORT}\`"
            echo

            if [[ "${{ inputs.enable_tunnel }}" == "true" ]] \
              && [[ -f "${GITHUB_WORKSPACE}/tunnel/tunnel_url.txt" ]]; then

              TUNNEL_URL="$(
                cat "${GITHUB_WORKSPACE}/tunnel/tunnel_url.txt"
              )

              echo "**Public Desktop**"
              echo
              echo "[🌐 Open MT5 Cloud Desktop](${TUNNEL_URL})"
              echo

            fi

            echo "## Architecture"
            echo
            echo "\`Browser → Cloudflare Tunnel → KasmVNC → Linux → Wine → MetaTrader 5\`"
            echo

            echo "## Container"
            echo
            echo "\`gmag11/metatrader5_vnc\`"
            echo

            echo "## Security"
            echo
            echo "- MT5 Web UI: exposed through Cloudflare only when tunnel is enabled."
            echo "- MT5 Python/RPyC port 8001: bound to localhost only."
            echo "- Docker container uses an ephemeral GitHub-hosted runner."
            echo

          } >> "${GITHUB_STEP_SUMMARY}"


      # ------------------------------------------------------
      # 17. SESSION MONITOR
      # ------------------------------------------------------

      - name: "⏱️ Monitor MT5 Session"
        shell: bash
        run: |
          set -Eeuo pipefail

          SESSION_SECONDS=$(( ${{ inputs.session_minutes }} * 60 ))

          START_TIME="$(date +%s)"
          END_TIME=$(( START_TIME + SESSION_SECONDS ))

          echo
          echo "=============================================="
          echo "SESSION MONITOR"
          echo "=============================================="

          echo "Duration:"
          echo "${{ inputs.session_minutes }} minutes"

          echo
          echo "Container:"
          echo "${CONTAINER_NAME}"

          echo

          while true; do

            NOW="$(date +%s)"

            if (( NOW >= END_TIME )); then
              echo "⏰ Session duration reached."
              break
            fi

            if ! docker inspect \
              --format '{{.State.Running}}' \
              "${CONTAINER_NAME}" \
              2>/dev/null | grep -q "true"; then

              echo "❌ MT5 container stopped unexpectedly."

              echo
              echo "Recent logs:"
              docker logs \
                --tail 100 \
                "${CONTAINER_NAME}" \
                2>&1 || true

              exit 1
            fi

            REMAINING=$(( END_TIME - NOW ))

            MINUTES=$(( REMAINING / 60 ))
            SECONDS=$(( REMAINING % 60 ))

            echo \
              "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Remaining: ${MINUTES}m ${SECONDS}s"

            sleep 30

          done

          echo
          echo "✅ MT5 session completed normally."


      # ------------------------------------------------------
      # 18. COLLECT DIAGNOSTICS
      # ALWAYS RUN
      # ------------------------------------------------------

      - name: "🧪 Collect Diagnostics"
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          LOG_DIR="${GITHUB_WORKSPACE}/logs"

          mkdir -p "${LOG_DIR}"

          echo "Collecting diagnostics..."

          echo "==============================================" \
            > "${LOG_DIR}/system.txt"

          echo "DATE" \
            >> "${LOG_DIR}/system.txt"

          date -u \
            >> "${LOG_DIR}/system.txt"

          echo \
            >> "${LOG_DIR}/system.txt"

          echo "OS" \
            >> "${LOG_DIR}/system.txt"

          cat /etc/os-release \
            >> "${LOG_DIR}/system.txt" \
            2>&1

          echo \
            >> "${LOG_DIR}/system.txt"

          echo "KERNEL" \
            >> "${LOG_DIR}/system.txt"

          uname -a \
            >> "${LOG_DIR}/system.txt" \
            2>&1

          echo \
            >> "${LOG_DIR}/system.txt"

          echo "MEMORY" \
            >> "${LOG_DIR}/system.txt"

          free -h \
            >> "${LOG_DIR}/system.txt" \
            2>&1

          echo \
            >> "${LOG_DIR}/system.txt"

          echo "DISK" \
            >> "${LOG_DIR}/system.txt"

          df -h \
            >> "${LOG_DIR}/system.txt" \
            2>&1


          echo "==============================================" \
            > "${LOG_DIR}/docker-ps.txt"

          docker ps -a \
            >> "${LOG_DIR}/docker-ps.txt" \
            2>&1


          echo "==============================================" \
            > "${LOG_DIR}/docker-images.txt"

          docker images \
            >> "${LOG_DIR}/docker-images.txt" \
            2>&1


          if docker inspect "${CONTAINER_NAME}" \
            > "${LOG_DIR}/container-inspect.json" \
            2>&1; then
            true
          fi


          docker logs \
            --timestamps \
            "${CONTAINER_NAME}" \
            > "${LOG_DIR}/mt5-container.log" \
            2>&1


          docker stats \
            --no-stream \
            "${CONTAINER_NAME}" \
            > "${LOG_DIR}/docker-stats.txt" \
            2>&1


          if [[ -f "${CLOUDFLARE_LOG}" ]]; then
            cp \
              "${CLOUDFLARE_LOG}" \
              "${LOG_DIR}/cloudflared.log"
          fi


          if [[ -f "${GITHUB_WORKSPACE}/tunnel/tunnel_url.txt" ]]; then
            cp \
              "${GITHUB_WORKSPACE}/tunnel/tunnel_url.txt" \
              "${LOG_DIR}/tunnel_url.txt"
          fi


          echo
          echo "Diagnostics collected:"
          find "${LOG_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            2>/dev/null || true


      # ------------------------------------------------------
      # 19. UPLOAD DIAGNOSTICS
      # ------------------------------------------------------

      - name: "📦 Upload Diagnostics"
        if: ${{ always() && inputs.save_artifacts }}
        uses: actions/upload-artifact@v5
        with:
          name: "mt5-cloud-diagnostics-${{ github.run_number }}"
          path: |
            ${{ github.workspace }}/logs/**
            ${{ github.workspace }}/tunnel/**
          if-no-files-found: warn
          retention-days: 7


      # ------------------------------------------------------
      # 20. STOP CLOUDFLARED
      # ALWAYS RUN
      # ------------------------------------------------------

      - name: "🛑 Stop Cloudflare Tunnel"
        if: ${{ always() && inputs.enable_tunnel }}
        shell: bash
        run: |
          set +e

          if [[ -f "${GITHUB_WORKSPACE}/tunnel/cloudflared.pid" ]]; then

            PID="$(
              cat "${GITHUB_WORKSPACE}/tunnel/cloudflared.pid"
            )"

            echo "Stopping cloudflared PID: ${PID}"

            kill "${PID}" 2>/dev/null || true

            sleep 2

            kill -9 "${PID}" 2>/dev/null || true

          fi

          pkill -f "cloudflared tunnel" 2>/dev/null || true

          echo "Cloudflare tunnel stopped."


      # ------------------------------------------------------
      # 21. STOP MT5
      # ALWAYS RUN
      # ------------------------------------------------------

      - name: "🛑 Stop MetaTrader 5"
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          echo "Stopping MT5 container..."

          if docker ps -a \
            --format '{{.Names}}' \
            | grep -qx "${CONTAINER_NAME}"; then

            docker stop \
              --time 15 \
              "${CONTAINER_NAME}" \
              2>/dev/null || true

            docker rm \
              "${CONTAINER_NAME}" \
              2>/dev/null || true

          fi

          echo "MT5 container cleanup completed."


      # ------------------------------------------------------
      # 22. FINAL DOCKER CLEANUP
      # ------------------------------------------------------

      - name: "🧹 Docker Cleanup"
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          echo "Removing dangling Docker resources..."

          docker container prune \
            -f \
            2>/dev/null || true

          docker network prune \
            -f \
            2>/dev/null || true

          echo
          echo "Final Docker state:"

          docker ps -a \
            2>/dev/null || true

          echo
          echo "Disk usage:"

          df -h / \
            2>/dev/null || true


      # ------------------------------------------------------
      # 23. FINAL STATUS
      # ------------------------------------------------------

      - name: "🏁 Final Status"
        if: ${{ always() }}
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "              MT5 CLOUD DESKTOP"
          echo "=================================================="

          echo
          echo "Workflow:"
          echo "${{ github.workflow }}"

          echo
          echo "Run:"
          echo "${{ github.run_number }}"

          echo
          echo "Status:"
          echo "${{ job.status }}"

          echo
          echo "=================================================="

          if [[ "${{ job.status }}" == "success" ]]; then
            echo
            echo "✅ MT5 Cloud Desktop completed successfully."
          else
            echo
            echo "⚠️ MT5 Cloud Desktop finished with status: ${{ job.status }}"
          fi

          echo
          echo "=================================================="
