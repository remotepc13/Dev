name: Windows Cloud Desktop - Apache Guacamole

on:
  workflow_dispatch:
    inputs:

      install_chrome:
        description: "Install Google Chrome"
        required: false
        type: boolean
        default: true

      install_vscode:
        description: "Install VS Code"
        required: false
        type: boolean
        default: true

      install_python:
        description: "Install Python"
        required: false
        type: boolean
        default: true

      session_time:
        description: "Keep alive minutes"
        required: false
        default: "120"


jobs:

  windows-desktop:

    name: Windows GUI Desktop

    runs-on: windows-2025


    steps:

    - name: System Information
      shell: powershell
      run: |
        Write-Host "================================"
        Write-Host " Windows Cloud Desktop"
        Write-Host "================================"

        systeminfo


    # -----------------------------
    # Install Applications
    # -----------------------------

    - name: Install Chrome
      if: ${{ inputs.install_chrome }}
      shell: powershell
      run: |

        winget install `
        Google.Chrome `
        --silent `
        --accept-package-agreements `
        --accept-source-agreements



    - name: Install VS Code
      if: ${{ inputs.install_vscode }}
      shell: powershell
      run: |

        winget install `
        Microsoft.VisualStudioCode `
        --silent `
        --accept-package-agreements `
        --accept-source-agreements



    - name: Install Python
      if: ${{ inputs.install_python }}
      shell: powershell
      run: |

        winget install `
        Python.Python.3.12 `
        --silent `
        --accept-package-agreements `
        --accept-source-agreements



    # -----------------------------
    # Enable RDP
    # -----------------------------

    - name: Enable Remote Desktop
      shell: powershell
      run: |

        Set-ItemProperty `
        -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
        -Name "fDenyTSConnections" `
        -Value 0


        Enable-NetFirewallRule `
        -DisplayGroup "Remote Desktop"



    # -----------------------------
    # Install Docker
    # For Guacamole
    # -----------------------------

    - name: Install Docker Desktop
      shell: powershell
      run: |

        winget install `
        Docker.DockerDesktop `
        --silent `
        --accept-package-agreements `
        --accept-source-agreements



    # -----------------------------
    # Start Guacamole Stack
    # -----------------------------

    - name: Create Guacamole Docker Compose
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path guacamole | Out-Null
        Set-Location guacamole

        $compose = @(
          'services:'
          '  guacd:'
          '    image: guacamole/guacd:1.6.0'
          '    container_name: guacd'
          '    restart: unless-stopped'
          ''
          '  postgres:'
          '    image: postgres:16'
          '    container_name: guacamole-postgres'
          '    restart: unless-stopped'
          '    environment:'
          '      POSTGRES_DB: guacamole'
          '      POSTGRES_USER: guacamole'
          '      POSTGRES_PASSWORD: guacpassword'
          '    volumes:'
          '      - guacamole_db:/var/lib/postgresql/data'
          ''
          '  guacamole:'
          '    image: guacamole/guacamole:1.6.0'
          '    container_name: guacamole'
          '    restart: unless-stopped'
          '    depends_on:'
          '      - guacd'
          '      - postgres'
          '    ports:'
          '      - "8080:8080"'
          '    environment:'
          '      GUACD_HOSTNAME: guacd'
          '      POSTGRESQL_HOSTNAME: postgres'
          '      POSTGRESQL_DATABASE: guacamole'
          '      POSTGRESQL_USER: guacamole'
          '      POSTGRESQL_PASSWORD: guacpassword'
          ''
          'volumes:'
          '  guacamole_db:'
        )

        $compose | Set-Content -Path docker-compose.yml -Encoding UTF8

        Write-Host "Created:"
        Get-Content docker-compose.yml

    # -----------------------------
    # Start Services
    # -----------------------------

    - name: Start Guacamole

      shell: powershell
      run: |

        cd guacamole

        docker compose up -d



    # -----------------------------
    # Show Info
    # -----------------------------

    - name: Desktop Information

      shell: powershell
      run: |

        Write-Host ""
        Write-Host "================================"
        Write-Host "Guacamole:"
        Write-Host "http://localhost:8080/guacamole"
        Write-Host ""
        Write-Host "Windows RDP:"
        Write-Host "localhost:3389"
        Write-Host "================================"



    # -----------------------------
    # Keep Alive
    # -----------------------------

    - name: Keep Session Alive

      shell: powershell
      run: |

        $minutes = "${{ inputs.session_time }}"

        Write-Host "Keeping alive for $minutes minutes"

        Start-Sleep `
        -Seconds ($minutes * 60)
