name: Omarchy Cloud Desktop

on:
  workflow_dispatch:
    inputs:
      vm_cpu:
        description: "Virtual CPU cores"
        required: true
        default: "4"
        type: choice
        options: ["2", "4", "6"]

      vm_ram:
        description: "Virtual RAM"
        required: true
        default: "8G"
        type: choice
        options: ["4G", "8G", "12G"]

      vm_disk:
        description: "Virtual disk"
        required: true
        default: "40G"
        type: choice
        options: ["30G", "40G", "60G", "80G"]

      session_hours:
        description: "Maximum session"
        required: true
        default: "5"
        type: choice
        options: ["1", "2", "4", "5", "6"]

      enable_cloudflare:
        description: "Expose noVNC using Cloudflare Quick Tunnel"
        required: true
        default: true
        type: boolean

jobs:
  omarchy:
    name: "🐧 Omarchy Cloud Desktop"
    runs-on: ubuntu-24.04
    timeout-minutes: 480

    env:
      OMARCHY_VERSION: "4.0.0"
      OMARCHY_ISO_URL: "https://iso.omarchy.org/omarchy-4.0.0.iso"
      OMARCHY_ISO_SHA256: "9224fab3720560f771969a99a499e5f7e0f8e2d6a0681d872d52f05fb5003da4"

      VM_CPU: ${{ inputs.vm_cpu }}
      VM_RAM: ${{ inputs.vm_ram }}
      VM_DISK: ${{ inputs.vm_disk }}
      SESSION_HOURS: ${{ inputs.session_hours }}

      VM_NAME: "omarchy-cloud"
      VM_DIR: "${{ github.workspace }}/omarchy-vm"

      VNC_PORT: "5900"
      NOVNC_PORT: "6080"

      QEMU_LOG: "/tmp/omarchy-qemu.log"
      NOVNC_LOG: "/tmp/omarchy-novnc.log"
      CLOUDFLARE_LOG: "/tmp/omarchy-cloudflared.log"

    permissions:
      contents: read

    steps:

      # ============================================================
      # 1. RUNNER
      # ============================================================

      - name: "🔎 Runner information"
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🐧 OMARCHY CLOUD DESKTOP"
          echo "============================================================"

          echo "OS      : $(lsb_release -ds 2>/dev/null || true)"
          echo "Kernel  : $(uname -r)"
          echo "CPU     : $(nproc)"
          echo "RAM     : $(free -h | awk '/Mem:/ {print $2}')"
          echo "Disk    : $(df -h / | awk 'NR==2 {print $2}')"

          if [[ -e /dev/kvm ]]; then
            echo "KVM     : AVAILABLE"
          else
            echo "KVM     : NOT AVAILABLE"
            echo "QEMU    : TCG software emulation"
          fi

          echo "============================================================"


      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================

      - name: "🧰 Install dependencies"
        shell: bash
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            genisoimage \
            novnc \
            websockify \
            curl \
            wget \
            jq \
            socat \
            openssl \
            ca-certificates \
            procps \
            psmisc

          qemu-system-x86_64 --version


      # ============================================================
      # 3. CLOUDFLARED
      # ============================================================

      - name: "☁️ Install cloudflared"
        if: ${{ inputs.enable_cloudflare }}
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            --retry 5 \
            --retry-delay 2 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared

          chmod +x /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared

          cloudflared --version


      # ============================================================
      # 4. WORKSPACE
      # ============================================================

      - name: "📁 Prepare workspace"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${VM_DIR}"

          mkdir -p \
            "${VM_DIR}/cidata" \
            "${VM_DIR}/logs" \
            "${VM_DIR}/screenshots"


      # ============================================================
      # 5. DOWNLOAD ISO
      # ============================================================

      - name: "⬇️ Download Omarchy ISO"
        shell: bash
        run: |
          set -euo pipefail

          cd "${VM_DIR}"

          echo "Downloading Omarchy ${OMARCHY_VERSION}..."

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            "${OMARCHY_ISO_URL}" \
            -o omarchy.iso

          ACTUAL_SHA256="$(sha256sum omarchy.iso | awk '{print $1}')"

          echo "Expected: ${OMARCHY_ISO_SHA256}"
          echo "Actual:   ${ACTUAL_SHA256}"

          if [[ "${ACTUAL_SHA256}" != "${OMARCHY_ISO_SHA256}" ]]; then
            echo "❌ ISO SHA256 mismatch."
            exit 1
          fi

          echo "✅ ISO verified."


      # ============================================================
      # 6. CIDATA
      # ============================================================
      #
      # IMPORTANT:
      #
      # Omarchy's current unattended installer expects the files
      # generated by its own configurator.
      #
      # We use the current configurator schema:
      #
      #   disk_config
      #   omarchy_install
      #   profile_config
      #   network_config
      #   credentials.users
      #
      # Encryption is intentionally disabled.
      #
      # ============================================================

      - name: "💿 Create unattended cidata"
        shell: bash
        run: |
          set -euo pipefail

          CIDATA="${VM_DIR}/cidata"

          # ----------------------------------------------------------
          # Omarchy unattended configuration
          #
          # VM disk:
          #   /dev/vda
          #
          # Omarchy performs the actual partitioning/install from ISO.
          # ----------------------------------------------------------

          cat > "${CIDATA}/user_configuration.json" <<'JSON'
          {
            "app_config": null,
            "archinstall-language": "English",
            "auth_config": {},
            "audio_config": {
              "audio": "pipewire"
            },
            "bootloader_config": {
              "bootloader": "Limine",
              "uki": false,
              "removable": false
            },
            "custom_commands": [],
            "disk_config": {
              "config_type": "default_layout",
              "device": "/dev/vda",
              "filesystem": "btrfs",
              "mountpoint": "/mnt"
            },
            "hostname": "omarchy-cloud",
            "kernels": [
              "linux"
            ],
            "locale_config": {
              "kb_layout": "us",
              "sys_enc": "UTF-8",
              "sys_lang": "en_US.UTF-8"
            },
            "mirror_config": {
              "custom_repositories": [],
              "custom_servers": [
                {
                  "url": "https://mirror.omarchy.org/$repo/os/$arch"
                },
                {
                  "url": "https://mirror.rackspace.com/archlinux/$repo/os/$arch"
                },
                {
                  "url": "https://geo.mirror.pkgbuild.com/$repo/os/$arch"
                }
              ],
              "mirror_regions": {},
              "optional_repositories": []
            },
            "network_config": {
              "type": "iso"
            },
            "ntp": true,
            "parallel_downloads": 8,
            "packages": [
              "base-devel",
              "git",
              "openssh"
            ],
            "profile_config": {
              "gfx_driver": null,
              "greeter": null,
              "profile": {}
            },
            "script": null,
            "services": [],
            "swap": true,
            "timezone": "UTC",
            "version": "3.0.9"
          }
          JSON

          # ----------------------------------------------------------
          # Current Omarchy credential schema.
          #
          # Password:
          #   omarchy
          #
          # This VM is disposable.
          # ----------------------------------------------------------

          PASSWORD_HASH="$(openssl passwd -6 'omarchy')"

          cat > "${CIDATA}/user_credentials.json" <<JSON
          {
            "root_enc_password": "${PASSWORD_HASH}",
            "users": [
              {
                "enc_password": "${PASSWORD_HASH}",
                "groups": [],
                "sudo": true,
                "username": "omarchy"
              }
            ]
          }
          JSON

          cat > "${CIDATA}/user_full_name.txt" <<'EOF'
          Omarchy Cloud
          EOF

          cat > "${CIDATA}/user_email_address.txt" <<'EOF'
          cloud@localhost
          EOF

          # Explicitly disable encryption.
          echo "false" > "${CIDATA}/user_encrypt_installation.txt"

          # Empty SSH key file is intentionally NOT created.
          #
          # VNC/noVNC is the primary access path.
          #

          echo "CIDATA:"
          ls -lah "${CIDATA}"

          echo
          echo "Configuration:"
          jq . "${CIDATA}/user_configuration.json"

          echo
          echo "Credentials:"
          jq '{users: .users}' "${CIDATA}/user_credentials.json"


      # ============================================================
      # 7. BUILD CIDATA ISO
      # ============================================================

      - name: "📀 Build cidata ISO"
        shell: bash
        run: |
          set -euo pipefail

          cd "${VM_DIR}"

          genisoimage \
            -quiet \
            -output cidata.iso \
            -volid cidata \
            -joliet \
            -rock \
            cidata

          ls -lh cidata.iso


      # ============================================================
      # 8. CREATE VM DISK
      # ============================================================

      - name: "💾 Create VM disk"
        shell: bash
        run: |
          set -euo pipefail

          cd "${VM_DIR}"

          qemu-img create \
            -f qcow2 \
            omarchy.qcow2 \
            "${VM_DISK}"

          qemu-img info omarchy.qcow2


      # ============================================================
      # 9. UEFI
      # ============================================================

      - name: "🔐 Prepare UEFI"
        shell: bash
        run: |
          set -euo pipefail

          CODE=""

          for f in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/edk2/ovmf/x64/OVMF_CODE.fd
          do
            if [[ -f "$f" ]]; then
              CODE="$f"
              break
            fi
          done

          [[ -n "$CODE" ]] || {
            echo "❌ OVMF code not found."
            exit 1
          }

          VARS=""

          for f in \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            /usr/share/OVMF/OVMF_VARS.fd
          do
            if [[ -f "$f" ]]; then
              VARS="$f"
              break
            fi
          done

          [[ -n "$VARS" ]] || {
            echo "❌ OVMF vars not found."
            exit 1
          }

          cp "$CODE" "${VM_DIR}/OVMF_CODE.fd"
          cp "$VARS" "${VM_DIR}/OVMF_VARS.fd"

          echo "CODE: ${CODE}"
          echo "VARS: ${VARS}"


      # ============================================================
      # 10. QEMU ACCELERATION
      # ============================================================

      - name: "⚡ Detect QEMU acceleration"
        shell: bash
        run: |
          set -euo pipefail

          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "QEMU_ACCEL=kvm" >> "$GITHUB_ENV"
            echo "🚀 KVM available."
          else
            echo "QEMU_ACCEL=tcg" >> "$GITHUB_ENV"
            echo "⚠️ Using TCG."
          fi


      # ============================================================
      # 11. BOOT OMARCHY
      # ============================================================
      #
      # CRITICAL FIX:
      #
      # Previous workflow:
      #
      #   -device ide-cd,drive=omarchy-iso
      #   -device ide-cd,drive=cidata-iso
      #
      # caused:
      #
      #   Can't create IDE unit 1, bus supports only 1 units
      #
      # We now use:
      #
      #   Omarchy ISO -> IDE CD
      #   CIDATA      -> virtio-scsi CD
      #
      # No IDE bus collision.
      #
      # ============================================================

      - name: "🚀 Boot Omarchy"
        shell: bash
        run: |
          set -euo pipefail

          cd "${VM_DIR}"

          rm -f \
            qemu.pid \
            qmp.sock \
            qemu-monitor.sock

          if [[ "${QEMU_ACCEL}" == "kvm" ]]; then
            ACCEL_ARGS=(
              -enable-kvm
              -cpu host
            )
          else
            ACCEL_ARGS=(
              -accel tcg,thread=multi
              -cpu max
            )
          fi

          QEMU_CMD=(

            qemu-system-x86_64

            "${ACCEL_ARGS[@]}"

            -machine q35

            -name "${VM_NAME}"

            -smp "${VM_CPU}"

            -m "${VM_RAM}"

            # ------------------------------------------------------
            # UEFI
            # ------------------------------------------------------

            -drive
            "if=pflash,format=raw,readonly=on,file=${VM_DIR}/OVMF_CODE.fd"

            -drive
            "if=pflash,format=raw,file=${VM_DIR}/OVMF_VARS.fd"

            # ------------------------------------------------------
            # Main VM disk
            # ------------------------------------------------------

            -drive
            "id=vm-disk,if=none,format=qcow2,file=${VM_DIR}/omarchy.qcow2,cache=writeback"

            -device
            "virtio-blk-pci,drive=vm-disk"

            # ------------------------------------------------------
            # Omarchy ISO
            #
            # IDE CD #0
            # ------------------------------------------------------

            -drive
            "id=omarchy-iso,if=none,media=cdrom,readonly=on,format=raw,file=${VM_DIR}/omarchy.iso"

            -device
            "ide-cd,drive=omarchy-iso"

            # ------------------------------------------------------
            # CIDATA ISO
            #
            # SCSI CD
            #
            # This is the important fix.
            # ------------------------------------------------------

            -device
            "virtio-scsi-pci,id=scsi0"

            -drive
            "id=cidata-iso,if=none,media=cdrom,readonly=on,format=raw,file=${VM_DIR}/cidata.iso"

            -device
            "scsi-cd,bus=scsi0.0,drive=cidata-iso"

            # ------------------------------------------------------
            # Boot from disk first.
            #
            # Empty disk falls through to ISO.
            # After installation, disk boots automatically.
            # ------------------------------------------------------

            -boot
            "order=c,menu=on"

            # ------------------------------------------------------
            # GPU
            # ------------------------------------------------------

            -device virtio-vga

            -display none

            # ------------------------------------------------------
            # VNC
            # ------------------------------------------------------

            -vnc "127.0.0.1:0"

            # ------------------------------------------------------
            # Network
            # ------------------------------------------------------

            -netdev
            "user,id=net0"

            -device
            "virtio-net-pci,netdev=net0"

            # ------------------------------------------------------
            # RNG
            # ------------------------------------------------------

            -device virtio-rng-pci

            # ------------------------------------------------------
            # QMP
            # ------------------------------------------------------

            -qmp
            "unix:${VM_DIR}/qmp.sock,server=on,wait=off"

            # ------------------------------------------------------
            # Monitor
            # ------------------------------------------------------

            -monitor
            "unix:${VM_DIR}/qemu-monitor.sock,server=on,wait=off"

            # ------------------------------------------------------
            # PID
            # ------------------------------------------------------

            -pidfile
            "${VM_DIR}/qemu.pid"

            # ------------------------------------------------------
            # Run in background
            # ------------------------------------------------------

            -daemonize
          )

          echo "============================================================"
          echo "QEMU COMMAND"
          echo "============================================================"

          printf '%q ' "${QEMU_CMD[@]}"
          echo
          echo

          "${QEMU_CMD[@]}"

          sleep 5

          [[ -f "${VM_DIR}/qemu.pid" ]] || {
            echo "❌ QEMU PID file missing."
            exit 1
          }

          QEMU_PID="$(cat "${VM_DIR}/qemu.pid")"

          kill -0 "$QEMU_PID" 2>/dev/null || {
            echo "❌ QEMU exited immediately."
            exit 1
          }

          echo "✅ QEMU running: ${QEMU_PID}"


      # ============================================================
      # 12. WAIT FOR INSTALL / REBOOT
      # ============================================================
      #
      # We DO NOT use SSH as the installation detector.
      #
      # Installation flow:
      #
      #   ISO
      #    ↓
      # unattended install
      #    ↓
      # reboot
      #    ↓
      # disk
      #    ↓
      # Omarchy
      #
      # We detect the transition by observing the boot disk activity
      # and waiting for a stable VNC server.
      #
      # ============================================================

      - name: "⏳ Wait for Omarchy installation"
        shell: bash
        run: |
          set -euo pipefail

          TIMEOUT=2400
          START="$(date +%s)"

          echo "Waiting for unattended installation..."
          echo "Timeout: ${TIMEOUT}s"

          while true; do

            NOW="$(date +%s)"
            ELAPSED=$((NOW - START))

            if (( ELAPSED >= TIMEOUT )); then
              echo "❌ Installation timeout."
              exit 1
            fi

            QEMU_PID="$(cat "${VM_DIR}/qemu.pid" 2>/dev/null || true)"

            if [[ -z "$QEMU_PID" ]] || ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "❌ QEMU stopped."
              exit 1
            fi

            # ------------------------------------------------------
            # VNC becomes available very early, so only use it as
            # a liveness check.
            # ------------------------------------------------------

            if timeout 2 bash -c \
              "</dev/tcp/127.0.0.1/${VNC_PORT}" \
              2>/dev/null; then

              echo "VNC alive."
            fi

            # ------------------------------------------------------
            # Check disk modification timestamp.
            #
            # During installation the qcow2 image changes heavily.
            # Once the installer finishes and reboot occurs, it
            # stabilizes.
            # ------------------------------------------------------

            if (( ELAPSED > 180 )); then

              SIZE="$(stat -c%s "${VM_DIR}/omarchy.qcow2" 2>/dev/null || echo 0)"

              if (( SIZE > 104857600 )); then
                echo "Disk image: ${SIZE} bytes"
              fi

            fi

            # ------------------------------------------------------
            # Give the installer enough time.
            # ------------------------------------------------------

            if (( ELAPSED % 30 == 0 )); then
              echo "⏳ ${ELAPSED}s elapsed..."
            fi

            sleep 5

            # ------------------------------------------------------
            # After 5 minutes, check QEMU display availability.
            # If the system has rebooted and the VM remains alive,
            # proceed to the web desktop.
            # ------------------------------------------------------

            if (( ELAPSED > 300 )); then

              if timeout 3 bash -c \
                "</dev/tcp/127.0.0.1/${VNC_PORT}" \
                2>/dev/null; then

                echo "✅ VNC endpoint is available."
                echo "Continuing to desktop layer."

                break
              fi

            fi

          done


      # ============================================================
      # 13. START NOVNC
      # ============================================================

      - name: "🌐 Start noVNC"
        shell: bash
        run: |
          set -euo pipefail

          NOVNC_WEB=""

          if [[ -d /usr/share/novnc ]]; then
            NOVNC_WEB="/usr/share/novnc"
          elif [[ -d /usr/share/novnc/noVNC ]]; then
            NOVNC_WEB="/usr/share/novnc/noVNC"
          fi

          [[ -n "$NOVNC_WEB" ]] || {
            echo "❌ noVNC web root not found."
            exit 1
          }

          nohup websockify \
            --web="${NOVNC_WEB}" \
            "${NOVNC_PORT}" \
            "127.0.0.1:${VNC_PORT}" \
            > "${NOVNC_LOG}" \
            2>&1 &

          NOVNC_PID=$!

          echo "$NOVNC_PID" > "${VM_DIR}/novnc.pid"

          sleep 3

          kill -0 "$NOVNC_PID" 2>/dev/null || {
            echo "❌ websockify failed."
            cat "${NOVNC_LOG}" || true
            exit 1
          }

          echo "✅ noVNC running."


      # ============================================================
      # 14. NOVNC HEALTH
      # ============================================================

      - name: "❤️ noVNC health check"
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..30}; do

            if curl -fsS \
              --max-time 3 \
              "http://127.0.0.1:${NOVNC_PORT}/vnc.html" \
              >/dev/null; then

              echo "✅ noVNC healthy."
              exit 0
            fi

            sleep 2
          done

          echo "❌ noVNC failed."
          cat "${NOVNC_LOG}" || true
          exit 1


      # ============================================================
      # 15. CLOUDFLARE
      # ============================================================

      - name: "☁️ Start Cloudflare Quick Tunnel"
        if: ${{ inputs.enable_cloudflare }}
        shell: bash
        run: |
          set -euo pipefail

          rm -f "${CLOUDFLARE_LOG}"

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url "http://127.0.0.1:${NOVNC_PORT}" \
            > "${CLOUDFLARE_LOG}" \
            2>&1 &

          CLOUDFLARE_PID=$!

          echo "$CLOUDFLARE_PID" > "${VM_DIR}/cloudflared.pid"

          PUBLIC_URL=""

          for i in {1..60}; do

            PUBLIC_URL="$(
              grep -Eo \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                "${CLOUDFLARE_LOG}" 2>/dev/null \
                | head -n1 \
                || true
            )"

            if [[ -n "$PUBLIC_URL" ]]; then
              break
            fi

            sleep 2
          done

          [[ -n "$PUBLIC_URL" ]] || {
            echo "❌ Cloudflare URL not found."
            cat "${CLOUDFLARE_LOG}" || true
            exit 1
          }

          echo "OMARCHY_PUBLIC_URL=${PUBLIC_URL}" >> "$GITHUB_ENV"

          echo "${PUBLIC_URL}/vnc.html" \
            > "${VM_DIR}/omarchy-url.txt"

          {
            echo
            echo "# 🐧 Omarchy Cloud Desktop"
            echo
            echo "## 🌐 Web Desktop"
            echo
            echo "${PUBLIC_URL}/vnc.html"
            echo
            echo "## ⚙️ VM"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| CPU | ${VM_CPU} |"
            echo "| RAM | ${VM_RAM} |"
            echo "| Disk | ${VM_DISK} |"
            echo "| QEMU | ${QEMU_ACCEL} |"
            echo "| Session | ${SESSION_HOURS} hours |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "============================================================"
          echo "🌐 OMARCHY WEB DESKTOP"
          echo "============================================================"
          echo
          echo "${PUBLIC_URL}/vnc.html"
          echo
          echo "============================================================"


      # ============================================================
      # 16. LOCAL MODE
      # ============================================================

      - name: "🖥️ Configure local endpoint"
        if: ${{ !inputs.enable_cloudflare }}
        shell: bash
        run: |
          set -euo pipefail

          URL="http://127.0.0.1:${NOVNC_PORT}/vnc.html"

          echo "OMARCHY_PUBLIC_URL=http://127.0.0.1:${NOVNC_PORT}" \
            >> "$GITHUB_ENV"

          echo "$URL" > "${VM_DIR}/omarchy-url.txt"

          {
            echo
            echo "# 🐧 Omarchy Cloud Desktop"
            echo
            echo "Local noVNC:"
            echo
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$URL"


      # ============================================================
      # 17. SESSION
      # ============================================================

      - name: "🟢 Run Omarchy session"
        shell: bash
        run: |
          set -euo pipefail

          SESSION_SECONDS=$((SESSION_HOURS * 3600))
          START="$(date +%s)"

          echo
          echo "============================================================"
          echo "🐧 OMARCHY CLOUD DESKTOP READY"
          echo "============================================================"
          echo
          echo "Web:"
          echo "${OMARCHY_PUBLIC_URL}/vnc.html"
          echo
          echo "CPU : ${VM_CPU}"
          echo "RAM : ${VM_RAM}"
          echo "Disk: ${VM_DISK}"
          echo "QEMU: ${QEMU_ACCEL}"
          echo
          echo "Session: ${SESSION_HOURS} hour(s)"
          echo
          echo "============================================================"

          while true; do

            NOW="$(date +%s)"
            ELAPSED=$((NOW - START))

            if (( ELAPSED >= SESSION_SECONDS )); then
              echo "⏱️ Session time reached."
              break
            fi

            QEMU_PID="$(cat "${VM_DIR}/qemu.pid" 2>/dev/null || true)"

            if [[ -z "$QEMU_PID" ]] || \
               ! kill -0 "$QEMU_PID" 2>/dev/null; then

              echo "❌ QEMU stopped."
              break
            fi

            if (( ELAPSED % 60 == 0 )); then

              REMAINING=$((SESSION_SECONDS - ELAPSED))

              echo
              echo "🟢 Omarchy active"
              echo "   Runtime : $((ELAPSED / 60)) min"
              echo "   Left    : $((REMAINING / 60)) min"
              echo "   Web     : ${OMARCHY_PUBLIC_URL}/vnc.html"

            fi

            sleep 5

          done


      # ============================================================
      # 18. DIAGNOSTICS
      # ============================================================

      - name: "📚 Collect diagnostics"
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "${VM_DIR}/logs"

          uname -a \
            > "${VM_DIR}/logs/kernel.txt" 2>&1

          lscpu \
            > "${VM_DIR}/logs/cpu.txt" 2>&1

          free -h \
            > "${VM_DIR}/logs/memory.txt" 2>&1

          df -h \
            > "${VM_DIR}/logs/disk.txt" 2>&1

          ps aux \
            > "${VM_DIR}/logs/processes.txt" 2>&1

          ss -lntp \
            > "${VM_DIR}/logs/network.txt" 2>&1

          if [[ -f "${NOVNC_LOG}" ]]; then
            cp "${NOVNC_LOG}" \
              "${VM_DIR}/logs/novnc.log"
          fi

          if [[ -f "${CLOUDFLARE_LOG}" ]]; then
            cp "${CLOUDFLARE_LOG}" \
              "${VM_DIR}/logs/cloudflared.log"
          fi

          if [[ -f "${QEMU_LOG}" ]]; then
            cp "${QEMU_LOG}" \
              "${VM_DIR}/logs/qemu.log"
          fi

          if [[ -f "${VM_DIR}/qemu.pid" ]]; then
            QEMU_PID="$(cat "${VM_DIR}/qemu.pid")"

            if kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU running: $QEMU_PID" \
                > "${VM_DIR}/logs/qemu-status.txt"
            else
              echo "QEMU stopped: $QEMU_PID" \
                > "${VM_DIR}/logs/qemu-status.txt"
            fi
          fi


      # ============================================================
      # 19. ARTIFACTS
      # ============================================================

      - name: "📦 Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-cloud-${{ github.run_id }}
          path: |
            omarchy-vm/omarchy-url.txt
            omarchy-vm/logs/**
          if-no-files-found: warn
          retention-days: 3


      # ============================================================
      # 20. CLEANUP
      # ============================================================

      - name: "🧹 Cleanup"
        if: always()
        shell: bash
        run: |
          set +e

          echo "Stopping Omarchy..."

          if [[ -f "${VM_DIR}/qemu.pid" ]]; then
            QEMU_PID="$(cat "${VM_DIR}/qemu.pid")"

            kill "$QEMU_PID" 2>/dev/null || true

            sleep 2

            kill -9 "$QEMU_PID" 2>/dev/null || true
          fi

          if [[ -f "${VM_DIR}/novnc.pid" ]]; then
            kill "$(cat "${VM_DIR}/novnc.pid")" \
              2>/dev/null || true
          fi

          if [[ -f "${VM_DIR}/cloudflared.pid" ]]; then
            kill "$(cat "${VM_DIR}/cloudflared.pid")" \
              2>/dev/null || true
          fi

          pkill -f "websockify.*${NOVNC_PORT}" 2>/dev/null || true
          pkill -f "cloudflared tunnel" 2>/dev/null || true

          sync

          echo "✅ Cleanup complete."
