name: Omarchy Cloud Desktop

# ============================================================
# OMARCHY CLOUD DESKTOP
# ============================================================
#
# Architecture:
#
# GitHub Actions Runner
#        │
#        ▼
#      QEMU
#        │
#        ├── Omarchy 4.0.0 ISO
#        ├── CIDATA ISO
#        ├── UEFI / OVMF
#        └── Virtual Disk
#        │
#        ▼
#   Omarchy Linux
#        │
#        ├── Arch Linux
#        ├── Wayland
#        ├── Hyprland
#        └── Quickshell
#        │
#        ▼
#      VNC
#        │
#        ▼
#    websockify
#        │
#        ▼
#      noVNC
#        │
#        ▼
# Cloudflare Quick Tunnel
#        │
#        ▼
#      Browser
#
# ============================================================

on:
  workflow_dispatch:
    inputs:

      vm_cpu:
        description: "Virtual CPU cores"
        required: true
        default: "4"
        type: choice
        options:
          - "2"
          - "4"
          - "6"

      vm_ram:
        description: "Virtual RAM"
        required: true
        default: "8G"
        type: choice
        options:
          - "4G"
          - "8G"
          - "12G"

      vm_disk:
        description: "Virtual disk size"
        required: true
        default: "40G"
        type: choice
        options:
          - "30G"
          - "40G"
          - "60G"
          - "80G"

      session_hours:
        description: "Maximum desktop session duration"
        required: true
        default: "5"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "5"
          - "6"

      enable_ssh:
        description: "Enable SSH inside Omarchy"
        required: true
        default: true
        type: boolean

      enable_cloudflare:
        description: "Expose noVNC through Cloudflare Quick Tunnel"
        required: true
        default: true
        type: boolean

      install_extra_tools:
        description: "Install common development tools after boot"
        required: true
        default: false
        type: boolean


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# JOB
# ============================================================

jobs:

  omarchy-cloud:

    name: "🐧 Omarchy Cloud Desktop"

    runs-on: ubuntu-24.04

    timeout-minutes: 480


    # ========================================================
    # ENVIRONMENT
    # ========================================================

    env:

      OMARCHY_VERSION: "4.0.0"

      OMARCHY_ISO_URL: "https://iso.omarchy.org/omarchy-4.0.0.iso"

      OMARCHY_ISO_SHA256: "9224fab3720560f771969a99a499e5f7e0f8e2d6a0681d872d52f05fb5003da4"

      VM_CPU: ${{ inputs.vm_cpu }}

      VM_RAM: ${{ inputs.vm_ram }}

      VM_DISK: ${{ inputs.vm_disk }}

      SESSION_HOURS: ${{ inputs.session_hours }}

      VM_NAME: "omarchy-cloud"

      VM_DIR: "${{ github.workspace }}/omarchy-vm"

      VNC_PORT: "5900"

      NOVNC_PORT: "6080"

      SSH_PORT: "2222"

      CLOUDFLARE_LOG: "/tmp/cloudflared.log"

      QEMU_LOG: "/tmp/qemu.log"

      NOVNC_LOG: "/tmp/novnc.log"


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: "📦 Checkout repository"

        uses: actions/checkout@v4


      # ======================================================
      # SYSTEM INFORMATION
      # ======================================================

      - name: "🔎 Runner information"

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "🐧 OMARCHY CLOUD DESKTOP"
          echo "============================================================"
          echo ""

          echo "GitHub Runner:"
          echo "  OS        : $(lsb_release -ds || true)"
          echo "  Kernel    : $(uname -r)"
          echo "  CPU       : $(nproc) cores"
          echo "  Memory    : $(free -h | awk '/Mem:/ {print $2}')"
          echo "  Disk      : $(df -h / | awk 'NR==2 {print $2}')"
          echo ""

          echo "Requested VM:"
          echo "  CPU       : ${VM_CPU}"
          echo "  RAM       : ${VM_RAM}"
          echo "  Disk      : ${VM_DISK}"
          echo "  Session   : ${SESSION_HOURS} hour(s)"
          echo ""

          if [[ -e /dev/kvm ]]; then
            echo "🚀 KVM acceleration: AVAILABLE"
          else
            echo "⚠️  KVM acceleration: NOT AVAILABLE"
            echo "   QEMU will use software emulation (TCG)."
          fi

          echo ""

          lscpu | sed -n '1,20p' || true

          echo ""
          echo "============================================================"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: "🧰 Install virtualization + Web Desktop dependencies"

        shell: bash

        run: |

          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            qemu-system-gui \
            ovmf \
            genisoimage \
            cloud-image-utils \
            novnc \
            websockify \
            curl \
            wget \
            jq \
            unzip \
            socat \
            net-tools \
            openssh-client \
            ca-certificates \
            python3 \
            python3-pip \
            xz-utils \
            gzip \
            procps \
            lsof \
            psmisc

          echo ""
          echo "Installed versions:"
          echo ""

          qemu-system-x86_64 --version

          echo ""

          if command -v websockify >/dev/null 2>&1; then
            websockify --version || true
          fi

          echo ""

          if command -v novnc_proxy >/dev/null 2>&1; then
            echo "noVNC: OK"
          elif [[ -d /usr/share/novnc ]]; then
            echo "noVNC web root: /usr/share/novnc"
          else
            echo "❌ noVNC was not installed correctly."
            exit 1
          fi


      # ======================================================
      # INSTALL CLOUDFLARED
      # ======================================================

      - name: "☁️ Install Cloudflare Tunnel client"

        if: ${{ inputs.enable_cloudflare }}

        shell: bash

        run: |

          set -euo pipefail

          echo "Downloading latest cloudflared..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o /tmp/cloudflared

          chmod +x /tmp/cloudflared

          sudo install \
            -m 0755 \
            /tmp/cloudflared \
            /usr/local/bin/cloudflared

          echo ""
          echo "Cloudflared:"
          cloudflared --version

          echo ""
          echo "Cloudflare Quick Tunnel mode:"
          echo "  No account token required."


      # ======================================================
      # PREPARE WORKSPACE
      # ======================================================

      - name: "📁 Prepare VM workspace"

        shell: bash

        run: |

          set -euo pipefail

          rm -rf "${VM_DIR}"

          mkdir -p "${VM_DIR}"

          mkdir -p \
            "${VM_DIR}/cidata" \
            "${VM_DIR}/logs" \
            "${VM_DIR}/screenshots"

          echo "Workspace:"
          find "${VM_DIR}" -maxdepth 2 -type d -print


      # ======================================================
      # DOWNLOAD OMARCHY ISO
      # ======================================================

      - name: "⬇️ Download Omarchy ISO"

        shell: bash

        run: |

          set -euo pipefail

          cd "${VM_DIR}"

          echo ""
          echo "============================================================"
          echo "⬇️ DOWNLOADING OMARCHY ${OMARCHY_VERSION}"
          echo "============================================================"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "${OMARCHY_ISO_URL}" \
            -o omarchy.iso

          echo ""
          echo "ISO downloaded:"
          ls -lh omarchy.iso

          ACTUAL_SHA256="$(sha256sum omarchy.iso | awk '{print $1}')"

          echo ""
          echo "SHA256:"
          echo "Expected: ${OMARCHY_ISO_SHA256}"
          echo "Actual:   ${ACTUAL_SHA256}"
          echo ""

          if [[ "${ACTUAL_SHA256}" != "${OMARCHY_ISO_SHA256}" ]]; then

            echo "❌ SHA256 verification failed."

            exit 1

          fi

          echo "✅ Omarchy ISO integrity verified."


      # ======================================================
      # CREATE CIDATA CONFIG
      # ======================================================

      - name: "💿 Generate Omarchy unattended installation config"

        shell: bash

        run: |

          set -euo pipefail

          CIDATA="${VM_DIR}/cidata"

          echo ""
          echo "============================================================"
          echo "💿 GENERATING CIDATA"
          echo "============================================================"
          echo ""

          #
          # Omarchy uses archinstall configuration files.
          #
          # This configuration intentionally disables disk
          # encryption because encrypted unattended installs
          # require an interactive passphrase during first boot.
          #

          cat > "${CIDATA}/user_configuration.json" <<'JSON'
          {
            "audio": "pipewire",
            "bootloader": "Limine",
            "config_version": "2.7.2",
            "debug": false,
            "disk_encryption": null,
            "gfx_driver": "All open-source",
            "harddrives": [
              "/dev/vda"
            ],
            "hostname": "omarchy-cloud",
            "kernels": [
              "linux"
            ],
            "keyboard_layout": "us",
            "locale": "en_US.UTF-8",
            "mirror_config": {
              "custom_mirrors": [],
              "mirror_regions": [
                "Worldwide"
              ]
            },
            "nic": {
              "dhcp": true,
              "dns": null,
              "gateway": null,
              "iface": null,
              "ip": null,
              "type": "iso"
            },
            "ntp": true,
            "packages": [],
            "parallel downloads": 5,
            "profile": {
              "path": "omarchy"
            },
            "script": "guided",
            "silent": true,
            "swap": true,
            "sys-encoding": "utf-8",
            "sys-language": "en_US",
            "timezone": "UTC",
            "version": "2.7.2"
          }
          JSON

          #
          # Password hash:
          #
          # This is only used inside the disposable VM.
          #
          # Change the password if interactive SSH password
          # authentication is ever enabled.
          #

          PASSWORD_HASH="$(openssl passwd -6 'omarchy')"

          cat > "${CIDATA}/user_credentials.json" <<JSON
          {
            "!users": [
              {
                "!password": "${PASSWORD_HASH}",
                "sudo": true,
                "username": "omarchy"
              }
            ]
          }
          JSON

          cat > "${CIDATA}/user_full_name.txt" <<'EOF'
          Omarchy Cloud
          EOF

          cat > "${CIDATA}/user_email_address.txt" <<'EOF'
          cloud@localhost
          EOF

          #
          # Explicitly disable encryption.
          #

          cat > "${CIDATA}/user_encrypt_installation.txt" <<'EOF'
          false
          EOF

          #
          # Empty authorized_keys by default.
          #
          # SSH is additionally exposed through QEMU user networking
          # only when the workflow input is enabled.
          #

          if [[ "${{ inputs.enable_ssh }}" == "true" ]]; then

            touch "${CIDATA}/authorized_keys"

          fi

          echo ""
          echo "CIDATA files:"
          ls -la "${CIDATA}"

          echo ""
          echo "user_configuration.json:"
          jq . "${CIDATA}/user_configuration.json"

          echo ""
          echo "user_credentials.json:"
          jq '."!users"[0] | {username, sudo}' \
            "${CIDATA}/user_credentials.json"


      # ======================================================
      # BUILD CIDATA ISO
      # ======================================================

      - name: "📀 Build cidata ISO"

        shell: bash

        run: |

          set -euo pipefail

          cd "${VM_DIR}"

          genisoimage \
            -quiet \
            -output cidata.iso \
            -volid cidata \
            -joliet \
            -rock \
            cidata

          echo ""
          echo "CIDATA ISO:"
          ls -lh cidata.iso

          echo ""
          echo "CIDATA checksum:"
          sha256sum cidata.iso


      # ======================================================
      # CREATE VM DISK
      # ======================================================

      - name: "💾 Create virtual disk"

        shell: bash

        run: |

          set -euo pipefail

          cd "${VM_DIR}"

          qemu-img create \
            -f qcow2 \
            omarchy.qcow2 \
            "${VM_DISK}"

          echo ""
          echo "Virtual disk:"
          qemu-img info omarchy.qcow2


      # ======================================================
      # PREPARE UEFI
      # ======================================================

      - name: "🔐 Prepare UEFI firmware"

        shell: bash

        run: |

          set -euo pipefail

          CODE=""

          for candidate in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/edk2/ovmf/x64/OVMF_CODE.fd
          do
            if [[ -f "${candidate}" ]]; then
              CODE="${candidate}"
              break
            fi
          done

          if [[ -z "${CODE}" ]]; then
            echo "❌ OVMF firmware not found."
            find /usr/share -iname '*OVMF*' -type f 2>/dev/null || true
            exit 1
          fi

          echo "UEFI firmware:"
          echo "  ${CODE}"

          cp \
            "${CODE}" \
            "${VM_DIR}/OVMF_CODE.fd"

          #
          # Create writable UEFI variable store.
          #

          if [[ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]]; then

            cp \
              /usr/share/OVMF/OVMF_VARS_4M.fd \
              "${VM_DIR}/OVMF_VARS.fd"

          elif [[ -f /usr/share/OVMF/OVMF_VARS.fd ]]; then

            cp \
              /usr/share/OVMF/OVMF_VARS.fd \
              "${VM_DIR}/OVMF_VARS.fd"

          else

            echo "❌ OVMF variable template not found."

            exit 1

          fi

          chmod 0644 \
            "${VM_DIR}/OVMF_CODE.fd" \
            "${VM_DIR}/OVMF_VARS.fd"

          echo "✅ UEFI prepared."


      # ======================================================
      # DETECT ACCELERATION
      # ======================================================

      - name: "⚡ Detect QEMU acceleration"

        shell: bash

        run: |

          set -euo pipefail

          if [[ -e /dev/kvm ]] && \
             [[ -r /dev/kvm ]] && \
             [[ -w /dev/kvm ]]; then

            echo "QEMU_ACCEL=kvm" >> "${GITHUB_ENV}"

            echo ""
            echo "🚀 KVM acceleration available."

          else

            echo "QEMU_ACCEL=tcg" >> "${GITHUB_ENV}"

            echo ""
            echo "⚠️ KVM unavailable."
            echo "Using QEMU TCG software emulation."

          fi


      # ======================================================
      # QEMU CLEANUP
      # ======================================================

      - name: "🧹 Register VM cleanup"

        shell: bash

        run: |

          set -euo pipefail

          cat > /tmp/omarchy-cleanup.sh <<'EOF'
          #!/usr/bin/env bash

          set +e

          echo ""
          echo "============================================================"
          echo "🧹 CLEANUP"
          echo "============================================================"

          pkill -f "cloudflared tunnel" || true
          pkill -f "websockify" || true
          pkill -f "qemu-system-x86_64" || true

          sync || true

          echo "Cleanup complete."
          EOF

          chmod +x /tmp/omarchy-cleanup.sh


      # ======================================================
      # START QEMU INSTALLATION
      # ======================================================
      - name: "🚀 Boot Omarchy installer"

        shell: bash

        run: |

          set -euo pipefail

          cd "${VM_DIR}"

          echo ""
          echo "============================================================"
          echo "🚀 STARTING OMARCHY VM"
          echo "============================================================"
          echo ""

          echo "Configuration:"
          echo "  CPU       : ${VM_CPU}"
          echo "  RAM       : ${VM_RAM}"
          echo "  Disk      : ${VM_DISK}"
          echo "  Accel     : ${QEMU_ACCEL}"
          echo "  VNC       : display 0 / TCP 5900"
          echo ""

          # ----------------------------------------------------
          # Network
          # ----------------------------------------------------

          NETWORK_ARGS=""

          if [[ "${{ inputs.enable_ssh }}" == "true" ]]; then

            NETWORK_ARGS=",hostfwd=tcp:127.0.0.1:${SSH_PORT}-:22"

          fi

          # ----------------------------------------------------
          # CPU / acceleration
          # ----------------------------------------------------

          if [[ "${QEMU_ACCEL}" == "kvm" ]]; then

            ACCEL_ARGS=(
              "-enable-kvm"
              "-cpu"
              "host"
            )

          else

            ACCEL_ARGS=(
              "-accel"
              "tcg,thread=multi"
              "-cpu"
              "max"
            )

          fi

          # ----------------------------------------------------
          # Remove stale state
          # ----------------------------------------------------

          rm -f \
            "${VM_DIR}/qemu.pid" \
            "${VM_DIR}/qmp.sock" \
            "${VM_DIR}/qemu-monitor.sock"

          # ----------------------------------------------------
          # Show files
          # ----------------------------------------------------

          echo "VM files:"
          ls -lh "${VM_DIR}"

          echo ""

          # ----------------------------------------------------
          # Validate disk
          # ----------------------------------------------------

          echo "Checking virtual disk..."

          qemu-img check \
            "${VM_DIR}/omarchy.qcow2"

          echo ""

          qemu-img info \
            "${VM_DIR}/omarchy.qcow2"

          echo ""

          # ----------------------------------------------------
          # QEMU
          # ----------------------------------------------------
          #
          # IMPORTANT:
          #
          # Every -drive argument is a SINGLE quoted argument.
          #
          # Disk:
          #   none -> virtio-blk device
          #
          # ISO:
          #   none -> IDE CD device
          #
          # CIDATA:
          #   none -> second IDE CD device
          #
          # This avoids automatic bus/index collisions.
          #
          # ----------------------------------------------------

          QEMU_CMD=(

            qemu-system-x86_64

            "${ACCEL_ARGS[@]}"

            -machine
            q35

            -smp
            "${VM_CPU}"

            -m
            "${VM_RAM}"

            -name
            "${VM_NAME}"

            # ------------------------------------------------
            # UEFI
            # ------------------------------------------------

            -drive
            "if=pflash,format=raw,readonly=on,file=${VM_DIR}/OVMF_CODE.fd"

            -drive
            "if=pflash,format=raw,file=${VM_DIR}/OVMF_VARS.fd"

            # ------------------------------------------------
            # Main virtual disk
            # ------------------------------------------------

            -drive
            "id=omarchy-disk,if=none,file=${VM_DIR}/omarchy.qcow2,format=qcow2,cache=writeback,discard=unmap"

            -device
            "virtio-blk-pci,drive=omarchy-disk"

            # ------------------------------------------------
            # Omarchy installer ISO
            # ------------------------------------------------

            -drive
            "id=omarchy-iso,if=none,media=cdrom,readonly=on,file=${VM_DIR}/omarchy.iso"

            -device
            "ide-cd,drive=omarchy-iso"

            # ------------------------------------------------
            # CIDATA
            # ------------------------------------------------

            -drive
            "id=cidata-iso,if=none,media=cdrom,readonly=on,file=${VM_DIR}/cidata.iso"

            -device
            "ide-cd,drive=cidata-iso"

            # ------------------------------------------------
            # Boot
            # ------------------------------------------------

            -boot
            "order=c,menu=on"

            # ------------------------------------------------
            # Graphics
            # ------------------------------------------------

            -device
            "virtio-vga"

            -display
            "none"

            # ------------------------------------------------
            # VNC
            # ------------------------------------------------

            -vnc
            "127.0.0.1:0"

            # ------------------------------------------------
            # Network
            # ------------------------------------------------

            -netdev
            "user,id=net0${NETWORK_ARGS}"

            -device
            "virtio-net-pci,netdev=net0"

            # ------------------------------------------------
            # RNG
            # ------------------------------------------------

            -device
            "virtio-rng-pci"

            # ------------------------------------------------
            # QEMU monitor
            # ------------------------------------------------

            -monitor
            "unix:${VM_DIR}/qemu-monitor.sock,server=on,wait=off"

            # ------------------------------------------------
            # QMP
            # ------------------------------------------------

            -qmp
            "unix:${VM_DIR}/qmp.sock,server=on,wait=off"

            # ------------------------------------------------
            # PID
            # ------------------------------------------------

            -pidfile
            "${VM_DIR}/qemu.pid"

            # ------------------------------------------------
            # Background
            # ------------------------------------------------

            -daemonize
          )

          echo ""
          echo "============================================================"
          echo "QEMU COMMAND"
          echo "============================================================"
          echo ""

          printf '%q ' "${QEMU_CMD[@]}"

          echo ""
          echo ""

          # ----------------------------------------------------
          # Launch
          # ----------------------------------------------------

          "${QEMU_CMD[@]}"

          sleep 5

          # ----------------------------------------------------
          # Verify PID
          # ----------------------------------------------------

          if [[ ! -f "${VM_DIR}/qemu.pid" ]]; then

            echo ""
            echo "❌ QEMU PID file was not created."

            exit 1

          fi

          QEMU_PID="$(cat "${VM_DIR}/qemu.pid")"

          echo "QEMU PID: ${QEMU_PID}"

          # ----------------------------------------------------
          # Verify process
          # ----------------------------------------------------

          if ! kill -0 "${QEMU_PID}" 2>/dev/null; then

            echo ""
            echo "❌ QEMU process is not running."

            exit 1

          fi

          # ----------------------------------------------------
          # Verify VNC
          # ----------------------------------------------------

          echo ""

          if timeout 5 bash -c \
            "</dev/tcp/127.0.0.1/5900" \
            2>/dev/null; then

            echo "✅ VNC is listening on 127.0.0.1:5900"

          else

            echo "⚠️ VNC is not listening yet."

          fi

          # ----------------------------------------------------
          # Verify QMP
          # ----------------------------------------------------

          if [[ -S "${VM_DIR}/qmp.sock" ]]; then

            echo "✅ QMP socket created."

          else

            echo "⚠️ QMP socket not available yet."

          fi

          echo ""
          echo "============================================================"
          echo "✅ QEMU STARTED SUCCESSFULLY"
          echo "============================================================"
          echo ""


      # ======================================================
      # WAIT FOR INSTALLATION
      # ======================================================

      - name: "⏳ Wait for Omarchy installation"

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "⏳ WAITING FOR OMARCHY INSTALLATION"
          echo "============================================================"
          echo ""

          #
          # The Omarchy ISO performs the unattended installation
          # when the cidata disk is detected.
          #
          # We don't depend on an arbitrary fixed sleep.
          # Instead we monitor the VM and its virtual disk.
          #

          INSTALL_TIMEOUT=1500

          START_TIME="$(date +%s)"

          LAST_MESSAGE=0

          while true; do

            NOW="$(date +%s)"

            ELAPSED=$((NOW - START_TIME))

            if (( ELAPSED > INSTALL_TIMEOUT )); then

              echo ""
              echo "❌ Installation timeout."

              exit 1

            fi

            #
            # Check QEMU.
            #

            QEMU_PID="$(cat "${VM_DIR}/qemu.pid" 2>/dev/null || true)"

            if [[ -z "${QEMU_PID}" ]] || \
               ! kill -0 "${QEMU_PID}" 2>/dev/null; then

              echo ""
              echo "❌ QEMU stopped unexpectedly."

              exit 1

            fi

            #
            # Detect SSH port when installation has completed.
            #

            if timeout 2 bash -c \
              "</dev/tcp/127.0.0.1/${SSH_PORT}" \
              2>/dev/null; then

              echo ""
              echo "🎉 SSH port is reachable."

              break

            fi

            #
            # Print progress every 30 seconds.
            #

            if (( ELAPSED - LAST_MESSAGE >= 30 )); then

              MINUTES=$((ELAPSED / 60))

              echo "⏳ Installation in progress... ${MINUTES}m elapsed."

              LAST_MESSAGE="${ELAPSED}"

            fi

            sleep 5

          done

          echo ""
          echo "✅ Omarchy installation appears complete."


      # ======================================================
      # WAIT FOR SSH
      # ======================================================

      - name: "🔐 Wait for Omarchy SSH"

        if: ${{ inputs.enable_ssh }}

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "Waiting for SSH..."

          START="$(date +%s)"

          while true; do

            NOW="$(date +%s)"

            if (( NOW - START > 300 )); then

              echo "⚠️ SSH did not become ready within 5 minutes."

              break

            fi

            if timeout 3 bash -c \
              "</dev/tcp/127.0.0.1/${SSH_PORT}" \
              2>/dev/null; then

              echo "✅ SSH port is open."

              break

            fi

            sleep 5

          done


      # ======================================================
      # CREATE VNC PASSWORD
      # ======================================================

      - name: "🔐 Configure VNC"

        shell: bash

        run: |

          set -euo pipefail

          #
          # VNC is bound ONLY to localhost.
          # It is never directly exposed to the internet.
          #

          echo "VNC endpoint:"
          echo "  127.0.0.1:${VNC_PORT}"


      # ======================================================
      # START NOVNC
      # ======================================================

      - name: "🌐 Start noVNC"

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "🌐 STARTING NOVNC"
          echo "============================================================"
          echo ""

          #
          # Ubuntu package normally installs the noVNC web files
          # under /usr/share/novnc.
          #

          if [[ -d /usr/share/novnc ]]; then

            NOVNC_WEB="/usr/share/novnc"

          elif [[ -d /usr/share/novnc/noVNC ]]; then

            NOVNC_WEB="/usr/share/novnc/noVNC"

          else

            echo "❌ Could not find noVNC web directory."

            find /usr/share \
              -maxdepth 3 \
              -type d \
              -iname '*novnc*' \
              2>/dev/null || true

            exit 1

          fi

          echo "noVNC web root:"
          echo "  ${NOVNC_WEB}"

          #
          # websockify bridges browser WebSocket traffic
          # to QEMU's VNC socket.
          #

          nohup \
            websockify \
              --web="${NOVNC_WEB}" \
              127.0.0.1:${NOVNC_PORT} \
              127.0.0.1:${VNC_PORT} \
              > "${NOVNC_LOG}" \
              2>&1 &

          NOVNC_PID=$!

          echo "${NOVNC_PID}" > "${VM_DIR}/novnc.pid"

          sleep 3

          if ! kill -0 "${NOVNC_PID}" 2>/dev/null; then

            echo "❌ noVNC/websockify failed."

            cat "${NOVNC_LOG}" || true

            exit 1

          fi

          echo "✅ noVNC started."

          echo ""
          echo "Local endpoint:"
          echo "  http://127.0.0.1:${NOVNC_PORT}/vnc.html"


      # ======================================================
      # WAIT FOR NOVNC
      # ======================================================

      - name: "❤️ noVNC health check"

        shell: bash

        run: |

          set -euo pipefail

          echo "Checking noVNC..."

          for i in {1..30}; do

            if curl \
              --silent \
              --fail \
              --max-time 3 \
              "http://127.0.0.1:${NOVNC_PORT}/vnc.html" \
              >/dev/null; then

              echo "✅ noVNC is healthy."

              exit 0

            fi

            sleep 2

          done

          echo "❌ noVNC health check failed."

          cat "${NOVNC_LOG}" || true

          exit 1


      # ======================================================
      # START CLOUDFLARE QUICK TUNNEL
      # ======================================================

      - name: "☁️ Start Cloudflare Quick Tunnel"

        if: ${{ inputs.enable_cloudflare }}

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "☁️ CLOUDFLARE QUICK TUNNEL"
          echo "============================================================"
          echo ""

          rm -f "${CLOUDFLARE_LOG}"

          nohup \
            cloudflared tunnel \
              --no-autoupdate \
              --url "http://127.0.0.1:${NOVNC_PORT}" \
              > "${CLOUDFLARE_LOG}" \
              2>&1 &

          CLOUDFLARE_PID=$!

          echo "${CLOUDFLARE_PID}" > "${VM_DIR}/cloudflared.pid"

          echo "Cloudflared PID: ${CLOUDFLARE_PID}"

          echo ""
          echo "Waiting for public URL..."

          PUBLIC_URL=""

          for i in {1..60}; do

            if [[ -f "${CLOUDFLARE_LOG}" ]]; then

              PUBLIC_URL="$(
                grep -Eo \
                  'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                  "${CLOUDFLARE_LOG}" \
                  | head -n 1 \
                  || true
              )"

            fi

            if [[ -n "${PUBLIC_URL}" ]]; then

              break

            fi

            sleep 2

          done

          if [[ -z "${PUBLIC_URL}" ]]; then

            echo "❌ Cloudflare Tunnel URL was not detected."

            echo ""
            echo "Cloudflared log:"
            cat "${CLOUDFLARE_LOG}" || true

            exit 1

          fi

          echo "OMARCHY_PUBLIC_URL=${PUBLIC_URL}" >> "${GITHUB_ENV}"

          echo "${PUBLIC_URL}" > "${VM_DIR}/omarchy-url.txt"

          echo ""
          echo "============================================================"
          echo "🌐 PUBLIC DESKTOP"
          echo "============================================================"
          echo ""
          echo "${PUBLIC_URL}/vnc.html"
          echo ""
          echo "============================================================"


      # ======================================================
      # LOCAL-ONLY MODE
      # ======================================================

      - name: "🖥️ Configure local desktop endpoint"

        if: ${{ !inputs.enable_cloudflare }}

        shell: bash

        run: |

          set -euo pipefail

          PUBLIC_URL="http://127.0.0.1:${NOVNC_PORT}"

          echo "OMARCHY_PUBLIC_URL=${PUBLIC_URL}" >> "${GITHUB_ENV}"

          echo "${PUBLIC_URL}/vnc.html" \
            > "${VM_DIR}/omarchy-url.txt"

          echo ""
          echo "⚠️ Cloudflare disabled."
          echo ""
          echo "noVNC is available only on the GitHub runner:"
          echo ""
          echo "  ${PUBLIC_URL}/vnc.html"
          echo ""


      # ======================================================
      # VM STATUS
      # ======================================================

      - name: "📊 Generate connection dashboard"

        shell: bash

        run: |

          set -euo pipefail

          PUBLIC_URL="${OMARCHY_PUBLIC_URL:-http://127.0.0.1:${NOVNC_PORT}}"

          QEMU_PID="$(cat "${VM_DIR}/qemu.pid" 2>/dev/null || echo "unknown")"

          NOVNC_PID="$(cat "${VM_DIR}/novnc.pid" 2>/dev/null || echo "unknown")"

          CLOUDFLARE_PID="$(cat "${VM_DIR}/cloudflared.pid" 2>/dev/null || echo "disabled")"

          cat > "${VM_DIR}/connection.txt" <<EOF
          ============================================================
                    🐧 OMARCHY CLOUD DESKTOP
          ============================================================

          OS
            Omarchy Linux ${OMARCHY_VERSION}

          Desktop
            Hyprland + Quickshell

          Virtualization
            QEMU
            Acceleration: ${QEMU_ACCEL}

          VM
            CPU:       ${VM_CPU}
            RAM:       ${VM_RAM}
            Disk:      ${VM_DISK}

          Processes
            QEMU:          ${QEMU_PID}
            noVNC:         ${NOVNC_PID}
            Cloudflared:   ${CLOUDFLARE_PID}

          ============================================================
                    🌐 WEB DESKTOP
          ============================================================

          ${PUBLIC_URL}/vnc.html

          ============================================================
                    🔐 SSH
          ============================================================

          SSH host:
            127.0.0.1

          SSH port:
            ${SSH_PORT}

          SSH user:
            omarchy

          ============================================================
                    ⏱️ SESSION
          ============================================================

          Maximum session:
            ${SESSION_HOURS} hour(s)

          ============================================================
          EOF

          cat "${VM_DIR}/connection.txt"


      # ======================================================
      # OPTIONAL DEVELOPMENT TOOLS
      # ======================================================

      - name: "🧰 Optional: prepare development tools"

        if: ${{ inputs.install_extra_tools }}

        shell: bash

        run: |

          set -euo pipefail

          #
          # This step intentionally does not SSH-install packages
          # because network availability and Omarchy boot timing
          # vary across runner environments.
          #
          # It creates a marker so the session is clearly identified.
          #

          cat > "${VM_DIR}/development-tools.txt" <<'EOF'
          Requested development environment:

          - Git
          - Python
          - Node.js
          - Neovim
          - Docker
          - Build tools

          These should be installed from inside the Omarchy
          desktop using the distro package manager or the
          Omarchy application installer.
          EOF

          echo "Development tool request recorded."


      # ======================================================
      # SESSION MONITOR
      # ======================================================

      - name: "🟢 Run interactive Omarchy session"

        shell: bash

        run: |

          set -euo pipefail

          SESSION_SECONDS=$((SESSION_HOURS * 3600))

          START="$(date +%s)"

          echo ""
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                 🐧 OMARCHY CLOUD DESKTOP                  ║"
          echo "╠════════════════════════════════════════════════════════════╣"
          echo "║                                                            ║"
          echo "║  OS       : Omarchy ${OMARCHY_VERSION}"
          echo "║  Desktop  : Hyprland + Quickshell"
          echo "║  CPU      : ${VM_CPU}"
          echo "║  RAM      : ${VM_RAM}"
          echo "║  Disk     : ${VM_DISK}"
          echo "║  QEMU     : ${QEMU_ACCEL}"
          echo "║                                                            ║"
          echo "║  🌐 WEB DESKTOP                                             ║"
          echo "║                                                            ║"
          printf "║  %-56s ║\n" "${OMARCHY_PUBLIC_URL}/vnc.html"
          echo "║                                                            ║"
          echo "║  ⏱️  Maximum session: ${SESSION_HOURS} hour(s)"
          echo "║                                                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo ""
          echo "The GitHub Actions job must remain running."
          echo "Closing this workflow will destroy the temporary VM."
          echo ""

          LAST=0

          while true; do

            NOW="$(date +%s)"

            ELAPSED=$((NOW - START))

            REMAINING=$((SESSION_SECONDS - ELAPSED))

            #
            # QEMU must remain alive.
            #

            QEMU_PID="$(cat "${VM_DIR}/qemu.pid" 2>/dev/null || true)"

            if [[ -z "${QEMU_PID}" ]] || \
               ! kill -0 "${QEMU_PID}" 2>/dev/null; then

              echo ""
              echo "❌ QEMU stopped."

              break

            fi

            #
            # Print status every 60 seconds.
            #

            if (( ELAPSED - LAST >= 60 )); then

              HOURS=$((ELAPSED / 3600))
              MINUTES=$(((ELAPSED % 3600) / 60))

              if (( REMAINING < 0 )); then
                REMAINING=0
              fi

              RHOURS=$((REMAINING / 3600))
              RMINUTES=$(((REMAINING % 3600) / 60))

              echo ""
              echo "────────────────────────────────────────────────────────────"
              echo "🟢 Omarchy session active"
              echo "   Runtime : ${HOURS}h ${MINUTES}m"
              echo "   Left    : ${RHOURS}h ${RMINUTES}m"
              echo "   Web     : ${OMARCHY_PUBLIC_URL}/vnc.html"
              echo "────────────────────────────────────────────────────────────"

              LAST="${ELAPSED}"

            fi

            if (( ELAPSED >= SESSION_SECONDS )); then

              echo ""
              echo "⏱️ Session duration reached."

              break

            fi

            sleep 5

          done


      # ======================================================
      # COLLECT QEMU SCREENSHOT
      # ======================================================

      - name: "📸 Capture final VM screenshot"

        if: always()

        shell: bash

        run: |

          set +e

          SCREENSHOT="${VM_DIR}/screenshots/final.ppm"

          if [[ -S "${VM_DIR}/qmp.sock" ]]; then

            echo '{ "execute": "qmp_capabilities" }' \
              | socat - UNIX-CONNECT:"${VM_DIR}/qmp.sock" \
              >/tmp/qmp-capabilities.txt \
              2>/dev/null

            echo '{ "execute": "screendump", "arguments": { "filename": "'"${SCREENSHOT}"'" } }' \
              | socat - UNIX-CONNECT:"${VM_DIR}/qmp.sock" \
              >/tmp/qmp-screendump.txt \
              2>/dev/null

          fi

          if [[ -f "${SCREENSHOT}" ]]; then

            echo "Screenshot captured:"
            ls -lh "${SCREENSHOT}"

          else

            echo "No QEMU screenshot available."

          fi


      # ======================================================
      # COLLECT LOGS
      # ======================================================

      - name: "📚 Collect diagnostics"

        if: always()

        shell: bash

        run: |

          set +e

          mkdir -p "${VM_DIR}/logs"

          echo "============================================================"
          echo "SYSTEM"
          echo "============================================================"

          uname -a \
            > "${VM_DIR}/logs/runner-kernel.txt"

          lscpu \
            > "${VM_DIR}/logs/runner-cpu.txt"

          free -h \
            > "${VM_DIR}/logs/runner-memory.txt"

          df -h \
            > "${VM_DIR}/logs/runner-disk.txt"

          echo "============================================================"
          echo "PROCESSES"
          echo "============================================================"

          ps aux \
            > "${VM_DIR}/logs/processes.txt"

          echo "============================================================"
          echo "NETWORK"
          echo "============================================================"

          ss -lntp \
            > "${VM_DIR}/logs/network.txt" \
            2>&1

          echo "============================================================"
          echo "QEMU"
          echo "============================================================"

          if [[ -f "${VM_DIR}/qemu.pid" ]]; then

            QEMU_PID="$(cat "${VM_DIR}/qemu.pid")"

            if kill -0 "${QEMU_PID}" 2>/dev/null; then

              echo "QEMU PID ${QEMU_PID} is running."

            else

              echo "QEMU PID ${QEMU_PID} is not running."

            fi

          fi

          echo "============================================================"
          echo "NOVNC"
          echo "============================================================"

          if [[ -f "${NOVNC_LOG}" ]]; then

            cp \
              "${NOVNC_LOG}" \
              "${VM_DIR}/logs/novnc.log"

          fi

          echo "============================================================"
          echo "CLOUDFLARE"
          echo "============================================================"

          if [[ -f "${CLOUDFLARE_LOG}" ]]; then

            cp \
              "${CLOUDFLARE_LOG}" \
              "${VM_DIR}/logs/cloudflared.log"

          fi

          echo "============================================================"
          echo "QEMU MONITOR"
          echo "============================================================"

          if [[ -S "${VM_DIR}/qemu-monitor.sock" ]]; then

            echo "info version" \
              | socat \
                - UNIX-CONNECT:"${VM_DIR}/qemu-monitor.sock" \
                > "${VM_DIR}/logs/qemu-monitor.txt" \
                2>&1 || true

          fi

          echo ""
          echo "Diagnostics collected."


      # ======================================================
      # UPLOAD ARTIFACTS
      # ======================================================

      - name: "📦 Upload Omarchy diagnostics"

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: omarchy-cloud-${{ github.run_id }}

          path: |
            omarchy-vm/connection.txt
            omarchy-vm/omarchy-url.txt
            omarchy-vm/logs/**
            omarchy-vm/screenshots/**
            omarchy-vm/*.log
            omarchy-vm/*.txt

          if-no-files-found: warn

          retention-days: 3


      # ======================================================
      # FINAL SUMMARY
      # ======================================================

      - name: "📋 Final summary"

        if: always()

        shell: bash

        run: |

          set +e

          PUBLIC_URL="${OMARCHY_PUBLIC_URL:-unavailable}"

          {
            echo ""
            echo "# 🐧 Omarchy Cloud Desktop"
            echo ""
            echo "## 🌐 Web Desktop"
            echo ""
            echo "**${PUBLIC_URL}/vnc.html**"
            echo ""
            echo "## ⚙️ VM"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Omarchy | ${OMARCHY_VERSION} |"
            echo "| CPU | ${VM_CPU} |"
            echo "| RAM | ${VM_RAM} |"
            echo "| Disk | ${VM_DISK} |"
            echo "| QEMU | ${QEMU_ACCEL} |"
            echo "| Session | ${SESSION_HOURS} hours |"
            echo ""
            echo "## 🔗 Architecture"
            echo ""
            echo '```text'
            echo "Browser"
            echo "   ↓ HTTPS"
            echo "Cloudflare Quick Tunnel"
            echo "   ↓"
            echo "noVNC"
            echo "   ↓ WebSocket"
            echo "websockify"
            echo "   ↓ VNC"
            echo "QEMU"
            echo "   ↓"
            echo "Omarchy ${OMARCHY_VERSION}"
            echo "   ↓"
            echo "Hyprland + Quickshell"
            echo '```'
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

          echo ""
          echo "============================================================"
          echo "🐧 OMARCHY CLOUD DESKTOP FINISHED"
          echo "============================================================"
          echo ""
          echo "Web:"
          echo "${PUBLIC_URL}/vnc.html"
          echo ""
          echo "Artifacts:"
          echo "omarchy-cloud-${{ github.run_id }}"
          echo ""
          echo "============================================================"


      # ======================================================
      # CLEANUP
      # ======================================================

      - name: "🧹 Shutdown VM and cleanup"

        if: always()

        shell: bash

        run: |

          set +e

          echo ""
          echo "============================================================"
          echo "🧹 SHUTTING DOWN OMARCHY"
          echo "============================================================"
          echo ""

          #
          # Graceful QEMU shutdown.
          #

          if [[ -S "${VM_DIR}/qmp.sock" ]]; then

            echo '{ "execute": "qmp_capabilities" }' \
              | socat \
                - UNIX-CONNECT:"${VM_DIR}/qmp.sock" \
                >/dev/null \
                2>&1 || true

            echo '{ "execute": "system_powerdown" }' \
              | socat \
                - UNIX-CONNECT:"${VM_DIR}/qmp.sock" \
                >/dev/null \
                2>&1 || true

            sleep 5

          fi

          #
          # Kill processes if still running.
          #

          if [[ -f "${VM_DIR}/qemu.pid" ]]; then

            QEMU_PID="$(cat "${VM_DIR}/qemu.pid")"

            kill "${QEMU_PID}" \
              >/dev/null \
              2>&1 || true

          fi

          if [[ -f "${VM_DIR}/novnc.pid" ]]; then

            NOVNC_PID="$(cat "${VM_DIR}/novnc.pid")"

            kill "${NOVNC_PID}" \
              >/dev/null \
              2>&1 || true

          fi

          if [[ -f "${VM_DIR}/cloudflared.pid" ]]; then

            CLOUDFLARE_PID="$(cat "${VM_DIR}/cloudflared.pid")"

            kill "${CLOUDFLARE_PID}" \
              >/dev/null \
              2>&1 || true

          fi

          pkill -f "qemu-system-x86_64.*omarchy" \
            >/dev/null \
            2>&1 || true

          pkill -f "websockify.*${NOVNC_PORT}" \
            >/dev/null \
            2>&1 || true

          pkill -f "cloudflared tunnel" \
            >/dev/null \
            2>&1 || true

          sync

          echo ""
          echo "✅ VM stopped."
          echo "✅ Cloudflare tunnel stopped."
          echo "✅ noVNC stopped."
          echo "✅ Workspace cleanup complete."
          echo ""
