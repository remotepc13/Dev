name: "🚀 MT5 Cloud Desktop"

run-name: "MT5 Cloud Desktop • ${{ inputs.session_minutes }} min • ${{ inputs.resolution }}"

on:
  workflow_dispatch:
    inputs:

      resolution:
        description: "🖥️ Desktop Resolution"
        required: true
        type: choice
        default: "1920x1080"
        options:
          - "1920x1080"
          - "1600x900"
          - "1280x720"

      session_minutes:
        description: "⏱️ Session Duration"
        required: true
        type: choice
        default: "60"
        options:
          - "15"
          - "30"
          - "60"
          - "120"
          - "180"
          - "300"

      enable_tunnel:
        description: "🌐 Enable Public Cloudflare URL"
        required: true
        type: boolean
        default: true

      save_artifacts:
        description: "📦 Save diagnostics/logs"
        required: true
        type: boolean
        default: true

      clean_workspace:
        description: "🧹 Delete previous MT5 data before start"
        required: true
        type: boolean
        default: false


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:

  # ----------------------------------------------------------
  # Container
  # ----------------------------------------------------------

  CONTAINER_NAME: "mt5-cloud"

  MT5_IMAGE: "gmag11/metatrader5_vnc:latest"

  MT5_WEB_PORT: "3000"
  MT5_API_PORT: "8001"

  MT5_WEB_BIND: "127.0.0.1"
  MT5_API_BIND: "127.0.0.1"

  TZ: "UTC"


  # ----------------------------------------------------------
  # KasmVNC LOGIN
  #
  # TEST CREDENTIALS ONLY
  # ----------------------------------------------------------

  MT5_WEB_USER: "trader"
  MT5_WEB_PASSWORD: "MT5-Demo-2026-StrongPassword!"


  # ----------------------------------------------------------
  # Runtime paths
  # ----------------------------------------------------------

  LOG_DIR: "${{ github.workspace }}/logs"

  TUNNEL_DIR: "${{ github.workspace }}/tunnel"

  MT5_DATA_DIR: "${{ github.workspace }}/mt5_data"

  CLOUDFLARE_LOG: "${{ github.workspace }}/tunnel/cloudflared.log"


  # ----------------------------------------------------------
  # GitHub Actions Node runtime
  # ----------------------------------------------------------

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: mt5-cloud-desktop
  cancel-in-progress: false


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# JOB
# ============================================================

jobs:

  mt5-cloud-desktop:

    name: "🖥️ MT5 Cloud Desktop"

    runs-on: ubuntu-24.04

    timeout-minutes: 360


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # 1. RUNNER INFORMATION
      # ======================================================

      - name: "🔍 Runner Diagnostics"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=================================================="
          echo "RUNNER INFORMATION"
          echo "=================================================="

          echo
          echo "OS:"
          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Docker:"
          docker version

          echo
          echo "Docker info:"
          docker info \
            --format 'Driver={{.Driver}} | RootDir={{.DockerRootDir}}' \
            || true

          echo
          echo "=================================================="


      # ======================================================
      # 2. VERIFY AMD64
      # ======================================================

      - name: "🧬 Verify AMD64 Architecture"
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCH="$(uname -m)"

          echo "Detected architecture: ${ARCH}"

          if [[ "${ARCH}" != "x86_64" ]]; then
            echo
            echo "❌ ERROR"
            echo "This MT5 image requires AMD64/x86_64."
            exit 1
          fi

          echo
          echo "✅ AMD64 confirmed."


      # ======================================================
      # 3. VALIDATE CONFIG
      # ======================================================

      - name: "🔐 Validate Configuration"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=================================================="
          echo "MT5 CONFIGURATION"
          echo "=================================================="

          echo
          echo "Container:"
          echo "${CONTAINER_NAME}"

          echo
          echo "Image:"
          echo "${MT5_IMAGE}"

          echo
          echo "Resolution:"
          echo "${{ inputs.resolution }}"

          echo
          echo "Session:"
          echo "${{ inputs.session_minutes }} minutes"

          echo
          echo "Web username:"
          echo "${MT5_WEB_USER}"

          echo
          echo "Web password:"
          echo "${MT5_WEB_PASSWORD}"

          echo
          echo "Cloudflare:"
          echo "${{ inputs.enable_tunnel }}"

          echo
          echo "Artifacts:"
          echo "${{ inputs.save_artifacts }}"

          echo
          echo "Clean workspace:"
          echo "${{ inputs.clean_workspace }}"

          echo
          echo "=================================================="

          if [[ -z "${MT5_WEB_USER}" ]]; then
            echo "❌ MT5_WEB_USER is empty."
            exit 1
          fi

          if [[ -z "${MT5_WEB_PASSWORD}" ]]; then
            echo "❌ MT5_WEB_PASSWORD is empty."
            exit 1
          fi

          if (( ${#MT5_WEB_PASSWORD} < 8 )); then
            echo "❌ Password must contain at least 8 characters."
            exit 1
          fi

          echo
          echo "✅ Configuration is valid."


      # ======================================================
      # 4. INSTALL HOST DEPENDENCIES
      # ======================================================

      - name: "📦 Install Host Dependencies"
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ca-certificates \
            jq \
            netcat-openbsd \
            procps \
            unzip

          echo
          echo "Dependency installation complete."


      # ======================================================
      # 5. INSTALL CLOUDFLARED
      # ======================================================

      - name: "☁️ Install Cloudflared"
        if: ${{ inputs.enable_tunnel }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Installing cloudflared..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb" \
            --output /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          rm -f /tmp/cloudflared.deb

          echo
          echo "Cloudflared:"
          cloudflared --version


      # ======================================================
      # 6. PREPARE DIRECTORIES
      # ======================================================

      - name: "📁 Prepare Workspace"
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p \
            "${MT5_DATA_DIR}" \
            "${LOG_DIR}" \
            "${TUNNEL_DIR}"

          chmod 700 \
            "${MT5_DATA_DIR}" \
            "${LOG_DIR}" \
            "${TUNNEL_DIR}"

          echo "Workspace prepared."

          echo
          ls -la "${GITHUB_WORKSPACE}"


      # ======================================================
      # 7. OPTIONAL CLEAN
      # ======================================================

      - name: "🧹 Clean MT5 Workspace"
        if: ${{ inputs.clean_workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Removing previous MT5 data..."

          rm -rf \
            "${MT5_DATA_DIR}" \
            "${LOG_DIR}" \
            "${TUNNEL_DIR}"

          mkdir -p \
            "${MT5_DATA_DIR}" \
            "${LOG_DIR}" \
            "${TUNNEL_DIR}"

          chmod 700 \
            "${MT5_DATA_DIR}" \
            "${LOG_DIR}" \
            "${TUNNEL_DIR}"

          echo "✅ Workspace cleaned."


      # ======================================================
      # 8. REMOVE STALE CONTAINER
      # ======================================================

      - name: "🗑️ Remove Previous Container"
        shell: bash
        run: |
          set -Eeuo pipefail

          if docker container inspect \
            "${CONTAINER_NAME}" \
            >/dev/null 2>&1; then

            echo "Removing stale container..."

            docker rm \
              --force \
              "${CONTAINER_NAME}" \
              || true

          else

            echo "No stale container found."

          fi


      # ======================================================
      # 9. PULL IMAGE
      # ======================================================

      - name: "🐳 Pull MetaTrader 5 Image"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=================================================="
          echo "PULL MT5 IMAGE"
          echo "=================================================="

          echo
          echo "Image:"
          echo "${MT5_IMAGE}"

          echo

          docker pull "${MT5_IMAGE}"

          echo
          echo "=================================================="
          echo "IMAGE DETAILS"
          echo "=================================================="

          docker image inspect "${MT5_IMAGE}" \
            --format 'ID={{.Id}}'

          docker image inspect "${MT5_IMAGE}" \
            --format 'Created={{.Created}}'

          docker image inspect "${MT5_IMAGE}" \
            --format 'Architecture={{.Architecture}}'

          docker image inspect "${MT5_IMAGE}" \
            --format 'OS={{.Os}}'

          docker image inspect "${MT5_IMAGE}" \
            --format 'Size={{.Size}} bytes'

          echo
          docker images "${MT5_IMAGE}"


      # ======================================================
      # 10. START MT5
      #
      # IMPORTANT:
      # NO --init HERE.
      #
      # The image uses s6-overlay and /init MUST be PID 1.
      # ======================================================

      - name: "🚀 Start MetaTrader 5"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=================================================="
          echo "STARTING METATRADER 5"
          echo "=================================================="

          docker run \
            --detach \
            --name "${CONTAINER_NAME}" \
            --shm-size=2g \
            --stop-timeout=15 \
            \
            --label "project=mt5-cloud-desktop" \
            --label "managed-by=github-actions" \
            --label "github-run-id=${GITHUB_RUN_ID}" \
            \
            --env "CUSTOM_USER=${MT5_WEB_USER}" \
            --env "PASSWORD=${MT5_WEB_PASSWORD}" \
            --env "DISPLAY_RESOLUTION=${{ inputs.resolution }}" \
            --env "TZ=${TZ}" \
            \
            --volume "${MT5_DATA_DIR}:/config" \
            \
            --publish "${MT5_WEB_BIND}:${MT5_WEB_PORT}:3000" \
            --publish "${MT5_API_BIND}:${MT5_API_PORT}:8001" \
            \
            "${MT5_IMAGE}"

          echo
          echo "✅ Container started."

          echo
          echo "Container ID:"
          docker inspect \
            --format '{{.Id}}' \
            "${CONTAINER_NAME}"

          echo
          echo "Entrypoint:"
          docker inspect \
            --format '{{json .Config.Entrypoint}}' \
            "${CONTAINER_NAME}"

          echo
          echo "Command:"
          docker inspect \
            --format '{{json .Config.Cmd}}' \
            "${CONTAINER_NAME}"

          echo
          echo "PID:"
          docker inspect \
            --format '{{.State.Pid}}' \
            "${CONTAINER_NAME}"

          echo
          echo "Status:"
          docker inspect \
            --format '{{.State.Status}}' \
            "${CONTAINER_NAME}"


      # ======================================================
      # 11. VERIFY PID 1
      # ======================================================

      - name: "🧩 Verify Container PID 1"
        shell: bash
        run: |
          set -Eeuo pipefail

          PID="$(
            docker inspect \
              --format '{{.State.Pid}}' \
              "${CONTAINER_NAME}"
          )"

          echo "Container host PID: ${PID}"

          if [[ -z "${PID}" || "${PID}" == "0" ]]; then
            echo "❌ Container does not have a valid PID."
            docker logs "${CONTAINER_NAME}" 2>&1 || true
            exit 1
          fi

          echo
          echo "Container process tree:"

          docker top "${CONTAINER_NAME}" \
            -eo pid,ppid,user,args \
            || true

          echo
          echo "Container PID is valid."


      # ======================================================
      # 12. WAIT FOR WEB DESKTOP
      # ======================================================

      - name: "⏳ Wait for MT5 Desktop"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Waiting for MT5/KasmVNC..."

          MAX_ATTEMPTS=180
          ATTEMPT=0

          while (( ATTEMPT < MAX_ATTEMPTS )); do

            ATTEMPT=$((ATTEMPT + 1))

            # ----------------------------------------------
            # Container must remain alive
            # ----------------------------------------------

            RUNNING="$(
              docker inspect \
                --format '{{.State.Running}}' \
                "${CONTAINER_NAME}" \
                2>/dev/null \
                || echo "false"
            )"

            if [[ "${RUNNING}" != "true" ]]; then

              echo
              echo "❌ Container stopped."

              echo
              echo "Container state:"
              docker inspect \
                "${CONTAINER_NAME}" \
                2>&1 || true

              echo
              echo "Container logs:"
              docker logs \
                --tail 300 \
                "${CONTAINER_NAME}" \
                2>&1 || true

              exit 1
            fi


            # ----------------------------------------------
            # Check KasmVNC TCP port
            # ----------------------------------------------

            if nc -z \
              "${MT5_WEB_BIND}" \
              "${MT5_WEB_PORT}" \
              >/dev/null 2>&1; then

              echo
              echo "✅ MT5 web port is ready."
              break

            fi


            # ----------------------------------------------
            # Periodic logs
            # ----------------------------------------------

            if (( ATTEMPT % 15 == 0 )); then

              echo
              echo "Still waiting..."
              echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}"

              echo
              echo "Recent container logs:"

              docker logs \
                --tail 50 \
                "${CONTAINER_NAME}" \
                2>&1 || true

            fi

            sleep 2

          done


          # ==================================================
          # FINAL CHECK
          # ==================================================

          if ! nc -z \
            "${MT5_WEB_BIND}" \
            "${MT5_WEB_PORT}" \
            >/dev/null 2>&1; then

            echo
            echo "❌ MT5 web service failed to start."

            echo
            echo "Last 300 lines:"

            docker logs \
              --tail 300 \
              "${CONTAINER_NAME}" \
              2>&1 || true

            exit 1
          fi

          echo
          echo "🎉 MT5 Desktop is ready."


      # ======================================================
      # 13. VERIFY API
      # ======================================================

      - name: "🐍 Verify MT5 Python RPyC"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking MT5 RPyC service..."

          if nc -z \
            "${MT5_API_BIND}" \
            "${MT5_API_PORT}" \
            >/dev/null 2>&1; then

            echo
            echo "✅ Port ${MT5_API_PORT} is listening."

          else

            echo
            echo "⚠️ RPyC port ${MT5_API_PORT} is not available yet."

            echo
            echo "Recent logs:"

            docker logs \
              --tail 100 \
              "${CONTAINER_NAME}" \
              2>&1 || true

            echo
            echo "Continuing because the web desktop is available."

          fi


      # ======================================================
      # 14. LOCAL HTTP CHECK
      # ======================================================

      - name: "🌐 Verify Local Web Interface"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking local HTTP endpoint..."

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 10 \
              "http://${MT5_WEB_BIND}:${MT5_WEB_PORT}/" \
              || true
          )"

          echo
          echo "HTTP status: ${HTTP_CODE}"

          case "${HTTP_CODE}" in
            2*|3*|401|403)
              echo "✅ Web server is responding."
              ;;
            *)
              echo "⚠️ Unexpected HTTP response."
              ;;
          esac


      # ======================================================
      # 15. CLOUDFLARE TUNNEL
      # ======================================================

      - name: "☁️ Start Cloudflare Quick Tunnel"
        if: ${{ inputs.enable_tunnel }}
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f \
            "${CLOUDFLARE_LOG}" \
            "${TUNNEL_DIR}/cloudflared.pid" \
            "${TUNNEL_DIR}/tunnel_url.txt"

          echo "Starting Cloudflare Quick Tunnel..."

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url "http://${MT5_WEB_BIND}:${MT5_WEB_PORT}" \
            > "${CLOUDFLARE_LOG}" 2>&1 &

          CLOUDFLARED_PID=$!

          echo "${CLOUDFLARED_PID}" \
            > "${TUNNEL_DIR}/cloudflared.pid"

          echo
          echo "Cloudflared PID:"
          echo "${CLOUDFLARED_PID}"

          echo
          echo "Waiting for public URL..."

          TUNNEL_URL=""

          for i in $(seq 1 60); do

            if [[ -f "${CLOUDFLARE_LOG}" ]]; then

              TUNNEL_URL="$(
                grep -Eo \
                  'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                  "${CLOUDFLARE_LOG}" \
                  | head -n 1 \
                  || true
              )"

            fi

            if [[ -n "${TUNNEL_URL}" ]]; then
              break
            fi

            if ! kill -0 \
              "${CLOUDFLARED_PID}" \
              2>/dev/null; then

              echo
              echo "❌ Cloudflared stopped unexpectedly."

              cat \
                "${CLOUDFLARE_LOG}" \
                2>/dev/null || true

              exit 1
            fi

            sleep 2

          done


          if [[ -z "${TUNNEL_URL}" ]]; then

            echo
            echo "❌ Could not detect Cloudflare URL."

            echo
            echo "Cloudflare log:"

            cat \
              "${CLOUDFLARE_LOG}" \
              2>/dev/null || true

            exit 1
          fi


          printf '%s\n' \
            "${TUNNEL_URL}" \
            > "${TUNNEL_DIR}/tunnel_url.txt"


          echo
          echo "=================================================="
          echo "🌐 PUBLIC MT5 DESKTOP"
          echo "=================================================="

          echo
          echo "${TUNNEL_URL}"

          echo
          echo "=================================================="


      # ======================================================
      # 16. VERIFY CLOUDFLARE
      # ======================================================

      - name: "🔗 Verify Public Tunnel"
        if: ${{ inputs.enable_tunnel }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TUNNEL_URL="$(
            cat "${TUNNEL_DIR}/tunnel_url.txt"
          )"

          echo "Public URL:"
          echo "${TUNNEL_URL}"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 20 \
              "${TUNNEL_URL}/" \
              || true
          )"

          echo
          echo "Public HTTP status:"
          echo "${HTTP_CODE}"

          case "${HTTP_CODE}" in
            2*|3*|401|403)
              echo "✅ Public tunnel is reachable."
              ;;
            *)
              echo "⚠️ Unexpected tunnel response."
              ;;
          esac


      # ======================================================
      # 17. CONNECTION INFORMATION
      # ======================================================

      - name: "📋 Connection Information"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=================================================="
          echo "             🚀 MT5 CLOUD DESKTOP"
          echo "=================================================="

          echo
          echo "🖥️ Resolution:"
          echo "${{ inputs.resolution }}"

          echo
          echo "⏱️ Session:"
          echo "${{ inputs.session_minutes }} minutes"

          echo
          echo "👤 Username:"
          echo "${MT5_WEB_USER}"

          echo
          echo "🔑 Password:"
          echo "${MT5_WEB_PASSWORD}"

          echo
          echo "🏠 Local Desktop:"
          echo "http://127.0.0.1:${MT5_WEB_PORT}"

          echo
          echo "🐍 Python / RPyC:"
          echo "127.0.0.1:${MT5_API_PORT}"

          if [[ "${{ inputs.enable_tunnel }}" == "true" ]] \
            && [[ -f "${TUNNEL_DIR}/tunnel_url.txt" ]]; then

            TUNNEL_URL="$(
              cat "${TUNNEL_DIR}/tunnel_url.txt"
            )"

            echo
            echo "🌐 Public Desktop:"
            echo "${TUNNEL_URL}"

          fi

          echo
          echo "=================================================="


      # ======================================================
      # 18. GITHUB SUMMARY
      # ======================================================

      - name: "📝 GitHub Step Summary"
        shell: bash
        run: |
          set -Eeuo pipefail

          {

            echo "# 🚀 MT5 Cloud Desktop"
            echo

            echo "## Configuration"
            echo

            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Resolution | \`${{ inputs.resolution }}\` |"
            echo "| Duration | \`${{ inputs.session_minutes }} minutes\` |"
            echo "| Image | \`${MT5_IMAGE}\` |"
            echo "| Username | \`${MT5_WEB_USER}\` |"
            echo "| Password | \`${MT5_WEB_PASSWORD}\` |"
            echo

            echo "## Desktop"
            echo

            echo "\`http://127.0.0.1:${MT5_WEB_PORT}\`"
            echo

            if [[ "${{ inputs.enable_tunnel }}" == "true" ]] \
              && [[ -f "${TUNNEL_DIR}/tunnel_url.txt" ]]; then

              TUNNEL_URL="$(
                cat "${TUNNEL_DIR}/tunnel_url.txt"
              )"

              echo "## 🌐 Public Desktop"
              echo
              echo "[Open MT5 Cloud Desktop](${TUNNEL_URL})"
              echo

            fi

            echo "## Python API"
            echo
            echo "\`127.0.0.1:${MT5_API_PORT}\`"
            echo

            echo "## Architecture"
            echo
            echo '```text'
            echo "Browser"
            echo "   ↓"
            echo "Cloudflare Tunnel"
            echo "   ↓"
            echo "KasmVNC :3000"
            echo "   ↓"
            echo "Linux / Wine"
            echo "   ↓"
            echo "MetaTrader 5"
            echo
            echo "Python"
            echo "   ↓"
            echo "RPyC :8001"
            echo "   ↓"
            echo "MetaTrader 5"
            echo '```'
            echo

          } >> "${GITHUB_STEP_SUMMARY}"


      # ======================================================
      # 19. SESSION MONITOR
      # ======================================================

      - name: "⏱️ Monitor MT5 Session"
        shell: bash
        run: |
          set -Eeuo pipefail

          SESSION_SECONDS=$(
            ( ${{ inputs.session_minutes }} * 60 )
          )

          START_TIME="$(date +%s)"

          END_TIME=$(
            ( START_TIME + SESSION_SECONDS )
          )

          echo
          echo "=================================================="
          echo "SESSION MONITOR"
          echo "=================================================="

          echo
          echo "Duration:"
          echo "${{ inputs.session_minutes }} minutes"

          echo

          while true; do

            NOW="$(date +%s)"

            if (( NOW >= END_TIME )); then

              echo
              echo "⏰ Session completed."

              break

            fi


            RUNNING="$(
              docker inspect \
                --format '{{.State.Running}}' \
                "${CONTAINER_NAME}" \
                2>/dev/null \
                || echo "false"
            )"


            if [[ "${RUNNING}" != "true" ]]; then

              echo
              echo "❌ MT5 container stopped unexpectedly."

              echo
              echo "Recent logs:"

              docker logs \
                --tail 150 \
                "${CONTAINER_NAME}" \
                2>&1 || true

              exit 1

            fi


            REMAINING=$(
              ( END_TIME - NOW )
            )

            MINUTES=$(
              ( REMAINING / 60 )
            )

            SECONDS=$(
              ( REMAINING % 60 )
            )

            echo \
              "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Remaining: ${MINUTES}m ${SECONDS}s"

            sleep 30

          done

          echo
          echo "✅ MT5 session finished normally."


      # ======================================================
      # 20. COLLECT DIAGNOSTICS
      # ALWAYS RUN
      # ======================================================

      - name: "🧪 Collect Diagnostics"
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          mkdir -p "${LOG_DIR}"

          echo "Collecting diagnostics..."


          # --------------------------------------------------
          # System
          # --------------------------------------------------

          {
            echo "=============================================="
            echo "DATE"
            date -u

            echo
            echo "OS"
            cat /etc/os-release

            echo
            echo "KERNEL"
            uname -a

            echo
            echo "ARCH"
            uname -m

            echo
            echo "CPU"
            nproc

            echo
            echo "MEMORY"
            free -h

            echo
            echo "DISK"
            df -h

          } > "${LOG_DIR}/system.txt" 2>&1


          # --------------------------------------------------
          # Docker PS
          # --------------------------------------------------

          {
            echo "=============================================="
            docker ps -a

          } > "${LOG_DIR}/docker-ps.txt" 2>&1


          # --------------------------------------------------
          # Docker images
          # --------------------------------------------------

          {
            echo "=============================================="
            docker images

          } > "${LOG_DIR}/docker-images.txt" 2>&1


          # --------------------------------------------------
          # Container inspect
          # --------------------------------------------------

          if docker container inspect \
            "${CONTAINER_NAME}" \
            > "${LOG_DIR}/container-inspect.json" \
            2>&1; then

            true

          fi


          # --------------------------------------------------
          # Container logs
          # --------------------------------------------------

          docker logs \
            --timestamps \
            "${CONTAINER_NAME}" \
            > "${LOG_DIR}/mt5-container.log" \
            2>&1


          # --------------------------------------------------
          # Docker stats
          # --------------------------------------------------

          docker stats \
            --no-stream \
            "${CONTAINER_NAME}" \
            > "${LOG_DIR}/docker-stats.txt" \
            2>&1


          # --------------------------------------------------
          # Cloudflare
          # --------------------------------------------------

          if [[ -f "${CLOUDFLARE_LOG}" ]]; then

            cp \
              "${CLOUDFLARE_LOG}" \
              "${LOG_DIR}/cloudflared.log"

          fi


          # --------------------------------------------------
          # Tunnel URL
          # --------------------------------------------------

          if [[ -f "${TUNNEL_DIR}/tunnel_url.txt" ]]; then

            cp \
              "${TUNNEL_DIR}/tunnel_url.txt" \
              "${LOG_DIR}/tunnel_url.txt"

          fi


          echo
          echo "Diagnostics files:"

          find "${LOG_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            2>/dev/null || true


      # ======================================================
      # 21. UPLOAD ARTIFACTS
      # ======================================================

      - name: "📦 Upload Diagnostics"
        if: ${{ always() && inputs.save_artifacts }}
        uses: actions/upload-artifact@v5
        with:
          name: "mt5-cloud-diagnostics-${{ github.run_number }}"
          path: |
            ${{ github.workspace }}/logs/**
            ${{ github.workspace }}/tunnel/**
          if-no-files-found: warn
          retention-days: 7


      # ======================================================
      # 22. STOP CLOUDFLARE
      # ======================================================

      - name: "🛑 Stop Cloudflare Tunnel"
        if: ${{ always() && inputs.enable_tunnel }}
        shell: bash
        run: |
          set +e

          if [[ -f "${TUNNEL_DIR}/cloudflared.pid" ]]; then

            PID="$(
              cat "${TUNNEL_DIR}/cloudflared.pid"
            )"

            echo "Stopping cloudflared PID: ${PID}"

            kill "${PID}" \
              2>/dev/null \
              || true

            sleep 2

            kill -9 "${PID}" \
              2>/dev/null \
              || true

          fi

          pkill -f "cloudflared tunnel" \
            2>/dev/null \
            || true

          echo "Cloudflare stopped."


      # ======================================================
      # 23. STOP MT5
      # ======================================================

      - name: "🛑 Stop MetaTrader 5"
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          echo "Stopping MT5 container..."

          if docker container inspect \
            "${CONTAINER_NAME}" \
            >/dev/null 2>&1; then

            docker stop \
              --timeout 15 \
              "${CONTAINER_NAME}" \
              2>/dev/null \
              || true

            docker rm \
              "${CONTAINER_NAME}" \
              2>/dev/null \
              || true

          fi

          echo "MT5 cleanup complete."


      # ======================================================
      # 24. FINAL DOCKER CLEANUP
      # ======================================================

      - name: "🧹 Final Docker Cleanup"
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          echo "Cleaning unused Docker resources..."

          docker container prune \
            --force \
            2>/dev/null \
            || true

          docker network prune \
            --force \
            2>/dev/null \
            || true

          echo
          echo "Final containers:"

          docker ps -a \
            2>/dev/null \
            || true

          echo
          echo "Final disk usage:"

          df -h / \
            2>/dev/null \
            || true


      # ======================================================
      # 25. FINAL STATUS
      # ======================================================

      - name: "🏁 Final Status"
        if: ${{ always() }}
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "             🚀 MT5 CLOUD DESKTOP"
          echo "=================================================="

          echo
          echo "Workflow:"
          echo "${{ github.workflow }}"

          echo
          echo "Run:"
          echo "${{ github.run_number }}"

          echo
          echo "Job status:"
          echo "${{ job.status }}"

          echo
          echo "=================================================="

          if [[ "${{ job.status }}" == "success" ]]; then

            echo
            echo "✅ MT5 Cloud Desktop completed successfully."

          else

            echo
            echo "❌ MT5 Cloud Desktop failed."

            echo
            echo "Check the diagnostics artifact and MT5 container log."

          fi

          echo
          echo "=================================================="
