name: "🚀 MT5 Cloud Desktop"

run-name: "MT5 Cloud Desktop • ${{ inputs.session_minutes }} min • ${{ inputs.resolution }}"

on:
  workflow_dispatch:
    inputs:

      resolution:
        description: "🖥️ Desktop resolution"
        required: true
        type: choice
        default: "1920x1080"
        options:
          - "1920x1080"
          - "1600x900"
          - "1280x720"

      session_minutes:
        description: "⏱️ Session duration"
        required: true
        type: choice
        default: "60"
        options:
          - "15"
          - "30"
          - "60"
          - "120"
          - "180"
          - "300"

      enable_tunnel:
        description: "🌐 Enable Cloudflare public URL"
        required: true
        type: boolean
        default: true

      save_artifacts:
        description: "📦 Save diagnostics artifact"
        required: true
        type: boolean
        default: true

      clean_workspace:
        description: "🧹 Delete previous MT5 workspace before start"
        required: true
        type: boolean
        default: false


# ============================================================
# Global Environment
# ============================================================

env:

  # ----------------------------------------------------------
  # Docker
  # ----------------------------------------------------------

  CONTAINER_NAME: "mt5-cloud"

  MT5_IMAGE: "gmag11/metatrader5_vnc:latest"


  # ----------------------------------------------------------
  # KasmVNC
  # ----------------------------------------------------------

  MT5_WEB_BIND: "127.0.0.1"
  MT5_WEB_PORT: "3000"


  # ----------------------------------------------------------
  # mt5linux / RPyC
  # ----------------------------------------------------------

  MT5_API_BIND: "127.0.0.1"
  MT5_API_PORT: "8001"


  # ----------------------------------------------------------
  # KasmVNC credentials
  #
  # DEMO ONLY.
  # Do not use this password for real sensitive environments.
  # ----------------------------------------------------------

  MT5_WEB_USER: "trader"
  MT5_WEB_PASSWORD: "MT5-Demo-2026-StrongPassword!"


  # ----------------------------------------------------------
  # Runtime
  # ----------------------------------------------------------

  TZ: "UTC"

  TCP_TIMEOUT_SECONDS: "120"
  HTTP_TIMEOUT_SECONDS: "120"
  TUNNEL_TIMEOUT_SECONDS: "120"

  HEALTH_INTERVAL_SECONDS: "3"

  PUBLIC_HTTP_TIMEOUT_SECONDS: "20"


  # ----------------------------------------------------------
  # Workspace
  # ----------------------------------------------------------

  LOG_DIR: "${{ github.workspace }}/logs"
  TUNNEL_DIR: "${{ github.workspace }}/tunnel"
  MT5_DATA_DIR: "${{ github.workspace }}/mt5_data"

  CLOUDFLARE_LOG: "${{ github.workspace }}/tunnel/cloudflared.log"
  TUNNEL_URL_FILE: "${{ github.workspace }}/tunnel/tunnel_url.txt"


  # ----------------------------------------------------------
  # GitHub Actions
  # ----------------------------------------------------------

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


# ============================================================
# Permissions
# ============================================================

permissions:
  contents: read


# ============================================================
# Concurrency
# ============================================================

concurrency:
  group: mt5-cloud-desktop
  cancel-in-progress: false


# ============================================================
# Job
# ============================================================

jobs:

  mt5-cloud-desktop:

    runs-on: ubuntu-24.04

    timeout-minutes: 360


    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: "📥 Checkout repository"

        uses: actions/checkout@v5


      # ======================================================
      # Validate launcher
      # ======================================================

      - name: "🔧 Prepare MT5 launcher"

        shell: bash

        run: |

          set -Eeuo pipefail

          SCRIPT="${GITHUB_WORKSPACE}/mt5.sh"


          if [[ ! -f "${SCRIPT}" ]]; then

            echo "❌ mt5.sh was not found."

            echo
            echo "Expected:"
            echo "${SCRIPT}"

            exit 1

          fi


          chmod +x "${SCRIPT}"


          echo "✅ mt5.sh found."

          echo "Path: ${SCRIPT}"

          echo
          echo "Bash version:"

          bash --version | head -n 1


          echo
          echo "Syntax check:"

          bash -n "${SCRIPT}"

          echo "✅ Bash syntax is valid."


      # ======================================================
      # Start MT5
      # ======================================================

      - name: "🚀 Start MT5 Cloud Desktop"

        shell: bash

        env:

          INPUT_RESOLUTION: "${{ inputs.resolution }}"

          INPUT_SESSION_MINUTES: "${{ inputs.session_minutes }}"

          INPUT_ENABLE_TUNNEL: "${{ inputs.enable_tunnel }}"

          INPUT_SAVE_ARTIFACTS: "${{ inputs.save_artifacts }}"

          INPUT_CLEAN_WORKSPACE: "${{ inputs.clean_workspace }}"

        run: |

          set -Eeuo pipefail

          "${GITHUB_WORKSPACE}/mt5.sh"


      # ======================================================
      # Diagnostics Artifact
      # ======================================================

      - name: "📦 Upload diagnostics"

        if: ${{ always() && inputs.save_artifacts }}

        uses: actions/upload-artifact@v5

        with:

          name: "mt5-cloud-diagnostics-${{ github.run_id }}"

          path: |

            logs/
            tunnel/

          if-no-files-found: warn

          retention-days: 3


      # ======================================================
      # Final Status
      # ======================================================

      - name: "🏁 Final status"

        if: always()

        shell: bash

        run: |

          echo

          echo "============================================================"

          echo "🏁 MT5 Cloud Desktop workflow finished"

          echo "============================================================"

          echo

          echo "Run ID       : ${GITHUB_RUN_ID}"

          echo "Resolution   : ${{ inputs.resolution }}"

          echo "Duration     : ${{ inputs.session_minutes }} minutes"

          echo "Tunnel       : ${{ inputs.enable_tunnel }}"

          echo "Artifacts    : ${{ inputs.save_artifacts }}"

          echo "Clean data   : ${{ inputs.clean_workspace }}"

          echo

          echo "============================================================"
