name: "🚀 MT5 Cloud Desktop"

run-name: "MT5 • ${{ inputs.resolution }} • ${{ inputs.session_minutes }} min"

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: "Desktop resolution"
        required: true
        type: choice
        options:
          - "1920x1080"
          - "1600x900"
          - "1280x720"
        default: "1920x1080"

      session_minutes:
        description: "Session duration (maximum 300 minutes)"
        required: true
        type: choice
        options:
          - "15"
          - "30"
          - "60"
          - "120"
          - "180"
          - "300"
        default: "60"

      enable_tunnel:
        description: "Expose KasmVNC through Cloudflare Quick Tunnel"
        required: true
        type: boolean
        default: true

      save_artifacts:
        description: "Upload runtime diagnostics"
        required: true
        type: boolean
        default: true

      clean_workspace:
        description: "Delete session-local MT5 data before start"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mt5-cloud-desktop
  cancel-in-progress: false

env:
  # ------------------------------------------------------------
  # Container
  # ------------------------------------------------------------
  CONTAINER_NAME: mt5-cloud

  # Current upstream release 2.3
  MT5_IMAGE: ghcr.io/gmag11/metatrader5-docker:2.3

  # ------------------------------------------------------------
  # Network
  # ------------------------------------------------------------
  # Keep both ports private on the GitHub runner.
  # Only KasmVNC :3000 is exposed through Cloudflare.
  MT5_WEB_BIND: 127.0.0.1
  MT5_WEB_PORT: 3000

  MT5_API_BIND: 127.0.0.1
  MT5_API_PORT: 8001

  # ------------------------------------------------------------
  # KasmVNC login
  # Demo-only password.
  # Do NOT use broker credentials here.
  # ------------------------------------------------------------
  MT5_WEB_USER: trader
  MT5_WEB_PASSWORD: "MT5-Demo-2026-StrongPassword!"

  # ------------------------------------------------------------
  # Runtime timeouts
  # ------------------------------------------------------------
  MT5_TCP_TIMEOUT: 120
  MT5_HTTP_TIMEOUT: 180
  MT5_TUNNEL_TIMEOUT: 120
  MT5_CHECK_INTERVAL: 3

jobs:
  mt5:
    name: "MT5 Cloud Desktop"

    # Current GitHub-hosted Ubuntu runner requested
    runs-on: ubuntu-24.04

    # Safety margin for:
    # image pull + Wine/MT5 first-run + session
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: "📥 Checkout"
        uses: actions/checkout@v5

      # ==========================================================
      # 2. Validate files BEFORE touching Docker
      # ==========================================================
      - name: "🔎 Validate"
        shell: bash
        run: |
          set -Eeuo pipefail

          SCRIPT="${GITHUB_WORKSPACE}/mt5.sh"

          test -f "${SCRIPT}"

          chmod +x "${SCRIPT}"

          echo "============================================================"
          echo "🔎 Environment validation"
          echo "============================================================"

          echo "Bash:"
          bash --version | head -n 1

          echo
          echo "Runner:"
          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Docker:"
          docker --version

          echo
          echo "Bash syntax check:"
          bash -n "${SCRIPT}"

          echo
          echo "✅ mt5.sh syntax is valid."

      # ==========================================================
      # 3. Runtime
      # ==========================================================
      - name: "🚀 Start MT5"
        shell: bash
        env:
          MT5_RESOLUTION: ${{ inputs.resolution }}
          MT5_SESSION_MINUTES: ${{ inputs.session_minutes }}
          MT5_ENABLE_TUNNEL: ${{ inputs.enable_tunnel }}
          MT5_SAVE_ARTIFACTS: ${{ inputs.save_artifacts }}
          MT5_CLEAN_WORKSPACE: ${{ inputs.clean_workspace }}
        run: |
          set -Eeuo pipefail
          "${GITHUB_WORKSPACE}/mt5.sh"

      # ==========================================================
      # 4. Diagnostics
      # ==========================================================
      - name: "📦 Upload diagnostics"
        if: ${{ always() && inputs.save_artifacts }}
        uses: actions/upload-artifact@v5
        with:
          name: mt5-cloud-diagnostics-${{ github.run_id }}

          path: |
            logs/**
            tunnel/**
            .mt5-runtime/**

          if-no-files-found: warn
          retention-days: 3

      # ==========================================================
      # 5. Final status
      # ==========================================================
      - name: "🏁 Final status"
        if: ${{ always() }}
        shell: bash
        run: |
          echo "============================================================"
          echo "🏁 MT5 Cloud Desktop workflow finished"
          echo "============================================================"

          echo "Run ID      : ${{ github.run_id }}"
          echo "Resolution  : ${{ inputs.resolution }}"
          echo "Duration    : ${{ inputs.session_minutes }} minutes"
          echo "Tunnel      : ${{ inputs.enable_tunnel }}"
          echo "Artifacts   : ${{ inputs.save_artifacts }}"
          echo "Clean data  : ${{ inputs.clean_workspace }}"

          echo "============================================================"
