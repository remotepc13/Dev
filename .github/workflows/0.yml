name: 🖥️ KDE Plasma Cloud Desktop

on:
  workflow_dispatch:
    inputs:

      workspace_name:
        description: "🏷️ Desktop workspace name"
        required: false
        type: string
        default: "KDE Workspace"

      desktop_password:
        description: "🔐 Desktop password — visible in logs"
        required: true
        type: string
        default: "desktop123"

      keep_alive_hours:
        description: "⏱️ Desktop lifetime"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
        default: "2"

      resolution:
        description: "🖥️ Desktop resolution"
        required: true
        type: choice
        options:
          - "1280x720"
          - "1600x900"
          - "1920x1080"
        default: "1920x1080"


permissions:
  contents: read


jobs:

  desktop:

    name: 🖥️ KDE Plasma Remote Desktop

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    env:
      DISPLAY_NUM: "1"
      KASMVNC_PORT: "8444"
      KASMVNC_USER: "desktop"
      KASMVNC_VERSION: "1.5.0"


    steps:

      # ==========================================================
      # INITIALIZE
      # ==========================================================

      - name: 🚀 Initialize Desktop
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              🖥️  KDE PLASMA CLOUD DESKTOP                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "🎨 Desktop       : KDE Plasma"
          echo "📡 Remote server : KasmVNC"
          echo "☁️  Tunnel        : Cloudflare Quick Tunnel"
          echo "🖥️  Resolution    : ${{ inputs.resolution }}"
          echo "🏷️  Workspace     : ${{ inputs.workspace_name }}"
          echo "⏱️  Lifetime      : ${{ inputs.keep_alive_hours }} hour(s)"
          echo ""


      # ==========================================================
      # INSTALL KDE
      # ==========================================================

      - name: 📦 Install KDE Plasma
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 INSTALLING KDE PLASMA"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          sudo apt-get update -qq

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            plasma-desktop \
            plasma-workspace \
            kde-standard \
            kde-cli-tools \
            konsole \
            dolphin \
            dbus-x11 \
            dbus-user-session \
            xauth \
            x11-xserver-utils \
            x11-utils \
            x11-xkb-utils \
            openssl \
            curl \
            wget \
            jq \
            ca-certificates \
            procps \
            net-tools \
            >/dev/null

          echo ""
          echo "🎨 KDE Plasma:"
          startplasma-x11 --version 2>/dev/null || true

          echo ""
          echo "✅ KDE Plasma installed."
          echo ""


      # ==========================================================
      # INSTALL KASMVNC
      # ==========================================================

      - name: 📡 Install KasmVNC
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📡 INSTALLING KASMVNC ${KASMVNC_VERSION}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          KASMVNC_URL="https://github.com/kasmtech/KasmVNC/releases/download/v${KASMVNC_VERSION}/kasmvncserver_noble_${KASMVNC_VERSION}_amd64.deb"

          echo "⬇️ Downloading:"
          echo "$KASMVNC_URL"
          echo ""

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --silent \
            --show-error \
            "$KASMVNC_URL" \
            -o /tmp/kasmvnc.deb

          echo "📦 Installing..."

          sudo apt-get install -y /tmp/kasmvnc.deb

          echo ""
          echo "🔎 Installed KasmVNC commands:"
          command -v vncserver || true
          command -v vncpasswd || true
          command -v kasmvncpasswd || true

          echo ""
          echo "📡 KasmVNC version:"
          Xvnc -version 2>&1 | head -10 || true

          echo ""
          echo "✅ KasmVNC installed."
          echo ""


      # ==========================================================
      # CREATE KASMVNC USER
      # ==========================================================

      - name: 👤 Configure KasmVNC User
        shell: bash
        env:
          DESKTOP_PASSWORD: ${{ inputs.desktop_password }}
        run: |
          set -euo pipefail

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "👤 CONFIGURING DESKTOP LOGIN"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          mkdir -p "$HOME/.vnc"
          chmod 700 "$HOME/.vnc"

          echo "👤 Username : ${KASMVNC_USER}"
          echo "🔑 Password : ${DESKTOP_PASSWORD}"
          echo ""

          echo "⚠️  PASSWORD VISIBILITY ENABLED"
          echo "────────────────────────────────────────────────────────────"
          echo "The password is intentionally printed because you requested"
          echo "the complete password in the GitHub Actions log."
          echo "────────────────────────────────────────────────────────────"
          echo ""

          # KasmVNC uses its own authentication database.
          #
          # Prefer kasmvncpasswd if supplied by the package.
          #
          # Do NOT use:
          #
          #     vncpasswd -f
          #
          # because that is not supported by this KasmVNC build.

          if command -v kasmvncpasswd >/dev/null 2>&1; then

            echo "🔐 Using kasmvncpasswd..."

            printf '%s\n%s\n' \
              "$DESKTOP_PASSWORD" \
              "$DESKTOP_PASSWORD" |
              kasmvncpasswd \
                -u "$KASMVNC_USER" \
                -wo

          else

            echo "🔐 Using KasmVNC vncpasswd..."

            printf '%s\n%s\n' \
              "$DESKTOP_PASSWORD" \
              "$DESKTOP_PASSWORD" |
              vncpasswd \
                -u "$KASMVNC_USER"

          fi

          echo ""
          echo "✅ Desktop authentication configured."
          echo ""


      # ==========================================================
      # KDE STARTUP
      # ==========================================================

      - name: 🎨 Configure KDE Session
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎨 CONFIGURING KDE SESSION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          mkdir -p "$HOME/.vnc"

          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/bash

          export XDG_CURRENT_DESKTOP=KDE
          export XDG_SESSION_DESKTOP=KDE
          export KDE_FULL_SESSION=true
          export DESKTOP_SESSION=plasma

          export QT_X11_NO_MITSHM=1
          export QT_QPA_PLATFORM=xcb

          export XDG_RUNTIME_DIR="/tmp/runtime-${USER}"

          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          exec dbus-run-session -- startplasma-x11
          EOF

          chmod +x "$HOME/.vnc/xstartup"

          echo "📄 KDE startup script:"
          echo "────────────────────────────────────────────────────────────"
          cat "$HOME/.vnc/xstartup"
          echo "────────────────────────────────────────────────────────────"

          echo ""
          echo "✅ KDE session configured."
          echo ""


      # ==========================================================
      # CREATE XAUTHORITY
      # ==========================================================

      - name: 🔑 Prepare X Authentication
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "🔑 Preparing X authentication..."
          echo ""

          # Prevent the previous:
          #
          # xauth: file /home/runner/.Xauthority does not exist
          #
          # message.

          touch "$HOME/.Xauthority"

          chmod 600 "$HOME/.Xauthority"

          echo "📄 Xauthority:"
          ls -la "$HOME/.Xauthority"

          echo ""
          echo "✅ X authentication prepared."
          echo ""


      # ==========================================================
      # START KASMVNC
      # ==========================================================

      - name: 🖥️ Start KDE Plasma + KasmVNC
        shell: bash
        env:
          DISPLAY_RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              🖥️  STARTING KDE PLASMA                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          WIDTH="${DISPLAY_RESOLUTION%x*}"
          HEIGHT="${DISPLAY_RESOLUTION#*x}"

          echo "🎨 Desktop     : KDE Plasma"
          echo "📡 Server      : KasmVNC"
          echo "🖥️  Resolution  : ${WIDTH}x${HEIGHT}"
          echo "🌐 Web port    : ${KASMVNC_PORT}"
          echo ""

          # Remove any old display.
          vncserver -kill ":${DISPLAY_NUM}" \
            >/dev/null 2>&1 ||
            true

          rm -f \
            "$HOME/.vnc/"*.pid \
            "$HOME/.vnc/"*.log \
            2>/dev/null ||
            true

          # --------------------------------------------------------
          # KasmVNC starts the X server and KDE session.
          # --------------------------------------------------------

          vncserver ":${DISPLAY_NUM}" \
            -geometry "${WIDTH}x${HEIGHT}" \
            -depth 24 \
            -localhost yes \
            -select-de manual \
            > /tmp/kasmvnc.log 2>&1 &

          VNC_PID=$!

          echo "VNC_PID=${VNC_PID}" >> "$GITHUB_ENV"

          echo "⏳ Waiting for KasmVNC..."

          READY="false"

          for i in $(seq 1 60); do

            if ss -lnt 2>/dev/null |
              grep -Eq ":${KASMVNC_PORT}\b"; then

              READY="true"
              break
            fi

            if ! kill -0 "$VNC_PID" 2>/dev/null; then

              echo ""
              echo "❌ KasmVNC stopped unexpectedly."
              echo ""

              cat /tmp/kasmvnc.log || true

              echo ""
              echo "📋 VNC logs:"
              find "$HOME/.vnc" \
                -maxdepth 1 \
                -type f \
                -name "*.log" \
                -print \
                -exec tail -100 {} \; \
                2>/dev/null || true

              exit 1
            fi

            sleep 2
          done

          if [ "$READY" != "true" ]; then

            echo ""
            echo "❌ KasmVNC did not open port ${KASMVNC_PORT}."
            echo ""

            echo "📋 KasmVNC log:"
            echo "────────────────────────────────────────────────────────────"
            cat /tmp/kasmvnc.log || true
            echo "────────────────────────────────────────────────────────────"

            echo ""
            echo "📋 Listening ports:"
            ss -lntp || true

            exit 1
          fi

          echo ""
          echo "🟢 KasmVNC is listening."
          echo ""

          ss -lntp |
            grep -E ":${KASMVNC_PORT}\b" ||
            true

          echo ""
          echo "📋 KasmVNC log:"
          echo "────────────────────────────────────────────────────────────"
          tail -100 /tmp/kasmvnc.log || true
          echo "────────────────────────────────────────────────────────────"

          echo ""
          echo "🎉 KDE Plasma desktop is running!"
          echo ""


      # ==========================================================
      # CLOUDFLARED
      # ==========================================================

      - name: ☁️ Install Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "☁️  INSTALLING CLOUDFLARED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --silent \
            --show-error \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o /tmp/cloudflared

          chmod +x /tmp/cloudflared

          sudo install \
            -m 0755 \
            /tmp/cloudflared \
            /usr/local/bin/cloudflared

          echo ""
          cloudflared --version
          echo ""

          echo "✅ Cloudflare installed."
          echo ""


      # ==========================================================
      # CLOUDFLARE TUNNEL
      # ==========================================================

      - name: 🌍 Start Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║             🌍 CREATING PUBLIC DESKTOP URL                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          # KasmVNC HTTPS endpoint.
          #
          # Cloudflare Quick Tunnel provides the public HTTPS URL.

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url "https://127.0.0.1:${KASMVNC_PORT}" \
            --no-tls-verify \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "CLOUDFLARED_PID=${CLOUDFLARED_PID}" >> "$GITHUB_ENV"

          echo "⏳ Waiting for Cloudflare..."

          CLOUDFLARE_URL=""

          for i in $(seq 1 90); do

            CLOUDFLARE_URL="$(
              grep -oE \
                'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log |
              head -n1 ||
              true
            )"

            if [ -n "$CLOUDFLARE_URL" ]; then
              break
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then

              echo ""
              echo "❌ Cloudflare stopped."
              echo ""

              cat /tmp/cloudflared.log || true

              exit 1
            fi

            sleep 2
          done

          if [ -z "$CLOUDFLARE_URL" ]; then

            echo ""
            echo "❌ Could not obtain Cloudflare URL."
            echo ""

            cat /tmp/cloudflared.log || true

            exit 1
          fi

          echo "DESKTOP_URL=${CLOUDFLARE_URL}" >> "$GITHUB_ENV"

          printf '%s\n' \
            "$CLOUDFLARE_URL" \
            > /tmp/desktop-url.txt

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  🎉 DESKTOP READY!                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "🌐 OPEN DESKTOP"
          echo ""
          echo "👉 ${CLOUDFLARE_URL}"
          echo ""

          echo "🔐 LOGIN"
          echo ""
          echo "👤 Username : ${KASMVNC_USER}"
          echo "🔑 Password : ${{ inputs.desktop_password }}"
          echo ""

          echo "🖥️  CONFIGURATION"
          echo ""
          echo "🎨 Desktop     : KDE Plasma"
          echo "📡 Server      : KasmVNC"
          echo "☁️  Tunnel      : Cloudflare"
          echo "🖥️  Resolution  : ${{ inputs.resolution }}"
          echo "🏷️  Workspace   : ${{ inputs.workspace_name }}"
          echo "⏱️  Lifetime    : ${{ inputs.keep_alive_hours }} hour(s)"
          echo ""

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🟢 STATUS: ONLINE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          echo "::notice title=🖥️ KDE Desktop URL::${CLOUDFLARE_URL}"

          # --------------------------------------------------------
          # GitHub Step Summary
          # --------------------------------------------------------

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🖥️ KDE Plasma Cloud Desktop

          ## 🟢 Desktop Online

          ### 🌐 Open Desktop

          **[$CLOUDFLARE_URL]($CLOUDFLARE_URL)**

          ---

          ## 🔐 Login

          | Setting | Value |
          |---|---|
          | 👤 Username | \`${KASMVNC_USER}\` |
          | 🔑 Password | \`${{ inputs.desktop_password }}\` |

          ⚠️ The password is intentionally visible because this workflow was configured that way.

          ---

          ## 🖥️ Configuration

          | Setting | Value |
          |---|---|
          | 🎨 Desktop | KDE Plasma |
          | 📡 Server | KasmVNC |
          | ☁️ Tunnel | Cloudflare Quick Tunnel |
          | 🖥️ Resolution | ${{ inputs.resolution }} |
          | 🏷️ Workspace | ${{ inputs.workspace_name }} |
          | ⏱️ Lifetime | ${{ inputs.keep_alive_hours }} hour(s) |

          ---

          ## 🟢 Status

          **ONLINE**

          Keep this workflow running while using the desktop.
          EOF

          echo ""


      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: 📦 Publish Desktop URL
        uses: actions/upload-artifact@v4
        with:
          name: desktop-connection
          path: /tmp/desktop-url.txt
          retention-days: 1


      # ==========================================================
      # KEEP ALIVE
      # ==========================================================

      - name: ⏱️ Keep Desktop Online
        shell: bash
        run: |
          set -euo pipefail

          HOURS="${{ inputs.keep_alive_hours }}"
          REMAINING=$((HOURS * 3600))

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                   🟢 DESKTOP ONLINE                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "🌐 URL:"
          echo "$DESKTOP_URL"
          echo ""

          echo "👤 Username : ${KASMVNC_USER}"
          echo "🔑 Password : ${{ inputs.desktop_password }}"
          echo ""

          echo "🎨 KDE Plasma"
          echo "📡 KasmVNC"
          echo "🖥️  ${{ inputs.resolution }}"
          echo ""

          while [ "$REMAINING" -gt 0 ]; do

            H=$((REMAINING / 3600))
            M=$(((REMAINING % 3600) / 60))

            echo "⏳ Remaining: ${H}h ${M}m"

            SLEEP=300

            if [ "$REMAINING" -lt "$SLEEP" ]; then
              SLEEP="$REMAINING"
            fi

            sleep "$SLEEP"

            REMAINING=$((REMAINING - SLEEP))

          done

          echo ""
          echo "⏰ Session time expired."
          echo "🛑 Shutting down desktop."
          echo ""


      # ==========================================================
      # CLEANUP
      # ==========================================================

      - name: 🧹 Shutdown Desktop
        if: always()
        shell: bash
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                   🧹 CLEANUP                                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          if [ -n "${CLOUDFLARED_PID:-}" ]; then
            echo "☁️  Stopping Cloudflare..."
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi

          echo "📡 Stopping KasmVNC..."

          vncserver -kill ":${DISPLAY_NUM}" \
            >/tmp/kasmvnc-stop.log 2>&1 ||
            true

          if [ -n "${KASMVNC_PID:-}" ]; then
            kill "$KASMVNC_PID" 2>/dev/null || true
          fi

          echo ""
          echo "📋 Cloudflare log:"
          echo "────────────────────────────────────────────────────────────"
          tail -100 /tmp/cloudflared.log 2>/dev/null || true
          echo "────────────────────────────────────────────────────────────"

          echo ""
          echo "📋 KasmVNC log:"
          echo "────────────────────────────────────────────────────────────"
          tail -100 /tmp/kasmvnc.log 2>/dev/null || true
          echo "────────────────────────────────────────────────────────────"

          echo ""
          echo "📋 VNC logs:"
          echo "────────────────────────────────────────────────────────────"

          find "$HOME/.vnc" \
            -maxdepth 1 \
            -type f \
            -name "*.log" \
            -print \
            -exec tail -50 {} \; \
            2>/dev/null ||
            true

          echo "────────────────────────────────────────────────────────────"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                 🔴 DESKTOP OFFLINE                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "👋 KDE Plasma session terminated."
          echo ""
