name: 🖥️ KDE Plasma Cloud Desktop

on:
  workflow_dispatch:
    inputs:

      workspace_name:
        description: "🏷️ Desktop workspace name"
        required: false
        type: string
        default: "KDE Workspace"

      desktop_password:
        description: "🔐 Desktop password — visible in logs"
        required: true
        type: string
        default: "desktop123"

      keep_alive_hours:
        description: "⏱️ Desktop lifetime"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
        default: "2"

      resolution:
        description: "🖥️ Desktop resolution"
        required: true
        type: choice
        options:
          - "1280x720"
          - "1600x900"
          - "1920x1080"
        default: "1920x1080"


permissions:
  contents: read


jobs:

  desktop:

    name: 🖥️ KDE Plasma Remote Desktop

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    env:
      DISPLAY_NUM: "1"
      KASMVNC_PORT: "8444"
      KASMVNC_USER: "desktop"
      KASMVNC_VERSION: "1.5.0"


    steps:

      # ==========================================================
      # START
      # ==========================================================

      - name: 🚀 Initialize
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║             🖥️  KDE PLASMA CLOUD DESKTOP                   ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "🎨 Desktop       : KDE Plasma"
          echo "📡 Remote server : KasmVNC"
          echo "☁️  Public tunnel : Cloudflare Quick Tunnel"
          echo "🖥️  Resolution    : ${{ inputs.resolution }}"
          echo "🏷️  Workspace     : ${{ inputs.workspace_name }}"
          echo "⏱️  Lifetime      : ${{ inputs.keep_alive_hours }} hour(s)"
          echo ""

          echo "🟢 Initializing runner..."
          echo ""


      # ==========================================================
      # SYSTEM UPDATE
      # ==========================================================

      - name: 📦 Install Desktop Dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 INSTALLING DESKTOP DEPENDENCIES"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          sudo apt-get update -qq

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            plasma-desktop \
            plasma-workspace \
            kde-standard \
            kde-cli-tools \
            konsole \
            dolphin \
            dbus-x11 \
            dbus-user-session \
            xauth \
            x11-xserver-utils \
            x11-utils \
            x11-xkb-utils \
            openssl \
            curl \
            wget \
            jq \
            ca-certificates \
            ssl-cert \
            net-tools \
            procps \
            >/dev/null

          echo ""
          echo "✅ Desktop dependencies installed."
          echo ""


      # ==========================================================
      # SSL CERTIFICATE
      # ==========================================================

      - name: 🔐 Prepare Ubuntu SSL Certificate
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔐 PREPARING SSL CERTIFICATE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # Ubuntu normally creates these automatically when ssl-cert
          # is installed, but GitHub's image/package state can differ.
          #
          # KasmVNC expects:
          #
          # /etc/ssl/private/ssl-cert-snakeoil.key
          # /etc/ssl/certs/ssl-cert-snakeoil.pem

          sudo mkdir -p /etc/ssl/private
          sudo mkdir -p /etc/ssl/certs

          if [ ! -f /etc/ssl/private/ssl-cert-snakeoil.key ] ||
             [ ! -f /etc/ssl/certs/ssl-cert-snakeoil.pem ]; then

            echo "🔧 Generating temporary SSL certificate..."

            sudo make-ssl-cert \
              generate-default-snakeoil \
              --force

          fi

          if [ ! -f /etc/ssl/private/ssl-cert-snakeoil.key ]; then
            echo "❌ SSL private key was not created."
            exit 1
          fi

          if [ ! -f /etc/ssl/certs/ssl-cert-snakeoil.pem ]; then
            echo "❌ SSL certificate was not created."
            exit 1
          fi

          sudo chmod 640 \
            /etc/ssl/private/ssl-cert-snakeoil.key

          echo ""
          echo "🔑 Key:"
          sudo ls -l /etc/ssl/private/ssl-cert-snakeoil.key

          echo ""
          echo "📜 Certificate:"
          sudo ls -l /etc/ssl/certs/ssl-cert-snakeoil.pem

          echo ""
          echo "✅ SSL certificate ready."
          echo ""


      # ==========================================================
      # KASMVNC
      # ==========================================================

      - name: 📡 Install KasmVNC
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📡 INSTALLING KASMVNC"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          URL="https://github.com/kasmtech/KasmVNC/releases/download/v${KASMVNC_VERSION}/kasmvncserver_noble_${KASMVNC_VERSION}_amd64.deb"

          echo "📦 Version : ${KASMVNC_VERSION}"
          echo ""
          echo "⬇️ Downloading:"
          echo "$URL"
          echo ""

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --silent \
            --show-error \
            "$URL" \
            -o /tmp/kasmvnc.deb

          echo "📦 Installing package..."

          sudo apt-get install -y /tmp/kasmvnc.deb

          echo ""
          echo "🔎 KasmVNC binaries:"
          echo ""

          command -v vncserver || true
          command -v kasmvncpasswd || true
          command -v vncpasswd || true

          echo ""
          echo "📡 Xvnc:"
          Xvnc -version 2>&1 | head -10 || true

          echo ""
          echo "✅ KasmVNC installed."
          echo ""


      # ==========================================================
      # USER / GROUP
      # ==========================================================

      - name: 👤 Prepare Desktop User
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "👤 Preparing KasmVNC desktop user..."
          echo ""

          # Make sure the runner user can read the SSL key.
          if getent group ssl-cert >/dev/null 2>&1; then
            sudo usermod -aG ssl-cert "$USER"
          fi

          mkdir -p "$HOME/.vnc"

          chmod 700 "$HOME/.vnc"

          echo "👤 Linux user : $USER"
          echo "👤 VNC user   : $KASMVNC_USER"
          echo ""

          echo "✅ User environment ready."
          echo ""


      # ==========================================================
      # PASSWORD
      # ==========================================================

      - name: 🔐 Configure Desktop Password
        shell: bash
        env:
          DESKTOP_PASSWORD: ${{ inputs.desktop_password }}
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    🔐 LOGIN INFORMATION                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "👤 Username : ${KASMVNC_USER}"
          echo "🔑 Password : ${DESKTOP_PASSWORD}"
          echo ""

          echo "⚠️  WARNING"
          echo "──────────────────────────────────────────────────────────────"
          echo "The password is intentionally displayed because you requested"
          echo "the complete password to be visible in the workflow log."
          echo ""
          echo "Anyone who can read this workflow run can see this password."
          echo "──────────────────────────────────────────────────────────────"
          echo ""

          # --------------------------------------------------------
          # KasmVNC password database.
          #
          # IMPORTANT:
          # Do not use:
          #
          #   vncpasswd -f
          #
          # because this KasmVNC build does not support that syntax.
          # --------------------------------------------------------

          if command -v kasmvncpasswd >/dev/null 2>&1; then

            echo "🔐 Using kasmvncpasswd..."

            printf '%s\n%s\n' \
              "$DESKTOP_PASSWORD" \
              "$DESKTOP_PASSWORD" |
              kasmvncpasswd \
                -u "$KASMVNC_USER" \
                -wo

          else

            echo "🔐 Using KasmVNC vncpasswd..."

            printf '%s\n%s\n' \
              "$DESKTOP_PASSWORD" \
              "$DESKTOP_PASSWORD" |
              vncpasswd \
                -u "$KASMVNC_USER"

          fi

          echo ""
          echo "✅ KasmVNC authentication configured."
          echo ""


      # ==========================================================
      # KDE STARTUP
      # ==========================================================

      - name: 🎨 Configure KDE Plasma
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎨 CONFIGURING KDE PLASMA"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          mkdir -p "$HOME/.vnc"

          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/bash

          # ------------------------------------------------------
          # KDE environment
          # ------------------------------------------------------

          export XDG_CURRENT_DESKTOP=KDE
          export XDG_SESSION_DESKTOP=KDE
          export KDE_FULL_SESSION=true
          export DESKTOP_SESSION=plasma

          export QT_X11_NO_MITSHM=1
          export QT_QPA_PLATFORM=xcb

          # ------------------------------------------------------
          # Runtime directory
          # ------------------------------------------------------

          export XDG_RUNTIME_DIR="/tmp/runtime-${USER}"

          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          # ------------------------------------------------------
          # KDE session
          # ------------------------------------------------------

          exec dbus-run-session -- startplasma-x11
          EOF

          chmod +x "$HOME/.vnc/xstartup"

          echo "📄 ~/.vnc/xstartup:"
          echo "──────────────────────────────────────────────────────────────"
          cat "$HOME/.vnc/xstartup"
          echo "──────────────────────────────────────────────────────────────"
          echo ""

          echo "✅ KDE startup script created."
          echo ""


      # ==========================================================
      # KASMVNC CONFIGURATION
      # ==========================================================

      - name: ⚙️ Configure KasmVNC
        shell: bash
        env:
          DISPLAY_RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -euo pipefail

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚙️  CONFIGURING KASMVNC"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          WIDTH="${DISPLAY_RESOLUTION%x*}"
          HEIGHT="${DISPLAY_RESOLUTION#*x}"

          echo "🖥️ Resolution : ${WIDTH}x${HEIGHT}"
          echo "🌐 Port       : ${KASMVNC_PORT}"
          echo ""

          mkdir -p "$HOME/.vnc"

          # --------------------------------------------------------
          # Remove stale session files.
          # --------------------------------------------------------

          vncserver -kill ":${DISPLAY_NUM}" \
            >/dev/null 2>&1 ||
            true

          rm -f \
            "$HOME/.vnc/"*.pid \
            "$HOME/.vnc/"*.log \
            2>/dev/null ||
            true

          # --------------------------------------------------------
          # Create an Xauthority file explicitly.
          #
          # This prevents:
          #
          # xauth: file /home/runner/.Xauthority does not exist
          # --------------------------------------------------------

          touch "$HOME/.Xauthority"

          chmod 600 "$HOME/.Xauthority"

          echo "🔑 Xauthority file:"
          ls -l "$HOME/.Xauthority"

          # --------------------------------------------------------
          # Create KasmVNC configuration.
          #
          # Do NOT force custom certificate/key paths here.
          # KasmVNC will use the Ubuntu certificate we prepared.
          # --------------------------------------------------------

          cat > "$HOME/.vnc/kasmvnc.yaml" <<EOF
          desktop:
            resolution:
              width: ${WIDTH}
              height: ${HEIGHT}

          network:
            websocket_port: ${KASMVNC_PORT}

          ssl:
            require_ssl: true
          EOF

          echo ""
          echo "📄 KasmVNC configuration:"
          echo "──────────────────────────────────────────────────────────────"
          cat "$HOME/.vnc/kasmvnc.yaml"
          echo "──────────────────────────────────────────────────────────────"
          echo ""

          echo "✅ KasmVNC configuration prepared."
          echo ""


      # ==========================================================
      # START DESKTOP
      # ==========================================================

      - name: 🖥️ Start KDE Plasma
        shell: bash
        env:
          DISPLAY_RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                🖥️  STARTING KDE PLASMA                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          WIDTH="${DISPLAY_RESOLUTION%x*}"
          HEIGHT="${DISPLAY_RESOLUTION#*x}"

          echo "🎨 Desktop     : KDE Plasma"
          echo "📡 Server      : KasmVNC"
          echo "🖥️  Resolution  : ${WIDTH}x${HEIGHT}"
          echo "🌐 Port        : ${KASMVNC_PORT}"
          echo ""

          # --------------------------------------------------------
          # Start KasmVNC.
          #
          # Keep it on localhost only. Cloudflare will be the public
          # entry point.
          # --------------------------------------------------------

          vncserver ":${DISPLAY_NUM}" \
            -geometry "${WIDTH}x${HEIGHT}" \
            -depth 24 \
            -localhost yes \
            -select-de manual \
            > /tmp/kasmvnc.log 2>&1 &

          KASMVNC_PID=$!

          echo "KASMVNC_PID=${KASMVNC_PID}" >> "$GITHUB_ENV"

          echo "⏳ Waiting for KasmVNC..."

          READY="false"

          for i in $(seq 1 60); do

            if ! kill -0 "$KASMVNC_PID" 2>/dev/null; then

              echo ""
              echo "❌ KasmVNC exited unexpectedly."
              echo ""
              echo "📋 KasmVNC log:"
              cat /tmp/kasmvnc.log || true
              echo ""

              find "$HOME/.vnc" \
                -maxdepth 1 \
                -type f \
                -name "*.log" \
                -print \
                -exec tail -100 {} \; \
                2>/dev/null || true

              exit 1
            fi

            # KasmVNC can expose either the websocket port or its
            # HTTPS server depending on configuration/version.

            if ss -lnt 2>/dev/null |
              grep -Eq ":${KASMVNC_PORT}\b"; then

              READY="true"
              break
            fi

            sleep 2
          done

          if [ "$READY" != "true" ]; then

            echo ""
            echo "❌ KasmVNC did not open port ${KASMVNC_PORT}."
            echo ""

            echo "📋 Startup log:"
            echo "──────────────────────────────────────────────────────────────"
            cat /tmp/kasmvnc.log || true
            echo "──────────────────────────────────────────────────────────────"

            echo ""
            echo "📋 Session logs:"
            echo "──────────────────────────────────────────────────────────────"

            find "$HOME/.vnc" \
              -maxdepth 1 \
              -type f \
              -print \
              -exec tail -100 {} \; \
              2>/dev/null || true

            echo "──────────────────────────────────────────────────────────────"

            echo ""
            echo "📡 Listening ports:"
            ss -lntp || true

            exit 1
          fi

          echo ""
          echo "🟢 KasmVNC is listening."
          echo ""

          echo "📡 Listening port:"
          ss -lntp |
            grep -E ":${KASMVNC_PORT}\b" ||
            true

          echo ""
          echo "📋 KasmVNC startup log:"
          echo "──────────────────────────────────────────────────────────────"
          tail -100 /tmp/kasmvnc.log || true
          echo "──────────────────────────────────────────────────────────────"

          echo ""
          echo "🎉 KDE Plasma is ONLINE!"
          echo ""


      # ==========================================================
      # CLOUDFLARE
      # ==========================================================

      - name: ☁️ Install Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "☁️  INSTALLING CLOUDFLARED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          curl \
            --fail \
            --location \
            --retry 5 \
            --silent \
            --show-error \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o /tmp/cloudflared

          chmod +x /tmp/cloudflared

          sudo install \
            -m 0755 \
            /tmp/cloudflared \
            /usr/local/bin/cloudflared

          echo ""
          cloudflared --version
          echo ""

          echo "✅ cloudflared installed."
          echo ""


      # ==========================================================
      # PUBLIC TUNNEL
      # ==========================================================

      - name: 🌍 Create Public Desktop Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║             🌍 CREATING PUBLIC DESKTOP URL                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "☁️ Cloudflare target:"
          echo "   https://127.0.0.1:${KASMVNC_PORT}"
          echo ""

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url "https://127.0.0.1:${KASMVNC_PORT}" \
            --no-tls-verify \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "CLOUDFLARED_PID=${CLOUDFLARED_PID}" >> "$GITHUB_ENV"

          echo "⏳ Waiting for Cloudflare..."

          CLOUDFLARE_URL=""

          for i in $(seq 1 90); do

            CLOUDFLARE_URL="$(
              grep -oE \
                'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log |
              head -n1 ||
              true
            )"

            if [ -n "$CLOUDFLARE_URL" ]; then
              break
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then

              echo ""
              echo "❌ cloudflared stopped."
              echo ""

              cat /tmp/cloudflared.log || true

              exit 1
            fi

            sleep 2
          done

          if [ -z "$CLOUDFLARE_URL" ]; then

            echo ""
            echo "❌ Could not obtain Cloudflare URL."
            echo ""

            cat /tmp/cloudflared.log || true

            exit 1
          fi

          echo "DESKTOP_URL=${CLOUDFLARE_URL}" >> "$GITHUB_ENV"

          # --------------------------------------------------------
          # Plain text file for external launchers.
          # --------------------------------------------------------

          printf '%s\n' \
            "$CLOUDFLARE_URL" \
            > /tmp/desktop-url.txt

          # --------------------------------------------------------
          # Console output.
          # --------------------------------------------------------

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    🎉 DESKTOP READY!                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "🌐 OPEN DESKTOP"
          echo ""
          echo "👉 ${CLOUDFLARE_URL}"
          echo ""

          echo "🔐 LOGIN"
          echo ""
          echo "👤 Username : ${KASMVNC_USER}"
          echo "🔑 Password : ${{ inputs.desktop_password }}"
          echo ""

          echo "🖥️  DESKTOP"
          echo ""
          echo "🎨 Environment : KDE Plasma"
          echo "📡 Server      : KasmVNC"
          echo "☁️  Tunnel      : Cloudflare"
          echo "🖥️  Resolution  : ${{ inputs.resolution }}"
          echo "🏷️  Workspace   : ${{ inputs.workspace_name }}"
          echo "⏱️  Lifetime    : ${{ inputs.keep_alive_hours }} hour(s)"
          echo ""

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🟢 STATUS: ONLINE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          echo "::notice title=🖥️ KDE Plasma Desktop::${CLOUDFLARE_URL}"

          # --------------------------------------------------------
          # GitHub Summary
          # --------------------------------------------------------

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🖥️ KDE Plasma Cloud Desktop

          ## 🟢 Desktop Online

          ### 🌐 Open Desktop

          **[$CLOUDFLARE_URL]($CLOUDFLARE_URL)**

          ---

          ## 🔐 Login

          | | Value |
          |---|---|
          | 👤 Username | \`${KASMVNC_USER}\` |
          | 🔑 Password | \`${{ inputs.desktop_password }}\` |

          ⚠️ **The password is intentionally visible in this workflow.**

          ---

          ## 🖥️ Configuration

          | Setting | Value |
          |---|---|
          | 🎨 Desktop | KDE Plasma |
          | 📡 Remote server | KasmVNC |
          | ☁️ Tunnel | Cloudflare Quick Tunnel |
          | 🖥️ Resolution | ${{ inputs.resolution }} |
          | 🏷️ Workspace | ${{ inputs.workspace_name }} |
          | ⏱️ Lifetime | ${{ inputs.keep_alive_hours }} hour(s) |

          ---

          ## 🟢 Status

          **ONLINE**

          Keep this workflow running while using the desktop.

          The desktop will automatically terminate when the selected time expires.
          EOF

          echo ""


      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: 📦 Publish Desktop URL
        uses: actions/upload-artifact@v4
        with:
          name: desktop-connection
          path: /tmp/desktop-url.txt
          retention-days: 1


      # ==========================================================
      # KEEP ALIVE
      # ==========================================================

      - name: ⏱️ Keep Desktop Online
        shell: bash
        run: |
          set -euo pipefail

          HOURS="${{ inputs.keep_alive_hours }}"
          TOTAL=$((HOURS * 3600))
          REMAINING="$TOTAL"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                 🟢 DESKTOP ONLINE                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "🌐 URL:"
          echo "$DESKTOP_URL"
          echo ""

          echo "👤 User     : ${KASMVNC_USER}"
          echo "🔑 Password : ${{ inputs.desktop_password }}"
          echo ""

          echo "🎨 KDE Plasma"
          echo "📡 KasmVNC"
          echo "🖥️  ${{ inputs.resolution }}"
          echo "⏱️  ${HOURS} hour(s)"
          echo ""

          while [ "$REMAINING" -gt 0 ]; do

            HOURS_LEFT=$((REMAINING / 3600))
            MINUTES_LEFT=$(((REMAINING % 3600) / 60))

            echo "⏳ Remaining: ${HOURS_LEFT}h ${MINUTES_LEFT}m"

            SLEEP_TIME=300

            if [ "$REMAINING" -lt "$SLEEP_TIME" ]; then
              SLEEP_TIME="$REMAINING"
            fi

            sleep "$SLEEP_TIME"

            REMAINING=$((REMAINING - SLEEP_TIME))

          done

          echo ""
          echo "⏰ Requested desktop lifetime has expired."
          echo "🛑 Shutting down..."
          echo ""


      # ==========================================================
      # CLEANUP
      # ==========================================================

      - name: 🧹 Shutdown Desktop
        if: always()
        shell: bash
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  🧹 CLEANUP                                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          # ------------------------------------------------------
          # Cloudflare
          # ------------------------------------------------------

          if [ -n "${CLOUDFLARED_PID:-}" ]; then
            echo "☁️  Stopping Cloudflare..."
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi

          # ------------------------------------------------------
          # KasmVNC
          # ------------------------------------------------------

          echo "📡 Stopping KasmVNC..."

          vncserver -kill ":${DISPLAY_NUM}" \
            >/tmp/kasmvnc-stop.log 2>&1 ||
            true

          if [ -n "${KASMVNC_PID:-}" ]; then
            kill "$KASMVNC_PID" 2>/dev/null || true
          fi

          # ------------------------------------------------------
          # Diagnostics
          # ------------------------------------------------------

          echo ""
          echo "📋 Cloudflare log:"
          echo "──────────────────────────────────────────────────────────────"
          tail -100 /tmp/cloudflared.log 2>/dev/null || true
          echo "──────────────────────────────────────────────────────────────"

          echo ""
          echo "📋 KasmVNC log:"
          echo "──────────────────────────────────────────────────────────────"
          tail -100 /tmp/kasmvnc.log 2>/dev/null || true
          echo "──────────────────────────────────────────────────────────────"

          echo ""
          echo "📋 VNC session logs:"
          echo "──────────────────────────────────────────────────────────────"

          find "$HOME/.vnc" \
            -maxdepth 1 \
            -type f \
            -name "*.log" \
            -print \
            -exec tail -50 {} \; \
            2>/dev/null ||
            true

          echo "──────────────────────────────────────────────────────────────"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                 🔴 DESKTOP OFFLINE                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "👋 KDE Plasma session terminated."
          echo ""
