name: 🖥️ KDE Plasma Cloud Desktop

on:
  workflow_dispatch:
    inputs:

      workspace_name:
        description: "🏷️ Desktop workspace name"
        required: false
        type: string
        default: "KDE Workspace"

      desktop_password:
        description: "🔐 KasmVNC password — shown in logs"
        required: true
        type: string
        default: "desktop123"

      keep_alive_hours:
        description: "⏱️ Desktop lifetime"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
        default: "2"

      resolution:
        description: "🖥️ Desktop resolution"
        required: true
        type: choice
        options:
          - "1280x720"
          - "1600x900"
          - "1920x1080"
        default: "1920x1080"


# ================================================================
# JOB
# ================================================================

jobs:

  desktop:

    name: 🖥️ KDE Plasma Desktop

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    env:
      KASMVNC_VERSION: "1.5.0"
      KASMVNC_PORT: "8444"
      KASMVNC_USER: "kasm_user"


    # ============================================================
    # STEPS
    # ============================================================

    steps:


      # ------------------------------------------------------------
      # START
      # ------------------------------------------------------------

      - name: 🚀 Initialize Desktop
        shell: bash
        run: |
          set -e

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              🖥️  KDE PLASMA CLOUD DESKTOP                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "🎨 Desktop       : KDE Plasma"
          echo "📡 Remote server : KasmVNC"
          echo "☁️  Tunnel        : Cloudflare Quick Tunnel"
          echo "🖥️  Resolution    : ${{ inputs.resolution }}"
          echo "🏷️  Workspace      : ${{ inputs.workspace_name }}"
          echo "⏱️  Lifetime       : ${{ inputs.keep_alive_hours }} hour(s)"
          echo ""

          echo "🟢 Initializing..."
          echo ""


      # ------------------------------------------------------------
      # SYSTEM PACKAGES
      # ------------------------------------------------------------

      - name: 📦 Install KDE Plasma Dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 INSTALLING KDE PLASMA"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          sudo apt-get update -qq

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            plasma-desktop \
            plasma-workspace \
            kde-standard \
            konsole \
            dolphin \
            dbus-x11 \
            dbus-user-session \
            xauth \
            x11-xserver-utils \
            x11-utils \
            openssl \
            curl \
            wget \
            jq \
            ca-certificates \
            unzip \
            procps \
            net-tools \
            >/dev/null

          echo ""
          echo "✅ KDE Plasma packages installed."
          echo ""


      # ------------------------------------------------------------
      # VERIFY KDE
      # ------------------------------------------------------------

      - name: 🔎 Verify KDE Installation
        shell: bash
        run: |
          set -e

          echo ""
          echo "🔎 Checking KDE components..."
          echo ""

          command -v startplasma-x11
          command -v dbus-run-session
          command -v openssl

          echo ""
          echo "🎨 KDE:"
          startplasma-x11 --version 2>/dev/null || true

          echo ""
          echo "✅ KDE environment verified."
          echo ""


      # ------------------------------------------------------------
      # INSTALL KASMVNC 1.5.0
      # ------------------------------------------------------------

      - name: 📡 Install KasmVNC
        shell: bash
        run: |
          set -e

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📡 INSTALLING KASMVNC ${KASMVNC_VERSION}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          KASMVNC_URL="https://github.com/kasmtech/KasmVNC/releases/download/v${KASMVNC_VERSION}/kasmvncserver_noble_${KASMVNC_VERSION}_amd64.deb"

          echo "⬇️ Download:"
          echo "$KASMVNC_URL"
          echo ""

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --silent \
            --show-error \
            "$KASMVNC_URL" \
            --output /tmp/kasmvncserver.deb

          echo "📦 Installing KasmVNC..."

          sudo apt-get install -y /tmp/kasmvncserver.deb

          echo ""
          echo "🔎 Installed binaries:"
          echo ""

          command -v vncserver || true
          command -v kasmvncpasswd || true
          command -v vncpasswd || true

          echo ""
          echo "📡 KasmVNC version:"
          Xvnc -version 2>&1 | head -5 || true

          echo ""
          echo "✅ KasmVNC installed."
          echo ""


      # ------------------------------------------------------------
      # SSL GROUP
      # ------------------------------------------------------------

      - name: 🔐 Configure KasmVNC SSL Access
        shell: bash
        run: |
          set -e

          echo ""
          echo "🔐 Configuring KasmVNC SSL permissions..."
          echo ""

          # KasmVNC Debian packages use ssl-cert on Ubuntu.
          if getent group ssl-cert >/dev/null 2>&1; then
            sudo usermod -aG ssl-cert "$USER" || true
          fi

          mkdir -p "$HOME/.vnc"

          echo "✅ SSL permissions configured."
          echo ""


      # ------------------------------------------------------------
      # PASSWORD
      # ------------------------------------------------------------

      - name: 🔑 Configure KasmVNC Authentication
        shell: bash
        env:
          DESKTOP_PASSWORD: ${{ inputs.desktop_password }}
        run: |
          set -e

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                 🔐 DESKTOP LOGIN                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "👤 KasmVNC User : ${KASMVNC_USER}"
          echo "🔑 Password     : ${DESKTOP_PASSWORD}"
          echo ""

          echo "⚠️  WARNING"
          echo "────────────────────────────────────────────────────────────"
          echo "The password is intentionally displayed because you requested"
          echo "the full password to be visible in the GitHub Actions log."
          echo ""
          echo "Anyone who can read this workflow's logs can read this password."
          echo "────────────────────────────────────────────────────────────"
          echo ""

          mkdir -p "$HOME/.vnc"

          # --------------------------------------------------------
          # IMPORTANT:
          #
          # KasmVNC has a separate authentication database.
          #
          # Do NOT use:
          #
          #     vncpasswd -f
          #
          # That is the TigerVNC-style syntax which caused your error.
          #
          # KasmVNC uses kasmvncpasswd / vncpasswd with -u.
          # --------------------------------------------------------

          printf '%s\n%s\n' \
            "$DESKTOP_PASSWORD" \
            "$DESKTOP_PASSWORD" |
            kasmvncpasswd \
              -u "$KASMVNC_USER" \
              -wo

          chmod 600 "$HOME/.kasmpasswd"

          echo ""
          echo "✅ KasmVNC authentication database created."
          echo ""

          echo "📄 Password database:"
          ls -l "$HOME/.kasmpasswd"

          echo ""


      # ------------------------------------------------------------
      # CREATE KDE STARTUP SCRIPT
      # ------------------------------------------------------------

      - name: 🎨 Configure KDE Startup
        shell: bash
        run: |
          set -e

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎨 CONFIGURING KDE SESSION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          mkdir -p "$HOME/.vnc"

          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/bash

          # ------------------------------------------------------
          # KDE Plasma environment
          # ------------------------------------------------------

          export XDG_CURRENT_DESKTOP=KDE
          export XDG_SESSION_DESKTOP=KDE
          export KDE_FULL_SESSION=true
          export DESKTOP_SESSION=plasma

          export QT_X11_NO_MITSHM=1
          export QT_QPA_PLATFORM=xcb

          # KDE expects this directory.
          export XDG_RUNTIME_DIR="/tmp/runtime-${USER}"

          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          # ------------------------------------------------------
          # Disable screen locking / power management
          # ------------------------------------------------------

          export KDE_SKIP_KDEINIT_WAIT=1

          # ------------------------------------------------------
          # Start KDE.
          #
          # dbus-run-session creates a private DBus session for
          # this remote desktop.
          # ------------------------------------------------------

          exec dbus-run-session -- startplasma-x11
          EOF

          chmod +x "$HOME/.vnc/xstartup"

          echo "📄 KDE startup script:"
          echo "────────────────────────────────────────────────────────────"
          cat "$HOME/.vnc/xstartup"
          echo "────────────────────────────────────────────────────────────"
          echo ""

          echo "✅ KDE startup configuration ready."
          echo ""


      # ------------------------------------------------------------
      # KASMVNC CONFIG
      # ------------------------------------------------------------

      - name: ⚙️ Configure KasmVNC Server
        shell: bash
        env:
          DISPLAY_RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -e

          echo ""
          echo "⚙️ Configuring KasmVNC..."
          echo ""

          WIDTH="${DISPLAY_RESOLUTION%x*}"
          HEIGHT="${DISPLAY_RESOLUTION#*x}"

          echo "🖥️ Width  : $WIDTH"
          echo "🖥️ Height : $HEIGHT"
          echo "🌐 Port   : $KASMVNC_PORT"
          echo ""

          # --------------------------------------------------------
          # Self-signed certificate.
          #
          # Cloudflare terminates the public connection and connects
          # to this local HTTPS endpoint. The certificate therefore
          # does not need to be publicly trusted.
          # --------------------------------------------------------

          openssl req \
            -x509 \
            -nodes \
            -newkey rsa:2048 \
            -days 1 \
            -keyout "$HOME/.vnc/self.pem" \
            -out "$HOME/.vnc/self.pem" \
            -subj "/CN=localhost" \
            >/dev/null 2>&1

          chmod 600 "$HOME/.vnc/self.pem"

          echo "🔐 Local TLS certificate created."

          # --------------------------------------------------------
          # Kill any stale session.
          # --------------------------------------------------------

          vncserver -kill :1 >/dev/null 2>&1 || true

          rm -f \
            "$HOME/.vnc/"*.pid \
            "$HOME/.vnc/"*.log \
            2>/dev/null || true

          echo "🧹 Old VNC sessions cleared."

          echo ""
          echo "✅ KasmVNC configuration ready."
          echo ""


      # ------------------------------------------------------------
      # START KASMVNC
      # ------------------------------------------------------------

      - name: 🖥️ Start KDE Plasma Desktop
        shell: bash
        env:
          DISPLAY_RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -e

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              🖥️  STARTING KDE PLASMA                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          WIDTH="${DISPLAY_RESOLUTION%x*}"
          HEIGHT="${DISPLAY_RESOLUTION#*x}"

          echo "🎨 Desktop     : KDE Plasma"
          echo "📡 Server      : KasmVNC"
          echo "🖥️  Resolution  : ${WIDTH}x${HEIGHT}"
          echo "🌐 Local port  : ${KASMVNC_PORT}"
          echo ""

          # --------------------------------------------------------
          # Start KasmVNC.
          #
          # KasmVNC creates the X display itself.
          # We therefore do NOT start Xvfb separately.
          #
          # -select-de manual means use ~/.vnc/xstartup.
          # --------------------------------------------------------

          vncserver :1 \
            -depth 24 \
            -geometry "${WIDTH}x${HEIGHT}" \
            -interface 127.0.0.1 \
            -websocketPort "${KASMVNC_PORT}" \
            -httpd /usr/share/kasmvnc/www \
            -sslOnly \
            -cert "$HOME/.vnc/self.pem" \
            -key "$HOME/.vnc/self.pem" \
            -select-de manual \
            > /tmp/kasmvnc-start.log 2>&1 &

          VNC_WRAPPER_PID=$!

          echo "VNC_WRAPPER_PID=$VNC_WRAPPER_PID" >> "$GITHUB_ENV"

          echo "⏳ Waiting for KasmVNC..."

          READY="false"

          for i in $(seq 1 60); do

            if ss -lnt 2>/dev/null |
              grep -Eq ":${KASMVNC_PORT}[[:space:]]"; then

              READY="true"
              break
            fi

            # Check whether the process died.
            if ! kill -0 "$VNC_WRAPPER_PID" 2>/dev/null; then
              echo ""
              echo "❌ KasmVNC process stopped."
              echo ""
              cat /tmp/kasmvnc-start.log || true
              exit 1
            fi

            sleep 2
          done

          if [ "$READY" != "true" ]; then

            echo ""
            echo "❌ KasmVNC did not open port ${KASMVNC_PORT}."
            echo ""

            echo "📋 Startup log:"
            echo "────────────────────────────────────────────────────────────"
            cat /tmp/kasmvnc-start.log || true
            echo "────────────────────────────────────────────────────────────"

            echo ""
            echo "📋 VNC logs:"
            find "$HOME/.vnc" -type f -maxdepth 1 \
              -print -exec tail -100 {} \; 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "🟢 KasmVNC is listening."
          echo ""

          echo "📡 Listening sockets:"
          ss -lntp | grep -E ":${KASMVNC_PORT}\b" || true

          echo ""
          echo "📋 KasmVNC startup:"
          echo "────────────────────────────────────────────────────────────"
          tail -100 /tmp/kasmvnc-start.log || true
          echo "────────────────────────────────────────────────────────────"

          echo ""
          echo "🎉 KDE Plasma desktop is running!"
          echo ""


      # ------------------------------------------------------------
      # INSTALL CLOUDFLARED
      # ------------------------------------------------------------

      - name: ☁️ Install Cloudflare Tunnel
        shell: bash
        run: |
          set -e

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "☁️  INSTALLING CLOUDFLARE TUNNEL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          curl \
            --fail \
            --location \
            --retry 5 \
            --silent \
            --show-error \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            --output /tmp/cloudflared

          chmod +x /tmp/cloudflared

          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared

          cloudflared --version

          echo ""
          echo "✅ Cloudflare Tunnel installed."
          echo ""


      # ------------------------------------------------------------
      # CLOUDFLARE TUNNEL
      # ------------------------------------------------------------

      - name: 🌍 Create Public Desktop URL
        shell: bash
        run: |
          set -e

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║             🌍 CREATING PUBLIC DESKTOP URL                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "☁️ Connecting Cloudflare to:"
          echo "   https://127.0.0.1:${KASMVNC_PORT}"
          echo ""

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url "https://127.0.0.1:${KASMVNC_PORT}" \
            --no-tls-verify \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "CLOUDFLARED_PID=$CLOUDFLARED_PID" >> "$GITHUB_ENV"

          echo "⏳ Waiting for Cloudflare Quick Tunnel..."

          CLOUDFLARE_URL=""

          for i in $(seq 1 90); do

            CLOUDFLARE_URL="$(
              grep -oE \
                'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log |
              head -n1 ||
              true
            )"

            if [ -n "$CLOUDFLARE_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$CLOUDFLARE_URL" ]; then

            echo ""
            echo "❌ Cloudflare tunnel failed."
            echo ""

            cat /tmp/cloudflared.log || true

            exit 1
          fi

          echo "DESKTOP_URL=$CLOUDFLARE_URL" >> "$GITHUB_ENV"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  🎉 DESKTOP READY!                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "🌐 DESKTOP URL"
          echo ""
          echo "👉 $CLOUDFLARE_URL"
          echo ""

          echo "🔐 LOGIN"
          echo ""
          echo "👤 Username : ${KASMVNC_USER}"
          echo "🔑 Password : ${{ inputs.desktop_password }}"
          echo ""

          echo "🖥️  DESKTOP"
          echo ""
          echo "🎨 Environment : KDE Plasma"
          echo "📡 Server      : KasmVNC"
          echo "🖥️  Resolution  : ${{ inputs.resolution }}"
          echo "🏷️  Workspace   : ${{ inputs.workspace_name }}"
          echo "⏱️  Lifetime    : ${{ inputs.keep_alive_hours }} hour(s)"
          echo ""

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🟢 STATUS: ONLINE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # GitHub annotation.
          echo "::notice title=🖥️ KDE Desktop URL::$CLOUDFLARE_URL"

          # --------------------------------------------------------
          # URL artifact
          # --------------------------------------------------------

          printf '%s\n' "$CLOUDFLARE_URL" > /tmp/desktop-url.txt

          # --------------------------------------------------------
          # GitHub rich summary
          # --------------------------------------------------------

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🖥️ KDE Plasma Cloud Desktop

          ## 🟢 Desktop Online

          Your KDE Plasma desktop is ready.

          ### 🌐 Open Desktop

          **[$CLOUDFLARE_URL]($CLOUDFLARE_URL)**

          ---

          ## 🔐 Login

          | Setting | Value |
          |---|---|
          | 👤 Username | \`${KASMVNC_USER}\` |
          | 🔑 Password | \`${{ inputs.desktop_password }}\` |

          > ⚠️ The password is intentionally displayed because this workflow was configured to show it.

          ---

          ## 🖥️ Desktop

          | Setting | Value |
          |---|---|
          | 🎨 Desktop | KDE Plasma |
          | 📡 Remote server | KasmVNC |
          | ☁️ Tunnel | Cloudflare Quick Tunnel |
          | 🖥️ Resolution | ${{ inputs.resolution }} |
          | 🏷️ Workspace | ${{ inputs.workspace_name }} |
          | ⏱️ Lifetime | ${{ inputs.keep_alive_hours }} hour(s) |

          ---

          ## 🚀 Status

          🟢 **ONLINE**

          Keep this GitHub Actions job running while you use the desktop.

          The session will automatically shut down after the selected lifetime.
          EOF

          echo ""


      # ------------------------------------------------------------
      # ARTIFACT
      # ------------------------------------------------------------

      - name: 📦 Publish Desktop URL
        uses: actions/upload-artifact@v4
        with:
          name: desktop-connection
          path: /tmp/desktop-url.txt
          retention-days: 1


      # ------------------------------------------------------------
      # KEEP ALIVE
      # ------------------------------------------------------------

      - name: ⏱️ Keep Desktop Online
        shell: bash
        run: |
          set -e

          HOURS="${{ inputs.keep_alive_hours }}"
          TOTAL_SECONDS=$((HOURS * 60 * 60))
          REMAINING="$TOTAL_SECONDS"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                🟢 DESKTOP IS ONLINE                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          echo "🌐 URL:"
          echo "$DESKTOP_URL"
          echo ""

          echo "🎨 KDE Plasma"
          echo "📡 KasmVNC"
          echo "🖥️  ${{ inputs.resolution }}"
          echo "⏱️  ${HOURS} hour(s)"
          echo ""

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          while [ "$REMAINING" -gt 0 ]; do

            HOURS_LEFT=$((REMAINING / 3600))
            MINUTES_LEFT=$(((REMAINING % 3600) / 60))

            echo "⏳ Remaining: ${HOURS_LEFT}h ${MINUTES_LEFT}m"

            # Sleep in 5-minute chunks.
            SLEEP_FOR=300

            if [ "$REMAINING" -lt "$SLEEP_FOR" ]; then
              SLEEP_FOR="$REMAINING"
            fi

            sleep "$SLEEP_FOR"

            REMAINING=$((REMAINING - SLEEP_FOR))
          done

          echo ""
          echo "⏰ Session lifetime reached."
          echo "🛑 Desktop will now shut down."
          echo ""


      # ------------------------------------------------------------
      # CLEANUP
      # ------------------------------------------------------------

      - name: 🧹 Shutdown Desktop
        if: always()
        shell: bash
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                 🧹 CLEANING UP                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          # Cloudflare
          if [ -n "${CLOUDFLARED_PID:-}" ]; then
            echo "☁️  Stopping Cloudflare Tunnel..."
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi

          # KasmVNC
          echo "📡 Stopping KasmVNC..."

          vncserver -kill :1 \
            >/tmp/kasmvnc-stop.log 2>&1 ||
            true

          if [ -n "${VNC_WRAPPER_PID:-}" ]; then
            kill "$VNC_WRAPPER_PID" 2>/dev/null || true
          fi

          echo ""
          echo "📋 Cloudflare log:"
          echo "────────────────────────────────────────────────────────────"
          tail -100 /tmp/cloudflared.log 2>/dev/null || true
          echo "────────────────────────────────────────────────────────────"

          echo ""
          echo "📋 KasmVNC startup log:"
          echo "────────────────────────────────────────────────────────────"
          tail -100 /tmp/kasmvnc-start.log 2>/dev/null || true
          echo "────────────────────────────────────────────────────────────"

          echo ""
          echo "📋 KasmVNC session logs:"
          echo "────────────────────────────────────────────────────────────"

          find "$HOME/.vnc" \
            -maxdepth 1 \
            -type f \
            -name "*.log" \
            -print \
            -exec tail -50 {} \; \
            2>/dev/null ||
            true

          echo "────────────────────────────────────────────────────────────"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                 🔴 DESKTOP OFFLINE                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "👋 KDE Plasma session terminated."
          echo ""
